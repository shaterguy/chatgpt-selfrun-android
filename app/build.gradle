tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    if (selfRunDriveVersionName ==~ selfRun3VersionPattern) {
        filter {
            selfRun3RetiredAssertions.each { retiredTest -> excludeTestsMatching(retiredTest) }
        }
    }
}

def verifyDriveVariantIdentity = tasks.register('verifyDriveVariantIdentity') {
    group = 'verification'
    doLast {
        def expectedId = 'com.shaterguy.chatgptselfrun.drive'
        if (android.defaultConfig.applicationId != expectedId) throw new GradleException("SelfRun Drive applicationId must be ${expectedId}")
        if (android.defaultConfig.versionCode != selfRunDriveVersionCode
                || android.defaultConfig.versionName != selfRunDriveVersionName) throw new GradleException('SelfRun Drive version identity mismatch')
        if (!(selfRunDriveVersionName ==~ selfRun3VersionPattern)) throw new GradleException('SelfRun 3 version must be 3.x.y, 3.x.y-devN, or 3.x.y-rcN')
        if (selfRunDriveVersionCode <= 2020048) throw new GradleException('SelfRun 3 versionCode must advance the historical stable lineage')
        if (android.testBuildType != 'qaApp') throw new GradleException('SelfRun 3 instrumentation must target the qaApp TEST lineage')
        def testType = android.buildTypes.getByName('qaApp')
        if (testType.applicationIdSuffix != '.test') throw new GradleException('SelfRun Drive TEST applicationId suffix must remain .test')
        def manifest = file('src/main/AndroidManifest.xml').getText('UTF-8')
        if (manifest.contains('android:sharedUserId')) throw new GradleException('sharedUserId is forbidden')
        def authorities = (manifest =~ /android:authorities="([^"]+)"/).collect { it[1] }
        if (authorities.any { it != '${applicationId}.fileprovider' && !it.startsWith('${applicationId}.') }) throw new GradleException('every provider authority must derive from applicationId')

        def src = file('src/main/java/com/shaterguy/chatgptselfrun')
        def service = new File(src, 'SelfRunService.java').getText('UTF-8')
        ['RUN', 'PAUSE', 'RESUME', 'RESUME_STOPPED', 'STOP'].each { action ->
            if (!service.contains('BuildConfig.APPLICATION_ID + ".' + action + '"')) throw new GradleException("${action} action must derive from applicationId")
        }
        if (!service.contains('SelfRun3Coordinator') || !service.contains('SelfRunStoppedResume')
                || service.contains('SelfRunRolloverCoordinator') || service.contains('PHASE_POST_PROTOCOL_DRIVE_SYNC')) throw new GradleException('SelfRunService must be the V3 foreground shell')

        ['SelfRun3Engine.java', 'SelfRun3Ledger.java', 'SelfRun3Coordinator.java',
         'SelfRun3Protocol.java', 'SelfRun3DriveAdapter.java', 'SelfRun3DriveLookup.java',
         'SelfRun3WebAdapter.java', 'SelfRun3BootstrapTransport.java', 'SelfRun3DispatchScript.java',
         'SelfRun3PowerPolicy.java', 'SelfRun3RunMarker.java', 'SelfRun3UserInput.java',
         'SelfRun3StrictJson.java', 'SelfRun3ResultWatchdog.java', 'SelfRun3RuntimeSettings.java',
         'SelfRun3TurnStallPolicy.java', 'SelfRun3TurnStallNotifier.java', 'SelfRunStoppedResume.java'].each { name ->
            if (!new File(src, name).isFile()) throw new GradleException("SelfRun 3 source missing: ${name}")
        }
        def engine = new File(src, 'SelfRun3Engine.java').getText('UTF-8')
        def coordinator = new File(src, 'SelfRun3Coordinator.java').getText('UTF-8')
        def ledger = new File(src, 'SelfRun3Ledger.java').getText('UTF-8')
        def protocol = new File(src, 'SelfRun3Protocol.java').getText('UTF-8')
        def drive = new File(src, 'SelfRun3DriveAdapter.java').getText('UTF-8')
        def watchdog = new File(src, 'SelfRun3ResultWatchdog.java').getText('UTF-8')
        def settings = new File(src, 'SelfRun3RuntimeSettings.java').getText('UTF-8')
        def stall = new File(src, 'SelfRun3TurnStallPolicy.java').getText('UTF-8')
        def notifier = new File(src, 'SelfRun3TurnStallNotifier.java').getText('UTF-8')
        def web = new File(src, 'SelfRun3WebAdapter.java').getText('UTF-8')
        def dispatch = new File(src, 'SelfRun3DispatchScript.java').getText('UTF-8')
        def bootstrap = new File(src, 'SelfRun3BootstrapTransport.java').getText('UTF-8')
        def power = new File(src, 'SelfRun3PowerPolicy.java').getText('UTF-8')
        def userNext = new File(src, 'UserNextInputStore.java').getText('UTF-8')
        def store = new File(src, 'SelfRunStore.java').getText('UTF-8')
        def activity = new File(src, 'SelfRunNewActivity.java').getText('UTF-8')
        def stoppedResume = new File(src, 'SelfRunStoppedResume.java').getText('UTF-8')
        if (!engine.contains('taskId') || !engine.contains('turnId') || !engine.contains('requestId')
                || !engine.contains('lastConsumedInputRevision') || !engine.contains('SelfRun3StrictJson.parseObject')) throw new GradleException('V3 task/turn/request, input ledger and strict result identity contract are required')
        if (!engine.contains('case REPAIR') || !engine.contains('repairTargetDocumentId')
                || !engine.contains('activeCount(original)<2') || !engine.contains('maybeMerge')
                || !engine.contains('routingPhase') || !engine.contains('usableParallelPlan')) throw new GradleException('V3 fresh repair, bounded parallelism, merge and resilient result routing are required')
        if (!engine.contains('RESUME_STOPPED') || !stoppedResume.contains('ledger.load(target)')
                || !stoppedResume.contains('DRIVE_BINDING_MISMATCH') || !stoppedResume.contains('coordinator.onStart(SelfRunService.ACTION_RUN)'))
            throw new GradleException('V3 user-stopped task recovery must reuse the pinned ledger and Drive identity')
        if (engine.contains('full handoff missing') || engine.contains('verification required for DONE')
                || engine.contains('branch identity mismatch')) throw new GradleException('V3 app must not reject committed results for AI checkpoint semantics')
        if (!engine.contains('case RESULT_BASELINE') || !engine.contains('case RESULT_MUTATED')
                || !engine.contains('canonicalPostConfirmedElapsed') || !engine.contains('resultBodyMutationObserved')
                || !watchdog.contains('DEFAULT_RESULT_REPAIR_MINUTES * 60_000L')) throw new GradleException('V3 stale-result evidence ledger is required')
        if (!settings.contains('PREFS = "selfrun3_runtime_settings"')
                || !settings.contains('DEFAULT_RESULT_REPAIR_MINUTES = 10L')
                || !settings.contains('DEFAULT_STALL_ALERT_MINUTES = 125L')
                || !settings.contains('DEFAULT_RESULT_POLL_SECONDS = 30L')
                || !settings.contains('DEFAULT_WEB_PREPARATION_SECONDS = 90L')
                || !settings.contains('value <= Long.MAX_VALUE / multiplier')) throw new GradleException('V3 configurable timing defaults and overflow-safe persistence are required')
        if (!coordinator.contains('runtimeSettings.resultRepairMs()')
                || !coordinator.contains('runtimeSettings.resultPollMs()')
                || !notifier.contains('runtimeSettings.stallAlertMs()')
                || !notifier.contains('settingsPrefs.registerOnSharedPreferenceChangeListener(settingsListener)')
                || !web.contains('prepareTimeoutMs = runtimeSettings.webPreparationMs()')
                || !stall.contains('long alertAfterMs')) throw new GradleException('V3 runtime must consume all four operator timing settings')
        if (power.contains('NORMAL_WAIT_POLL_MS') || power.contains('WEB_PREPARATION_MAX_MS')) throw new GradleException('operator-configurable timings must not remain fixed in power policy')
        if (engine.contains('MAX_RESULT_BYTES') || drive.contains('MAX_RESULT_BYTES')
                || userNext.contains('MAX_USER_UTF8_BYTES') || userNext.contains('MAX_COMBINED_UTF8_BYTES')
                || userNext.contains('withinUtf8Limit') || store.contains('MAX_ATTACHMENTS_PER_RUN')
                || store.contains('MAX_ATTACHMENT_BYTES') || drive.contains('MAX_ATTACHMENT_BYTES')
                || drive.contains('ATTACHMENT_TOO_LARGE') || activity.contains('MAX_ATTACHMENTS_PER_RUN')) throw new GradleException('arbitrary SelfRun payload and attachment ceilings must remain removed')
        if (!ledger.contains('turns(task_id TEXT NOT NULL,ordinal INTEGER NOT NULL,turn_id TEXT NOT NULL,document_id TEXT NOT NULL,result TEXT NOT NULL,committed INTEGER NOT NULL')
                || !ledger.contains('UNIQUE(task_id,turn_id)')) throw new GradleException('V3 durable turn ledger identity constraints are required')
        if (!protocol.contains('SELF_RUN_SKILL_DOCUMENT_ID=') || !protocol.contains('RESULT_DOCUMENT_ID=')
                || !protocol.contains('PREVIOUS_RESULT_DOCUMENT_ID=') || !protocol.contains('PROFILE_REGISTRY_CHAT=')) throw new GradleException('V3 canonical prompt contract is required')
        if (!dispatch.contains("'/backend-api/f/conversation'") || !dispatch.contains('source:\'canonical_post\'')
                || !dispatch.contains("stage:'turn_request'") || !dispatch.contains('owner.turn') || !dispatch.contains('owner.request')) throw new GradleException('V3 canonical outgoing request observer is required')
        if (!bootstrap.contains('READY_TO_SUBMIT') || !bootstrap.contains('composerValue') || bootstrap.contains('responseText')) throw new GradleException('V3 bootstrap must prepare input without response polling')
        if (!web.contains('listener.onStarted') || !web.contains('captureConversation()') || !web.contains('quiesce()')) throw new GradleException('V3 browser adapter must stop after outgoing request observation')
        if (!coordinator.contains('SelfRun3Engine.receiptDelayMs')
                || !coordinator.contains('V3_SUBMISSION_OUTCOME_UNCERTAIN')
                || !coordinator.contains('proof", "conversation_url"')
                || !engine.contains('acceptanceProof","committed_result"')) throw new GradleException('V3 finite positive-proof submission reconciliation is required')
    }
}
