    'com.shaterguy.chatgptselfrun.BootstrapResultPolicyTest.serviceTargetErrorRecoveryUsesCanonicalEntryOnlyBeforeConversation',
    'com.shaterguy.chatgptselfrun.ChatReasoningProcessRecreationPolicyTest.processInitializerAndContextExplicitLookupAreWired',
    'com.shaterguy.chatgptselfrun.CompletedRunCacheCleanupWiringTest.terminalDoneAcknowledgesBeforeCleanupAndTeardown',
    'com.shaterguy.chatgptselfrun.CompletedRunCacheCleanupWiringTest.genericDestroyAndGenericCleanupDoNotClearApplicationCache',
    'com.shaterguy.chatgptselfrun.ContinuationDiagnosticsPolicyTest.continuationFailuresReachDeduplicatedRunLog',
    'com.shaterguy.chatgptselfrun.DriveInitializationPolicyTest.newExecutionDocStoresExactOriginalRequirement',
    'com.shaterguy.chatgptselfrun.DriveInitializationPolicyTest.signalDocumentTransportNeverFallsBackToRequirementBody',
    'com.shaterguy.chatgptselfrun.DriveSignalIdentityWiringTest.signalDocumentTransportUsesDriveIdsAsOngoingConsumptionAuthority',
    'com.shaterguy.chatgptselfrun.DriveVariantPolicyTest.continuationUsesDomVerificationWithoutAnyGuardPhase',
    'com.shaterguy.chatgptselfrun.DriveVariantPolicyTest.routineNotificationIsSilentAndAlertsAreEventDriven',
    'com.shaterguy.chatgptselfrun.DriveVariantPolicyTest.signalCursorReplacesCommitMetadata',
    'com.shaterguy.chatgptselfrun.DriveVariantPolicyTest.globalRunsPathAndExistingFolderIdPolicyArePreserved',
    'com.shaterguy.chatgptselfrun.HeadlessDisplayOutputWiringTest.protocolWaitDetachesWithoutRecoveryAttachOrDomPolling',
    'com.shaterguy.chatgptselfrun.HeadlessDisplayOutputWiringTest.rendererGoneDuringProtocolWaitCancelsNoStartWithoutRollover',
    'com.shaterguy.chatgptselfrun.PostDriveConfirmationDelayPolicyTest.bothDriveSuccessPathsUseTheSameDelayedOutcome',
    'com.shaterguy.chatgptselfrun.PostDriveConfirmationDelayPolicyTest.confirmedDriveOutcomeWaitsFiveSecondsBeforeExistingProgression',
    'com.shaterguy.chatgptselfrun.SelfRunContinuationSubmissionTest.nativeBindsProtocolBeforeEitherSubmitPath',
    'com.shaterguy.chatgptselfrun.SelfRunDriveCommandAckPollingTest.normalCompletionHasNoDriveOrButtonPollingClock',
    'com.shaterguy.chatgptselfrun.SelfRunDriveCommandAckPollingTest.bootstrapSubmissionStartsProtocolOwnedWait',
    'com.shaterguy.chatgptselfrun.SelfRunDriveDev3PolicyTest.callbackIsFullyFenced',
    'com.shaterguy.chatgptselfrun.SelfRunDriveDev3PolicyTest.driveStartsOnlyAfterProtocolComplete',
    'com.shaterguy.chatgptselfrun.SelfRunDriveTurnInfoSourceTest.workProfileIsReadFromPendingDriveCompletion',
    'com.shaterguy.chatgptselfrun.SelfRunDriveTurnInfoSourceTest.invalidDriveProfileUsesRewriteWithoutAssistantControlState',
    'com.shaterguy.chatgptselfrun.SelfRunGeneralChatPolicyTest.captureLogRequiresPersistedConversationRoute',
    'com.shaterguy.chatgptselfrun.SelfRunHealthPolicyTest.versionIdentityUses232Lineage',
    'com.shaterguy.chatgptselfrun.SelfRunNextInputDev6Test.sourceKeepsStableResumeBaselineAndUsesExistingDurableCompletion',
    'com.shaterguy.chatgptselfrun.SelfRunPauseResumeTest.manualResumeBaselinesThenForcesContinue',
    'com.shaterguy.chatgptselfrun.SelfRunRolloverWiringTest.predecessorLateCallbacksAreFencedByRunAndEpoch',
    'com.shaterguy.chatgptselfrun.SelfRunRolloverWiringTest.pausePrecedesPendingRolloverAndPausedStickyRunDoesNotResumeIt',
