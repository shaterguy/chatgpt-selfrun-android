plugins {
    id 'com.android.application'
}

def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n') + '"'
}
def androidReadToken = System.getenv('SELF_RUN_ANDROID_READ_TOKEN') ?: ''

android {
    namespace 'com.shaterguy.chatgptselfrun'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shaterguy.chatgptselfrun'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '0.1.1-dev1'
        buildConfigField 'String', 'SELF_RUN_COMMAND_BRIDGE_URL',
                buildConfigString('https://selfrun-command-bridge.vercel.app')
        buildConfigField 'String', 'SELF_RUN_ANDROID_READ_TOKEN',
                buildConfigString(androidReadToken)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
