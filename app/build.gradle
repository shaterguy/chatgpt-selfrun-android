plugins {
    id 'com.android.application'
}

def selfRunDriveVersionCode = 3000004
def selfRunDriveVersionName = '3.0.0-dev4'

android {
    namespace 'com.shaterguy.chatgptselfrun'
    compileSdk 36
    testBuildType 'qaApp'

    defaultConfig {
        applicationId 'com.shaterguy.chatgptselfrun.drive'
        minSdk 26
        targetSdk 36
        versionCode selfRunDriveVersionCode
        versionName selfRunDriveVersionName
        testInstrumentationRunner 'com.shaterguy.chatgptselfrun.SelfRunAndroidTestRunner'
        manifestPlaceholders = [selfRunAppLabel: 'SelfRun Drive']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        qaApp {
            initWith release
            applicationIdSuffix '.test'
            manifestPlaceholders = [selfRunAppLabel: 'SelfRun Drive TEST']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.webkit:webkit:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

def verifyDriveVariantIdentity = tasks.register('verifyDriveVariantIdentity') {
    group = 'verification'
    doLast {
        def expectedId = 'com.shaterguy.chatgptselfrun.drive'
        if (android.defaultConfig.applicationId != expectedId) {
            throw new GradleException("SelfRun Drive applicationId must be ${expectedId}")
        }
        if (android.defaultConfig.versionCode != selfRunDriveVersionCode
                || android.defaultConfig.versionName != selfRunDriveVersionName) {
            throw new GradleException('SelfRun Drive version identity mismatch')
        }
        if (selfRunDriveVersionName != '3.0.0-dev4') {
            throw new GradleException('SelfRun 3 development version must be 3.0.0-dev4')
        }
        if (selfRunDriveVersionCode <= 2020048) {
            throw new GradleException('SelfRun 3 versionCode must advance the 2.3.2 stable lineage')
        }
        if (android.testBuildType != 'qaApp') {
            throw new GradleException('SelfRun 3 instrumentation must target the qaApp TEST lineage')
        }
        def testType = android.buildTypes.getByName('qaApp')
        if (testType.applicationIdSuffix != '.test') {
            throw new GradleException('SelfRun Drive TEST applicationId suffix must remain .test')
        }
        def manifest = file('src/main/AndroidManifest.xml').getText('UTF-8')
        if (manifest.contains('android:sharedUserId')) {
            throw new GradleException('sharedUserId is forbidden')
        }
        def authorities = (manifest =~ /android:authorities="([^"]+)"/).collect { it[1] }
        if (authorities.any { it != '${applicationId}.fileprovider' && !it.startsWith('${applicationId}.') }) {
            throw new GradleException('every provider authority must derive from applicationId')
        }

        def src = file('src/main/java/com/shaterguy/chatgptselfrun')
        def service = new File(src, 'SelfRunService.java').getText('UTF-8')
        ['RUN', 'PAUSE', 'RESUME', 'STOP'].each { action ->
            if (!service.contains('BuildConfig.APPLICATION_ID + ".' + action + '"')) {
                throw new GradleException("${action} action must derive from applicationId")
            }
        }
        if (!service.contains('SelfRun3Coordinator')
                || service.contains('SelfRunRolloverCoordinator')
                || service.contains('PHASE_POST_PROTOCOL_DRIVE_SYNC')) {
            throw new GradleException('SelfRunService must be the V3 foreground shell, not the V2 state machine')
        }

        ['SelfRun3Engine.java', 'SelfRun3Ledger.java', 'SelfRun3Coordinator.java',
         'SelfRun3Protocol.java', 'SelfRun3DriveAdapter.java', 'SelfRun3DriveLookup.java',
         'SelfRun3WebAdapter.java', 'SelfRun3PowerPolicy.java', 'SelfRun3RunMarker.java',
         'SelfRun3UserInput.java', 'SelfRun3StrictJson.java'].each { name ->
            if (!new File(src, name).isFile()) throw new GradleException("SelfRun 3 source missing: ${name}")
        }
        def engine = new File(src, 'SelfRun3Engine.java').getText('UTF-8')
        def coordinator = new File(src, 'SelfRun3Coordinator.java').getText('UTF-8')
        def ledger = new File(src, 'SelfRun3Ledger.java').getText('UTF-8')
        def protocol = new File(src, 'SelfRun3Protocol.java').getText('UTF-8')
        def power = new File(src, 'SelfRun3PowerPolicy.java').getText('UTF-8')
        if (!engine.contains('taskId') || !engine.contains('turnId') || !engine.contains('requestId')
                || !engine.contains('lastConsumedInputRevision') || !engine.contains('SelfRun3StrictJson.parseObject')) {
            throw new GradleException('V3 task/turn/request, input ledger and strict result contract are required')
        }
        if (!ledger.contains('beginTransaction') || !ledger.contains('PreserveCorruptionHandler')) {
            throw new GradleException('V3 transactional ledger and non-destructive corruption handling are required')
        }
        if (!coordinator.contains('MISSED_CALLBACK_PROBE_MS')
                || !coordinator.contains('scheduleMissedProbe')
                || !coordinator.contains('SelfRun3RunMarker')) {
            throw new GradleException('V3 bounded reconciliation and explicit lineage are required')
        }
        if (!protocol.contains('contract-version: 3.0.0')
                || !protocol.contains('RESULT_DOCUMENT_ID')
                || !protocol.contains('AI 유지보수·자체 코드 수정·자동 패치 에이전트가 없다')) {
            throw new GradleException('V3 result contract and AI-maintenance exclusion are required')
        }
        if (!power.contains('NORMAL_WAIT_POLL_MS = 0L')) {
            throw new GradleException('normal V3 response waiting must not poll')
        }
        def host = new File(src, 'HeadlessWebViewHost.java').getText('UTF-8')
        if (!host.contains('virtualDisplay.setSurface(null)')
                || !host.contains('virtualDisplay.setSurface(surface)')) {
            throw new GradleException('detachable VirtualDisplay Surface support must be preserved')
        }
        def webConfig = new File(src, 'WebViewConfig.java').getText('UTF-8')
        if (!webConfig.contains('RequestProfileScript.installDocumentStart')
                || !webConfig.contains('ChatGptTurnProtocolScript.installDocumentStart')) {
            throw new GradleException('profile and protocol browser adapters are required')
        }
    }
}
