plugins {
    id 'com.android.application'
}

def selfRunDriveVersionCode = 3001021
def selfRunDriveVersionName = '3.0.1-dev21'
def selfRun3VersionPattern = ~/^3\.0\.[0-9]+(?:-(?:dev|rc)[0-9]+)?$/

android {
    namespace 'com.shaterguy.chatgptselfrun'
    compileSdk 36
    testBuildType 'qaApp'

    defaultConfig {
        applicationId 'com.shaterguy.chatgptselfrun.drive'
        minSdk 26
        targetSdk 36
        versionCode selfRunDriveVersionCode
        versionName selfRunDriveVersionName
        testInstrumentationRunner 'com.shaterguy.chatgptselfrun.SelfRunAndroidTestRunner'
        manifestPlaceholders = [selfRunAppLabel: 'SelfRun Drive']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        qaApp {
            initWith release
            applicationIdSuffix '.test'
            manifestPlaceholders = [selfRunAppLabel: 'SelfRun Drive TEST']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.webkit:webkit:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

def verifyDriveVariantIdentity = tasks.register('verifyDriveVariantIdentity') {
    group = 'verification'
    doLast {
        def expectedId = 'com.shaterguy.chatgptselfrun.drive'
        if (android.defaultConfig.applicationId != expectedId) throw new GradleException("SelfRun Drive applicationId must be ${expectedId}")
        if (android.defaultConfig.versionCode != selfRunDriveVersionCode
                || android.defaultConfig.versionName != selfRunDriveVersionName) throw new GradleException('SelfRun Drive version identity mismatch')
        if (!(selfRunDriveVersionName ==~ selfRun3VersionPattern)) throw new GradleException('SelfRun 3 version must use the 3.0.x stable/dev/rc lineage')
        if (selfRunDriveVersionCode <= 2020048) throw new GradleException('SelfRun 3 versionCode must advance the historical stable lineage')
        if (android.testBuildType != 'qaApp') throw new GradleException('SelfRun 3 instrumentation must target the qaApp TEST lineage')
        def testType = android.buildTypes.getByName('qaApp')
        if (testType.applicationIdSuffix != '.test') throw new GradleException('SelfRun Drive TEST applicationId suffix must remain .test')
        def manifest = file('src/main/AndroidManifest.xml').getText('UTF-8')
        if (manifest.contains('android:sharedUserId')) throw new GradleException('sharedUserId is forbidden')
        def authorities = (manifest =~ /android:authorities="([^"]+)"/).collect { it[1] }
        if (authorities.any { it != '${applicationId}.fileprovider' && !it.startsWith('${applicationId}.') }) throw new GradleException('every provider authority must derive from applicationId')

        def src = file('src/main/java/com/shaterguy/chatgptselfrun')
        def service = new File(src, 'SelfRunService.java').getText('UTF-8')
        ['RUN', 'PAUSE', 'RESUME', 'STOP'].each { action ->
            if (!service.contains('BuildConfig.APPLICATION_ID + ".' + action + '"')) throw new GradleException("${action} action must derive from applicationId")
        }
        if (!service.contains('SelfRun3Coordinator') || !service.contains('V3_STALE_RUN_RETIRED')
                || service.contains('V3_LEGACY_RUN_PRESERVED') || service.contains('SelfRunRolloverCoordinator')
                || service.contains('PHASE_POST_PROTOCOL_DRIVE_SYNC')) {
            throw new GradleException('SelfRunService must be V3-only and must not preserve the retired executor')
        }

        ['SelfRun3Engine.java', 'SelfRun3Ledger.java', 'SelfRun3Coordinator.java',
         'SelfRun3Protocol.java', 'SelfRun3DriveAdapter.java', 'SelfRun3DriveLookup.java',
         'SelfRun3WebAdapter.java', 'SelfRun3BootstrapTransport.java', 'SelfRun3ComposerTransport.java',
         'SelfRun3PowerPolicy.java', 'SelfRun3RunMarker.java', 'SelfRun3UserInput.java',
         'SelfRun3StrictJson.java'].each { name ->
            if (!new File(src, name).isFile()) throw new GradleException("SelfRun 3 source missing: ${name}")
        }
        def engine = new File(src, 'SelfRun3Engine.java').getText('UTF-8')
        def coordinator = new File(src, 'SelfRun3Coordinator.java').getText('UTF-8')
        def ledger = new File(src, 'SelfRun3Ledger.java').getText('UTF-8')
        def protocol = new File(src, 'SelfRun3Protocol.java').getText('UTF-8')
        def drive = new File(src, 'SelfRun3DriveAdapter.java').getText('UTF-8')
        def web = new File(src, 'SelfRun3WebAdapter.java').getText('UTF-8')
        def bootstrap = new File(src, 'SelfRun3BootstrapTransport.java').getText('UTF-8')
        def composer = new File(src, 'SelfRun3ComposerTransport.java').getText('UTF-8')
        def power = new File(src, 'SelfRun3PowerPolicy.java').getText('UTF-8')
        def markerFacade = new File(src, 'SelfRunSignalTransport.java').getText('UTF-8')
        if (!engine.contains('taskId') || !engine.contains('turnId') || !engine.contains('requestId')
                || !engine.contains('lastConsumedInputRevision') || !engine.contains('SelfRun3StrictJson.parseObject')) throw new GradleException('V3 task/turn/request, input ledger and strict result contract are required')
        if (!engine.contains('case REPAIR') || !engine.contains('put(v, "requestId", nextRequest)')) throw new GradleException('V3 repair must use a fresh physical request without replacing the logical turn')
        if (!ledger.contains('beginTransaction') || !ledger.contains('PreserveCorruptionHandler')) throw new GradleException('V3 transactional ledger and non-destructive corruption handling are required')
        if (!coordinator.contains('MISSED_CALLBACK_PROBE_MS') || !coordinator.contains('scheduleMissedProbe') || !coordinator.contains('SelfRun3RunMarker')) throw new GradleException('V3 bounded reconciliation and explicit lineage are required')
        if (!protocol.contains('CONTRACT_VERSION = "3.0.0"')
                || !protocol.contains('SELF_RUN_SKILL_DOCUMENT_ID')
                || !protocol.contains('1qPTSmJG8GpXMSyIGm6SIpgx6-LtWCBGVW3WUpoKj9fs')
                || !protocol.contains('RESULT_DOCUMENT_ID') || !protocol.contains('REQUIREMENT_DOCUMENT_ID')
                || !protocol.contains('PREVIOUS_RESULT_DOCUMENT_ID') || !protocol.contains('FOLDER_ID=')
                || !protocol.contains('RECEIPT=') || !protocol.contains('WORK_PROFILE_CHOICES')
                || !protocol.contains('compactWorkChoices')
                || protocol.contains('static final String CONTRACT =') || protocol.contains('RESULT_IDENTITY_TEMPLATE')
                || protocol.contains('ProfileRegistry.exportWorkJson') || protocol.contains('[최초 요구사항 원문]')
                || protocol.contains('REQUEST_ID=') || protocol.contains('SELF_RUN_TURN_COMPLETED')
                || protocol.contains('[SELF_RUN_TURN_DOCUMENT_RETRY ')
                || protocol.contains('attachment.name') || protocol.contains('attachment.uri')) {
            throw new GradleException('V3 prompt must be a compact canonical-SKILL envelope without retired contract payloads')
        }
        if (!markerFacade.contains('SelfRun3RunMarker.mark') || !markerFacade.contains('SelfRun3RunMarker.current')
                || markerFacade.contains('DriveSignalDocumentIdentity') || markerFacade.contains('SelfRunProtocolRules')
                || markerFacade.contains('getSharedPreferences')) {
            throw new GradleException('launch marker facade must be V3-only')
        }
        if (!drive.contains('SelfRun3DriveLookup.findSingleDocumentId') || !drive.contains('REQUIREMENT_READBACK_MISMATCH') || drive.contains('DriveSignalParser')) throw new GradleException('V3 must use pinned Drive documents with exact original-requirement readback')
        if (web.contains('SelfRunContinuationDom') || !web.contains('SelfRun3BootstrapTransport.prepare')
                || !web.contains('SelfRun3BootstrapTransport.submit') || !web.contains('SelfRun3ComposerTransport.prepareContinuation')
                || !web.contains('SelfRun3ComposerTransport.submitContinuation') || !web.contains('observeWithoutBinding(script)')) {
            throw new GradleException('V3 bootstrap must use verified unbound prepare and continuation must stay V3-owned')
        }
        if (bootstrap.contains('SelfRunContinuationDom') || !bootstrap.contains("state:'prepared'") || !bootstrap.contains('READY_TO_SUBMIT')) {
            throw new GradleException('V3 bootstrap must be independent and retain prepared-submit verification')
        }
        if (composer.contains('__srFind') || composer.contains('WebUiCalibrationStore') || composer.contains('offsetParent')
                || composer.contains('UserNextInputStore') || composer.contains('SelfRunContinuationDom')
                || composer.contains('prepareInitial') || composer.contains('submitInitial')) {
            throw new GradleException('V3 composer transport must be continuation-only and independent of retired identity/calibration')
        }
        if (!composer.contains("selfrun-drive:v3-cont:") || !composer.contains("state:'clearing'")
                || !composer.contains("state:'inputting'") || !composer.contains("state:'prepared'")
                || !composer.contains("if(!e.isConnected)return") || !composer.contains('String.fromCharCode(13)')) {
            throw new GradleException('V3 continuation must be restart-safe and escape-safe across rich-editor replacement')
        }
        if (!power.contains('NORMAL_WAIT_POLL_MS = 0L')) throw new GradleException('normal V3 response waiting must not poll')
        def host = new File(src, 'HeadlessWebViewHost.java').getText('UTF-8')
        if (!host.contains('virtualDisplay.setSurface(null)') || !host.contains('virtualDisplay.setSurface(surface)')) throw new GradleException('detachable VirtualDisplay Surface support must be preserved')
        def webConfig = new File(src, 'WebViewConfig.java').getText('UTF-8')
        if (!webConfig.contains('RequestProfileScript.installDocumentStart') || !webConfig.contains('ChatGptTurnProtocolScript.installDocumentStart')) throw new GradleException('profile and protocol browser adapters are required')

        ['build-drive-test.yml', 'build-drive-v1.yml', 'build-selfrun-v2-test.yml',
         'build-selfrun-v3-test.yml', 'release-drive-v1.yml'].each { name ->
            if (rootProject.file(".github/workflows/${name}").exists()) throw new GradleException("retired workflow remains: ${name}")
        }
        ['docs/SELF_RUN_DRIVE_V1_PROTOCOL.md', 'docs/SELF_RUN_DRIVE_RUNTIME.md'].each { path ->
            if (rootProject.file(path).exists()) throw new GradleException("retired protocol document remains: ${path}")
        }
    }
}
