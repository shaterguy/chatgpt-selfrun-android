name: Rework SelfRun Drive notification events

on:
  push:
    branches:
      - 'selfrun-drive/v1.1.0-dev2'

permissions:
  contents: write

jobs:
  rework:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply notification rework
        run: |
          set -euo pipefail
          python3 .github/scripts/rework_drive_notifications.py
      - name: Verify patch contract
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          git diff --check
      - name: Commit rework
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/com/shaterguy/chatgptselfrun/NotificationHelper.java \
            app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/DriveVariantPolicyTest.java \
            tools/verify_drive_variant.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'expected rework diff is empty' >&2
            exit 1
          fi
          git commit -m 'fix: make Drive notification alerts event-driven'
          git push origin HEAD:selfrun-drive/v1.1.0-dev2
