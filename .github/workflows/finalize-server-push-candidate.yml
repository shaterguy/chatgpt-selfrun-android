name: Finalize server-push candidate

on:
  push:
    branches:
      - v3.2.5-dev3
    paths:
      - .github/workflows/finalize-server-push-candidate.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v3.2.5-dev3
          fetch-depth: 1
      - name: Apply final security and wording fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          coordinator = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Coordinator.java')
          text = coordinator.read_text(encoding='utf-8')
          old = '''            log.record(store, "V3_PUSH_ACK_PERSIST_FAILED",\n                    "event=" + safeCode(push.eventId) + ";error=" + error.getClass().getSimpleName());'''
          new = '''            log.record(store, "V3_PUSH_ACK_PERSIST_FAILED",\n                    "error=" + error.getClass().getSimpleName());'''
          if old in text:
              text = text.replace(old, new, 1)
          if '"event=" + safeCode(push.eventId)' in text:
              raise SystemExit('push capability still appears in ACK failure log')
          coordinator.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('## Result 대기 작업 방식', '## Result 대기 작업 모드')
          text = text.replace('설정의 `작업 방식`은 `SERVER`와 `ON_DEVICE`를 선택합니다.',
                              '설정의 `작업 모드`는 `SERVER`와 `ON_DEVICE`를 선택합니다.')
          text = text.replace('Result 대기 작업 방식을 관리합니다.', 'Result 대기 작업 모드를 관리합니다.')
          if '설정의 `작업 방식`' in text:
              raise SystemExit('legacy work-mode wording remains')
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Commit final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Coordinator.java README.md
          git diff --cached --quiet && exit 0
          git commit -m "fix: redact push capability and align work mode wording"
          git push origin HEAD:v3.2.5-dev3
