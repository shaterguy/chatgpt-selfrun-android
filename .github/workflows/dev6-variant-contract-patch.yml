name: Align dev6 variant contract

on:
  push:
    branches:
      - selfrun-v3/v3.2.5-dev6-result-identity-repair
    paths:
      - .github/workflows/dev6-variant-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Replace obsolete identity-test contract name
        shell: bash
        run: |
          set -euo pipefail
          old='committedResultBeyondFormer512KiBGateIgnoresFormerIdentityGate'
          new='committedResultBeyondFormer512KiBGateKeepsMechanicalIdentityGate'
          count="$(git grep -l "$old" -- tools app || true | wc -l)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/verify_drive_variant.sh')
          s = p.read_text()
          old = 'committedResultBeyondFormer512KiBGateIgnoresFormerIdentityGate'
          new = 'committedResultBeyondFormer512KiBGateKeepsMechanicalIdentityGate'
          if s.count(old) != 1:
              raise SystemExit('expected one obsolete variant-contract assertion')
          p.write_text(s.replace(old, new, 1))
          PY
          ! git grep -F 'committedResultBeyondFormer512KiBGateIgnoresFormerIdentityGate' -- tools app
          git diff --check
      - name: Commit variant contract and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/dev6-variant-contract-patch.yml
          git add tools/verify_drive_variant.sh
          git commit -m 'test: align variant contract with dev6 identity rule'
          git push origin HEAD:selfrun-v3/v3.2.5-dev6-result-identity-repair
