name: SelfRun SR59 OS Cold Process Acceptance

on:
  push:
    branches:
      - 'verification/sr59pxha-cold-process'

permissions:
  contents: read

jobs:
  cold-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SELFRUN_FIREBASE_API_KEY: ${{ secrets.SELFRUN_FIREBASE_API_KEY }}
      SELFRUN_FIREBASE_APPLICATION_ID: ${{ secrets.SELFRUN_FIREBASE_APPLICATION_ID }}
      SELFRUN_FIREBASE_PROJECT_ID: ${{ secrets.SELFRUN_FIREBASE_PROJECT_ID }}
      SELFRUN_FIREBASE_SENDER_ID: ${{ secrets.SELFRUN_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Verify original product source boundary and fetch canonical signed TEST APK
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e c9e1325bbd66660303c893562b6acdd9a164c66c^{commit}
          git diff --name-only c9e1325bbd66660303c893562b6acdd9a164c66c HEAD | sort > actual-verification-files.txt
          printf '%s\n' \
            '.github/workflows/verify-sr59-cold-process.yml' \
            'app/src/androidTest/java/com/shaterguy/chatgptselfrun/ColdProcessPersistenceAndroidTest.java' \
            'app/src/androidTest/java/com/shaterguy/chatgptselfrun/SelfRunAndroidTestRunner.java' \
            'tools/verify_sr59_cold_process.sh' | sort > expected-verification-files.txt
          diff -u expected-verification-files.txt actual-verification-files.txt
          mkdir -p release-output
          curl -fLSs --retry 3 -o release-output/SelfRun-Drive-TEST-v4.0.10-dev4.apk \
            'https://github.com/shaterguy/chatgpt-selfrun-android/releases/download/selfrun-drive-test-v4.0.10-dev4-sr59pxha/SelfRun-Drive-TEST-v4.0.10-dev4.apk'
          echo '1e76d9f4ad4ca4e0232590bee655b270047fd876d0f9fbf620ae5c93869b7c8e  release-output/SelfRun-Drive-TEST-v4.0.10-dev4.apk' | sha256sum -c -

      - name: Build and sign separate verification-only instrumentation APK
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:assembleQaAppAndroidTest
          ANDROID_TEST_RAW="$(find app/build/outputs/apk/androidTest -type f -name '*.apk' -print -quit)"
          test -s "$ANDROID_TEST_RAW"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 "$ANDROID_TEST_RAW" release-output/cold-androidTest-aligned.apk
          PASS_FILE="$RUNNER_TEMP/sr59-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh \
            release-output/cold-androidTest-aligned.apk "$PASS_FILE" \
            release-output/SelfRun-Drive-TEST-v4.0.10-dev4-cold-androidTest.apk \
            > release-output/cold-androidTest-signing-evidence.txt
          "$BT/apksigner" verify --print-certs --verbose \
            release-output/SelfRun-Drive-TEST-v4.0.10-dev4-cold-androidTest.apk | \
            grep -F '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e'

      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Real OS force-stop and fresh process acceptance
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: bash tools/verify_sr59_cold_process.sh

      - name: Upload evidence only, never app rebuilds
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sr59-cold-process-proof-${{ github.run_id }}
          path: |
            cold-process-evidence/
            release-output/cold-androidTest-signing-evidence.txt
          if-no-files-found: ignore
          retention-days: 30
