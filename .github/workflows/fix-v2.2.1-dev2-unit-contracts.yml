name: Fix SelfRun Drive v2.2.1-dev2 unit contracts

on:
  push:
    branches:
      - selfrun-drive/v2.2.1-dev2
    paths:
      - .github/workflows/fix-v2.2.1-dev2-unit-contracts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore bootstrap evidence and align policy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def one(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          dom = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunContinuationDom.java')
          one(dom,
              "if(conversation){writeMarker({...m,state:'confirmed',confirmedAt:Date.now()});return result('SUBMISSION_CONFIRMED','bootstrap conversation route confirmed;users='+users+';baseline='+baseline+';control='+c.state+';conversation=1');}",
              "if(conversation&&started){writeMarker({...m,state:'confirmed',confirmedAt:Date.now()});return result('SUBMISSION_CONFIRMED','bootstrap conversation route and user turn confirmed;users='+users+';baseline='+baseline+';control='+c.state+';conversation=1');}")

          submission = Path('app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunContinuationSubmissionTest.java')
          one(submission,
              '        assertTrue(observer.contains("completionObserver(runId, observerToken, stabilityMs)"));',
              '        assertTrue(observer.contains("completionObserver(runId, observerToken, stabilityMs, staleStopMs)"));\n        assertTrue(completion.contains("return completionObserver(runId, observerToken, stabilityMs, STALE_STOP_RESYNC_MS)"));')

          verification = Path('app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunContinuationSubmissionVerificationTest.java')
          one(verification,
              '        assertTrue(js.contains("const confirmed=controlState()"));',
              '        assertTrue(js.contains("const current=controlState()"));')

          fence = Path('app/src/test/java/com/shaterguy/chatgptselfrun/TurnCompletionWatchdogFencePolicyTest.java')
          one(fence,
              '        String complete = section(observer, "const complete=", "const fireStable=");',
              '        String complete = section(observer, "const complete=", "const requestResync=");')
          PY
          rm -f .github/workflows/fix-v2.2.1-dev2-unit-contracts.yml
          git diff --check
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v2): restore submission evidence contracts'
          git push origin HEAD:selfrun-drive/v2.2.1-dev2
