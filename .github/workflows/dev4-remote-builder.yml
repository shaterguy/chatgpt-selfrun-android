name: Dev4 Remote Builder
on:
  push:
    branches:
      - 'selfrun-drive/dev4-remote-builder'
permissions:
  contents: write
jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Apply protocol-only dev4 patch
        run: |
          set -euo pipefail
          rm -f app/src/main/java/com/shaterguy/chatgptselfrun/TurnCompletionDomFallbackScript.java
          python3 tools/dev4_protocol_only_patch.py
      - name: Verify policy, unit tests, and TEST assemble
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:verifyDriveVariantIdentity :app:testDebugUnitTest :app:assembleQaApp
      - name: Remove temporary builder files and publish clean candidate tree
        run: |
          set -euo pipefail
          rm -f .github/workflows/dev4-remote-builder.yml tools/dev4_protocol_only_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'feat(drive): make turn completion protocol-only in 2.3.2-dev4'
          git push origin HEAD:selfrun-drive/dev4-remote-builder
