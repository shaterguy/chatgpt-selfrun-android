name: Build SelfRun Drive TEST

on:
  push:
    branches:
      - 'selfrun-drive/v*-dev*'
      - 'selfrun-drive/v*-rc*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: selfrun-drive-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Verify policy, test, and build canonical TEST candidate
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleQaApp
          BT="$ANDROID_HOME/build-tools/36.0.0"
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          UNSIGNED="$(find app/build/outputs/apk/qaApp -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -n "$UNSIGNED"
          test -s "$UNSIGNED"
          BADGING="$($BT/aapt dump badging "$UNSIGNED")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive TEST'" <<<"$BADGING"
          mkdir -p app/build/outputs/selfrun-drive-test
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "app/build/outputs/selfrun-drive-test/chatgpt-selfrun-drive-test-v${VERSION_NAME}-aligned-unsigned.apk"
          "$BT/zipalign" -c -v 4 "app/build/outputs/selfrun-drive-test/chatgpt-selfrun-drive-test-v${VERSION_NAME}-aligned-unsigned.apk"
      - name: Install hash-locked signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == 'Linux' ]]
          [[ "$(uname -m)" == 'x86_64' ]]
          PYTHON_VERSION="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          [[ "$PYTHON_VERSION" == '3.12' ]]
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
      - name: Sign and verify canonical TEST candidate
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/selfrun-test-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          DIR=app/build/outputs/selfrun-drive-test
          ALIGNED="$DIR/chatgpt-selfrun-drive-test-v${VERSION_NAME}-aligned-unsigned.apk"
          APK="$DIR/chatgpt-selfrun-drive-test-v${VERSION_NAME}.apk"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh "$ALIGNED" "$PASS_FILE" "$APK" > "$DIR/APKSIGNER_VERIFY.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$DIR/APK_CERT.txt"
          grep -Fqi '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' "$DIR/APK_CERT.txt"
          SHA1="$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {print $2; exit}' "$DIR/APK_CERT.txt" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$SHA1" == '91f7420d62af199020848cf87e0758ce60c3b009' ]]
          BADGING="$($BT/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive TEST'" <<<"$BADGING"
          sha256sum "$APK" > "$DIR/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$DIR/SOURCE_COMMIT.txt"
      - name: Upload canonical TEST candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-test-build
          path: |
            app/build/outputs/selfrun-drive-test/chatgpt-selfrun-drive-test-v*.apk
            app/build/outputs/selfrun-drive-test/SHA256SUMS.txt
            app/build/outputs/selfrun-drive-test/APKSIGNER_VERIFY.txt
            app/build/outputs/selfrun-drive-test/APK_CERT.txt
            app/build/outputs/selfrun-drive-test/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 30

  verify-drive-test-coinstall:
    needs: build-test-app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Download canonical TEST candidate from this run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-candidate
          ARTIFACT_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "chatgpt-selfrun-drive-test-build" and (.expired | not))][0].id // empty')"
          test -n "$ARTIFACT_ID"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/current-test.zip"
          unzip -q "$RUNNER_TEMP/current-test.zip" -d current-candidate
          CURRENT_APK="$(find current-candidate -type f -name 'chatgpt-selfrun-drive-test-v*.apk' ! -name '*unsigned*' -print -quit)"
          SUM_FILE="$(find current-candidate -type f -name 'SHA256SUMS.txt' -print -quit)"
          SOURCE_FILE="$(find current-candidate -type f -name 'SOURCE_COMMIT.txt' -print -quit)"
          test -s "$CURRENT_APK"
          test -s "$SUM_FILE"
          test -s "$SOURCE_FILE"
          [[ "$(cat "$SOURCE_FILE" | tr -d '[:space:]')" == "$GITHUB_SHA" ]]
          EXPECTED_SHA="$(awk '{print $1; exit}' "$SUM_FILE")"
          ACTUAL_SHA="$(sha256sum "$CURRENT_APK" | awk '{print $1}')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]
          cp "$CURRENT_APK" current-candidate/current-test.apk
      - name: Download immutable formal baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formal-baseline
          gh release download drive-v1.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'chatgpt-selfrun-drive-v1.4.0.apk' \
            --dir formal-baseline
          test -s formal-baseline/chatgpt-selfrun-drive-v1.4.0.apk
      - name: Try actual previous TEST artifact
        id: previous_test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p predecessor
          PREDECESSOR_SOURCE=''
          if [[ "$GITHUB_REF_NAME" =~ ^(.+)-dev([0-9]+)$ ]]; then
            PREFIX="${BASH_REMATCH[1]}"
            NUMBER="${BASH_REMATCH[2]}"
            if (( NUMBER > 1 )); then
              PREV_BRANCH="${PREFIX}-dev$((NUMBER - 1))"
              PREV_RUN_ID="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-drive-test.yml/runs" \
                -f branch="$PREV_BRANCH" -f status=success -f per_page=20 \
                --jq '.workflow_runs[0].id // empty')"
              if [[ -n "$PREV_RUN_ID" ]]; then
                PREV_ARTIFACT_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PREV_RUN_ID}/artifacts?per_page=100" \
                  --jq '[.artifacts[] | select(.name == "chatgpt-selfrun-drive-test-build" and (.expired | not))][0].id // empty')"
                if [[ -n "$PREV_ARTIFACT_ID" ]]; then
                  gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREV_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/previous-test.zip"
                  unzip -q "$RUNNER_TEMP/previous-test.zip" -d predecessor/actual
                  ACTUAL_PREV="$(find predecessor/actual -type f -name 'chatgpt-selfrun-drive-test-v*.apk' ! -name '*unsigned*' -print -quit)"
                  if [[ -s "$ACTUAL_PREV" ]]; then
                    cp "$ACTUAL_PREV" predecessor/previous-test.apk
                    PREDECESSOR_SOURCE='artifact'
                  fi
                fi
              fi
            fi
          fi
          if [[ "$PREDECESSOR_SOURCE" == 'artifact' ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'PREDECESSOR_SOURCE=artifact' >> "$GITHUB_ENV"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'PREDECESSOR_SOURCE=synthetic-fallback' >> "$GITHUB_ENV"
          fi
      - name: Build predecessor only when no immutable TEST artifact exists
        if: ${{ steps.previous_test.outputs.available != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          PREV_SRC="$RUNNER_TEMP/selfrun-drive-test-prev-src"
          rm -rf "$PREV_SRC"
          git worktree add --detach "$PREV_SRC" "$GITHUB_SHA"
          CURRENT_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' "$PREV_SRC/app/build.gradle" | head -1)"
          CURRENT_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" "$PREV_SRC/app/build.gradle" | head -1)"
          test -n "$CURRENT_VERSION_CODE"
          test -n "$CURRENT_VERSION_NAME"
          (( CURRENT_VERSION_CODE > 1 ))
          PREV_VERSION_CODE="$((CURRENT_VERSION_CODE - 1))"
          if [[ "$CURRENT_VERSION_NAME" =~ ^(.+)-dev([0-9]+)$ ]] && (( ${BASH_REMATCH[2]} > 1 )); then
            PREV_VERSION_NAME="${BASH_REMATCH[1]}-dev$((${BASH_REMATCH[2]} - 1))"
          else
            PREV_VERSION_NAME="${CURRENT_VERSION_NAME}-predecessor"
          fi
          sed -i -E "s/def selfRunDriveVersionCode = [0-9]+/def selfRunDriveVersionCode = ${PREV_VERSION_CODE}/" "$PREV_SRC/app/build.gradle"
          sed -i -E "s/def selfRunDriveVersionName = '[^']*'/def selfRunDriveVersionName = '${PREV_VERSION_NAME}'/" "$PREV_SRC/app/build.gradle"
          gradle --build-cache --no-daemon --console=plain --stacktrace --project-dir "$PREV_SRC" :app:assembleQaApp
          PREV_UNSIGNED="$(find "$PREV_SRC/app/build/outputs/apk/qaApp" -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -s "$PREV_UNSIGNED"
          cp "$PREV_UNSIGNED" predecessor/previous-test-unsigned.apk
          echo "TEST_PREV_VERSION_CODE=${PREV_VERSION_CODE}" >> "$GITHUB_ENV"
          echo "TEST_PREV_VERSION_NAME=${PREV_VERSION_NAME}" >> "$GITHUB_ENV"
          git worktree remove --force "$PREV_SRC"
      - name: Install signing dependencies for predecessor fallback
        if: ${{ steps.previous_test.outputs.available != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
      - name: Sign predecessor fallback
        if: ${{ steps.previous_test.outputs.available != 'true' }}
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/selfrun-test-predecessor-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 predecessor/previous-test-unsigned.apk predecessor/previous-test-aligned.apk
          "$BT/zipalign" -c -v 4 predecessor/previous-test-aligned.apk >/dev/null
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh \
            predecessor/previous-test-aligned.apk "$PASS_FILE" predecessor/previous-test.apk >/dev/null
          test -s predecessor/previous-test.apk
      - name: Validate canonical candidate and immutable fixtures
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          PRE=drive-test-coinstall-preflight.txt
          : > "$PRE"
          note() { printf '%s\n' "$1" | tee -a "$PRE"; }
          BT="$ANDROID_HOME/build-tools/36.0.0"
          CURRENT_APK=current-candidate/current-test.apk
          PREV_APK=predecessor/previous-test.apk
          FORMAL_APK=formal-baseline/chatgpt-selfrun-drive-v1.4.0.apk
          test -s "$CURRENT_APK" || fail 'canonical current TEST APK missing'
          test -s "$PREV_APK" || fail 'previous TEST APK missing'
          test -s "$FORMAL_APK" || fail 'formal baseline APK missing'

          CURRENT_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          CURRENT_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          CURRENT_BADGING="$($BT/aapt dump badging "$CURRENT_APK")"
          PREV_BADGING="$($BT/aapt dump badging "$PREV_APK")"
          FORMAL_BADGING="$($BT/aapt dump badging "$FORMAL_APK")"
          PREV_VERSION_NAME="$(sed -n "s/package:.*versionName='\([^']*\)'.*/\1/p" <<<"$PREV_BADGING" | head -1)"
          PREV_VERSION_CODE="$(sed -n "s/package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$PREV_BADGING" | head -1)"
          test -n "$PREV_VERSION_NAME" || fail 'previous TEST versionName unavailable'
          test -n "$PREV_VERSION_CODE" || fail 'previous TEST versionCode unavailable'
          (( CURRENT_VERSION_CODE > PREV_VERSION_CODE )) || fail 'current TEST versionCode is not newer than predecessor'

          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$CURRENT_BADGING" || fail 'current TEST package mismatch'
          grep -Fq "versionCode='$CURRENT_VERSION_CODE'" <<<"$CURRENT_BADGING" || fail 'current TEST versionCode mismatch'
          grep -Fq "versionName='$CURRENT_VERSION_NAME'" <<<"$CURRENT_BADGING" || fail 'current TEST versionName mismatch'
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$PREV_BADGING" || fail 'previous TEST package mismatch'
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$FORMAL_BADGING" || fail 'formal package mismatch'
          grep -Fq "versionCode='1000054'" <<<"$FORMAL_BADGING" || fail 'formal baseline versionCode mismatch'
          grep -Fq "versionName='1.4.0'" <<<"$FORMAL_BADGING" || fail 'formal baseline versionName mismatch'

          "$BT/apksigner" verify --verbose --print-certs "$CURRENT_APK" > coinstall-current-cert.txt
          "$BT/apksigner" verify --verbose --print-certs "$PREV_APK" > coinstall-test-prev-cert.txt
          "$BT/apksigner" verify --verbose --print-certs "$FORMAL_APK" > coinstall-formal-cert.txt
          CURRENT_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' coinstall-current-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          PREV_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' coinstall-test-prev-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          FORMAL_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' coinstall-formal-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$CURRENT_CERT" == '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' ]] || fail 'current TEST signer mismatch'
          [[ "$PREV_CERT" == "$CURRENT_CERT" ]] || fail 'previous/current TEST signers differ'
          [[ "$FORMAL_CERT" == 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' ]] || fail 'formal signer mismatch'
          echo "TEST_PREV_VERSION_NAME=$PREV_VERSION_NAME" >> "$GITHUB_ENV"
          echo "TEST_PREV_VERSION_CODE=$PREV_VERSION_CODE" >> "$GITHUB_ENV"
          note "formal fixture: 1.4.0 / 1000054"
          note "TEST predecessor: $PREV_VERSION_NAME / $PREV_VERSION_CODE / source=$PREDECESSOR_SOURCE"
          note "TEST current: $CURRENT_VERSION_NAME / $CURRENT_VERSION_CODE / source=$GITHUB_SHA"
          note 'preflight: PASS'
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Verify formal co-install, TEST update, and WebView instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: >-
            bash -o pipefail -c
            'set -euo pipefail;
            gradle --build-cache --no-daemon --console=plain :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.shaterguy.chatgptselfrun.WorkPreferenceDomWebViewTest;
            adb shell dumpsys webviewupdate | tee drive-test-webview-evidence.txt;
            TEST_VERSION=$(sed -n "s/.*selfRunDriveVersionName = '\''\([^'\'']*\)'\''.*/\1/p" app/build.gradle | head -1);
            FORMAL_EXPECTED_VERSION="1.4.0" TEST_PREV_EXPECTED_VERSION="$TEST_PREV_VERSION_NAME" TEST_EXPECTED_VERSION="$TEST_VERSION"
            timeout --foreground 6m bash tools/verify_drive_test_coinstall_emulator.sh
            formal-baseline/chatgpt-selfrun-drive-v1.4.0.apk
            predecessor/previous-test.apk
            current-candidate/current-test.apk |
            tee drive-test-coinstall-evidence.txt'
      - name: Upload TEST verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-test-coinstall-evidence
          path: |
            drive-test-coinstall-preflight.txt
            drive-test-coinstall-evidence.txt
            drive-test-webview-evidence.txt
            coinstall-current-cert.txt
            coinstall-test-prev-cert.txt
            coinstall-formal-cert.txt
          if-no-files-found: warn
          retention-days: 30
