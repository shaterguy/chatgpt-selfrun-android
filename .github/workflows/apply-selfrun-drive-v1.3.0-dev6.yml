name: Apply SelfRun Drive v1.3.0-dev6 fixes

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev6-apply'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.3.0-dev6
          fetch-depth: 0
      - name: Apply scoped dev6 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_dev6_fix.py
          rm -f .github/workflows/apply-selfrun-drive-v1.3.0-dev6.yml tools/apply_dev6_fix.py
          git diff --check
          git diff -- app/build.gradle \
                     app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java \
                     app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java \
                     app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
                  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java \
                  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java \
                  .github/workflows/apply-selfrun-drive-v1.3.0-dev6.yml \
                  tools/apply_dev6_fix.py
          git commit -m 'fix(dev6): finish multi-attachment startup safely'
          git push origin HEAD:selfrun-drive/v1.3.0-dev6