name: Apply SelfRun Drive v1.3.0-dev6 fixes

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev6'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.3.0-dev6
          fetch-depth: 0
      - name: Apply scoped multi-attachment and project draft fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java',
              '''private static boolean drivePhase(String phase){return SelfRunStore.PHASE_DRIVE_ACCOUNT_CHECK.equals(phase)||SelfRunStore.PHASE_DRIVE_BASE_FOLDER_CHECK.equals(phase)||SelfRunStore.PHASE_JOB_ID_CREATE.equals(phase)||SelfRunStore.PHASE_DRIVE_JOB_FOLDER_CREATE.equals(phase)||SelfRunStore.PHASE_DRIVE_ATTACHMENT_UPLOAD.equals(phase)||SelfRunStore.PHASE_DRIVE_TURN_DOCUMENT_CREATE.equals(phase)||SelfRunStore.PHASE_DRIVE_DOCUMENT_INIT.equals(phase)||SelfRunStore.PHASE_DRIVE_DOCUMENT_READBACK.equals(phase)||SelfRunStore.PHASE_WAIT_DRIVE_COMMIT.equals(phase)||SelfRunStore.PHASE_RESUME_BASELINE.equals(phase);}
''',
              '''private static boolean drivePhase(String phase){return SelfRunStore.PHASE_DRIVE_ACCOUNT_CHECK.equals(phase)||SelfRunStore.PHASE_DRIVE_BASE_FOLDER_CHECK.equals(phase)||SelfRunStore.PHASE_JOB_ID_CREATE.equals(phase)||SelfRunStore.PHASE_DRIVE_JOB_FOLDER_CREATE.equals(phase)||SelfRunStore.PHASE_DRIVE_ATTACHMENT_UPLOAD.equals(phase)||SelfRunStore.PHASE_DRIVE_TURN_DOCUMENT_CREATE.equals(phase)||SelfRunStore.PHASE_DRIVE_DOCUMENT_INIT.equals(phase)||SelfRunStore.PHASE_DRIVE_DOCUMENT_READBACK.equals(phase)||SelfRunStore.PHASE_WAIT_DRIVE_COMMIT.equals(phase)||SelfRunStore.PHASE_RESUME_BASELINE.equals(phase);}

static boolean shouldContinueSamePhaseDriveStep(String phase, boolean hasUncommittedAttachment) {
    return SelfRunStore.PHASE_DRIVE_ATTACHMENT_UPLOAD.equals(phase) && hasUncommittedAttachment;
}
'''
          )

          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java',
              '''                    runDriveStep(epoch);
                    if (prior.equals(store.phase()) || SelfRunStore.PHASE_WAIT_DRIVE_COMMIT.equals(store.phase()) || SelfRunStore.PHASE_RESUME_BASELINE.equals(store.phase())) break;
''',
              '''                    runDriveStep(epoch);
                    if (prior.equals(store.phase())) {
                        if (shouldContinueSamePhaseDriveStep(prior, store.nextUncommittedAttachment() != null)) continue;
                        break;
                    }
                    if (SelfRunStore.PHASE_WAIT_DRIVE_COMMIT.equals(store.phase())
                            || SelfRunStore.PHASE_RESUME_BASELINE.equals(store.phase())) break;
'''
          )

          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java',
              '''    @Override protected void onResume() { super.onResume(); if (firstResume) { firstResume=false; return; } if(project!=null) reloadProjects(); }
''',
              '''    @Override protected void onResume() { super.onResume(); if (firstResume) { firstResume=false; return; } if(project!=null) reloadProjects(selectedProjectUrl()); }
'''
          )

          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java',
              '''    private void reloadProjects() {
        String previous=store.defaultProjectUrl(); projectEntries=catalog.entries(); ArrayList<String> labels=new ArrayList<>(); labels.add("일반채팅"); int selected=0;
        for(int i=0;i<projectEntries.size();i++){ProjectUrlPolicy.ProjectRef entry=projectEntries.get(i);labels.add(catalog.displayName(entry));if(entry.canonicalUrl.equals(previous))selected=i+1;}
        project.setAdapter(new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,labels)); project.setSelection(selected);
    }
''',
              '''    private void reloadProjects() { reloadProjects(store.defaultProjectUrl()); }

    private void reloadProjects(String preferredUrl) {
        String previous=preferredUrl==null?"":preferredUrl; projectEntries=catalog.entries(); ArrayList<String> labels=new ArrayList<>(); labels.add("일반채팅"); int selected=0;
        for(int i=0;i<projectEntries.size();i++){ProjectUrlPolicy.ProjectRef entry=projectEntries.get(i);labels.add(catalog.displayName(entry));if(entry.canonicalUrl.equals(previous))selected=i+1;}
        project.setAdapter(new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,labels)); project.setSelection(selected);
    }
'''
          )

          test_path = Path('app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java')
          test = test_path.read_text(encoding='utf-8')
          marker = '''    @Test public void resumableUploadDoesNotPersistOrLogSessionUrl() throws Exception {
'''
          extra = '''    @Test public void multiAttachmentBatchContinuesUntilTheLastAttachmentCommits() {
        assertTrue(SelfRunService.shouldContinueSamePhaseDriveStep(
                SelfRunStore.PHASE_DRIVE_ATTACHMENT_UPLOAD, true));
        assertFalse(SelfRunService.shouldContinueSamePhaseDriveStep(
                SelfRunStore.PHASE_DRIVE_ATTACHMENT_UPLOAD, false));
        assertFalse(SelfRunService.shouldContinueSamePhaseDriveStep(
                SelfRunStore.PHASE_DRIVE_TURN_DOCUMENT_CREATE, true));
    }

    @Test public void attachmentPickerResumePreservesCurrentProjectDraft() throws Exception {
        String activity = src("SelfRunNewActivity.java");
        String resume = between(activity, "@Override protected void onResume", "@Override protected void onSaveInstanceState");
        String reload = between(activity, "private void reloadProjects()", "private String selectedProjectUrl()");
        assertTrue(resume.contains("reloadProjects(selectedProjectUrl())"));
        assertTrue(reload.contains("reloadProjects(store.defaultProjectUrl())"));
        assertTrue(reload.contains("private void reloadProjects(String preferredUrl)"));
    }

'''
          if extra.strip() in test:
              raise SystemExit('dev6 regression tests already present')
          if marker not in test:
              raise SystemExit('attachment regression insertion marker missing')
          test_path.write_text(test.replace(marker, extra + marker, 1), encoding='utf-8')

          patch(
              'app/build.gradle',
              '''def selfRunDriveVersionCode = 1000045
def selfRunDriveVersionName = '1.3.0-dev5'
''',
              '''def selfRunDriveVersionCode = 1000046
def selfRunDriveVersionName = '1.3.0-dev6'
'''
          )

          patch(
              'app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java',
              '''        assertTrue(gradle.contains("selfRunDriveVersionCode = 1000045"));
        assertTrue(gradle.contains("selfRunDriveVersionName = '1.3.0-dev5'"));
''',
              '''        assertTrue(gradle.contains("selfRunDriveVersionCode = 1000046"));
        assertTrue(gradle.contains("selfRunDriveVersionName = '1.3.0-dev6'"));
'''
          )
          PY

          rm -f .github/workflows/apply-selfrun-drive-v1.3.0-dev6.yml
          git diff --check
          git diff -- app/build.gradle \
                     app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java \
                     app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java \
                     app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
                  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java \
                  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java \
                  .github/workflows/apply-selfrun-drive-v1.3.0-dev6.yml
          git commit -m 'fix(dev6): finish multi-attachment startup safely'
          git push origin HEAD:selfrun-drive/v1.3.0-dev6