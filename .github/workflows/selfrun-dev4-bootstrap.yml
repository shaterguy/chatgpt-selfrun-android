name: Bootstrap SelfRun 3.2.5 dev4

on:
  push:
    branches:
      - 'v3.2.5-dev4'

permissions:
  contents: write

concurrency:
  group: selfrun-dev4-bootstrap
  cancel-in-progress: false

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v3.2.5-dev4
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Apply root-cause dev4 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dev4_bootstrap.py
          git diff --check
          grep -F "selfRunDriveVersionCode = 3025004" app/build.gradle
          grep -F "selfRunDriveVersionName = '3.2.5-dev4'" app/build.gradle
          grep -F "FIREBASE_CONFIG_GATE - Android public config is injected" .github/workflows/build-selfrun-v3-candidate.yml
          grep -F "setAndAllowWhileIdle" app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunFallbackWakeScheduler.java
      - name: Compile and run JVM regression
        shell: bash
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain --stacktrace \
            :app:verifyDriveVariantIdentity \
            :app:compileQaAppJavaWithJavac \
            :app:compileQaAppUnitTestJavaWithJavac \
            :app:compileQaAppAndroidTestJavaWithJavac \
            :app:testQaAppUnitTest
      - name: Commit tested dev4 patch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore server push config and fallback wake'
          git push origin HEAD:v3.2.5-dev4
