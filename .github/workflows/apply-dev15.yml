name: Apply dev15 patch
on:
  push:
    branches:
      - selfrun-drive/v1.2.3-dev15
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply scoped patch
        env:
          PATCH_SCRIPT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_SCRIPT_B64" | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          rm -f .github/workflows/apply-dev15.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunGeneralChatPolicyTest.java .github/workflows/apply-dev15.yml
          git commit -m 'fix(dev15): persist general Chat conversation route'
          git push origin HEAD:selfrun-drive/v1.2.3-dev15
