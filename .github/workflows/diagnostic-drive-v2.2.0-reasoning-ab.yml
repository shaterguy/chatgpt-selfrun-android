name: Diagnostic SelfRun 2.2.0 reasoning A/B

on:
  push:
    branches:
      - 'diagnostic/drive-v2.2.0-reasoning-ab'

permissions:
  contents: read

concurrency:
  group: diagnostic-drive-v2.2.0-reasoning-ab
  cancel-in-progress: true

jobs:
  reasoning-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: true

      - name: Verify immutable 2.2.0 baseline and test-only diff
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='536aea5b251e9c1c0dcbd0e06d7f242169e846e9'
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          grep -Fq "selfRunDriveVersionCode = 2020002" app/build.gradle
          grep -Fq "selfRunDriveVersionName = '2.2.0'" app/build.gradle
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          printf '%s\n' "${CHANGED[@]}"
          [[ "${#CHANGED[@]}" -eq 2 ]]
          [[ "${CHANGED[0]}" == '.github/workflows/diagnostic-drive-v2.2.0-reasoning-ab.yml' ]]
          [[ "${CHANGED[1]}" == 'app/src/androidTest/java/com/shaterguy/chatgptselfrun/ChatSplitReasoningMultiContinuationWebViewTest.java' ]]
          ! git diff --name-only "$BASE_SHA"..HEAD | grep -E '^app/src/main/|^app/build.gradle$'

      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Run exact BOOTSTRAP -> CONTINUE 1 -> CONTINUE 2 A/B test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: >-
            gradle --build-cache --no-daemon --console=plain --stacktrace
            :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.shaterguy.chatgptselfrun.ChatSplitReasoningMultiContinuationWebViewTest
