name: Test SelfRun Execution Layer
on:
  push:
    branches: ['fix/selfrun-execution-layer-20261002']
    paths:
      - 'termux-server/**'
      - '.github/workflows/test-selfrun-execution-layer.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: termux-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Syntax
        run: npm run check
      - name: Full server regression suite
        run: npm test
