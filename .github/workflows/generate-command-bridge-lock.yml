name: Generate command-bridge lockfile

on:
  push:
    branches:
      - v3.2.5-dev3
    paths:
      - command-bridge/package.json
      - .github/workflows/generate-command-bridge-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v3.2.5-dev3
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate deterministic npm lockfile
        working-directory: command-bridge
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node -p "process.versions.node.split('.')[0]")" == "24" ]]
          npm install --package-lock-only --ignore-scripts
          test -s package-lock.json
          npm ci
          npm test
          npm run typecheck
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add command-bridge/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: lock command bridge dependencies"
          git push origin HEAD:v3.2.5-dev3
