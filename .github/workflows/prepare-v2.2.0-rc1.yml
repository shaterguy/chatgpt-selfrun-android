name: Prepare SelfRun Drive v2.2.0 RC1

on:
  push:
    branches:
      - 'release-prep/v2.2.0-rc1'

permissions:
  contents: write

jobs:
  prepare-clean-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create clean stable promotion commit from exact dev2
        shell: bash
        env:
          BASE_SHA: 3bbe3dd060bc85cc7c30ae7e9b305866d02f74b5
          OUTPUT_BRANCH: release-candidate/v2.2.0-rc1
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git checkout -B "$OUTPUT_BRANCH" "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          app = 'app/build.gradle'
          replace_once(app, "def selfRunDriveVersionName = '2.2.0-dev2'", "def selfRunDriveVersionName = '2.2.0'")
          replace_once(app, "applicationId 'com.shaterguy.chatgptselfrun.v2'", "applicationId 'com.shaterguy.chatgptselfrun.drive'")
          replace_once(app, "manifestPlaceholders = [selfRunAppLabel: 'SelfRun 2.0']", "manifestPlaceholders = [selfRunAppLabel: 'SelfRun Drive']")
          replace_once(app, "manifestPlaceholders = [selfRunAppLabel: 'SelfRun 2.0 TEST']", "manifestPlaceholders = [selfRunAppLabel: 'SelfRun Drive TEST']")
          replace_once(app, "def expectedId = 'com.shaterguy.chatgptselfrun.v2'", "def expectedId = 'com.shaterguy.chatgptselfrun.drive'")
          replace_once(app,
              "        if (expectedId == 'com.shaterguy.chatgptselfrun.drive'\n"
              "                || expectedId == 'com.shaterguy.chatgptselfrun.drive.test') {\n"
              "            throw new GradleException('SelfRun 2.0 must not reuse a 1.x applicationId')\n"
              "        }\n",
              "")
          replace_once(app, 'SelfRun 2.0 applicationId must be ${expectedId}', 'SelfRun Drive applicationId must be ${expectedId}')
          replace_once(app, 'SelfRun 2.0 version identity mismatch', 'SelfRun Drive version identity mismatch')
          replace_once(app,
              "        if (!selfRunDriveVersionName.startsWith('2.2.0-dev')) {\n"
              "            throw new GradleException('SelfRun 2.2 development builds must remain prerelease builds')\n"
              "        }",
              "        if (selfRunDriveVersionName != '2.2.0') {\n"
              "            throw new GradleException('SelfRun Drive stable version must be 2.2.0')\n"
              "        }")
          replace_once(app, 'SelfRun 2.0 TEST applicationId suffix must remain .test', 'SelfRun Drive TEST applicationId suffix must remain .test')

          for path in ['.github/workflows/build-drive-v1.yml', '.github/workflows/release-drive-v1.yml']:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if '2.0.0' not in s or '2000011' not in s:
                  raise SystemExit(f'{path}: expected old formal baseline not found')
              s = s.replace('2.0.0', '2.1.0').replace('2000011', '2010005')
              if '2.0.0' in s or '2000011' in s:
                  raise SystemExit(f'{path}: stale formal baseline remains')
              p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/build-drive-v1.yml\n.github/workflows/release-drive-v1.yml\napp/build.gradle'
          grep -Fq "selfRunDriveVersionCode = 2020002" app/build.gradle
          grep -Fq "selfRunDriveVersionName = '2.2.0'" app/build.gradle
          grep -Fq "applicationId 'com.shaterguy.chatgptselfrun.drive'" app/build.gradle
          grep -Fq "selfRunAppLabel: 'SelfRun Drive'" app/build.gradle
          ! grep -Fq '2.2.0-dev2' app/build.gradle
          grep -Fq 'drive-v2.1.0' .github/workflows/build-drive-v1.yml
          grep -Fq 'drive-v2.1.0' .github/workflows/release-drive-v1.yml
          ! git diff --name-only -- app/src/main | grep -q .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle .github/workflows/build-drive-v1.yml .github/workflows/release-drive-v1.yml
          git commit -m 'release(v2): prepare SelfRun Drive v2.2.0 RC1'
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
          git rev-parse HEAD
