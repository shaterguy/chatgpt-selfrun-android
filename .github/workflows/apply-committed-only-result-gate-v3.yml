name: Apply Committed Only Result Gate V3

on:
  push:
    branches:
      - selfrun-v3/v3.2.5-dev1-committed-only-result-gate
    paths:
      - .github/workflows/apply-committed-only-result-gate-v3.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply patch
        run: |
          python3 tools/apply_committed_only_gate_dev1.py
          python3 tools/fix_committed_only_gate_guards.py
      - name: Check patch
        run: |
          git diff --check
          if grep -R -F 'InvalidCommittedResultException' app/src/main; then exit 1; fi
          if grep -R -F 'isInvalidCommittedResult' app/src/main; then exit 1; fi
          if grep -R -F 'INVALID_COMMITTED_RESULT' app/src/main; then exit 1; fi
          grep -Fq "def selfRunDriveVersionName = '3.2.5-dev1'" app/build.gradle
          grep -Fq 'Boolean.TRUE.equals(r.opt("committed"))' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java
      - name: Verify variant policy
        run: tools/verify_drive_variant.sh
      - name: Focused regression tests
        run: gradle --build-cache --no-daemon --console=plain --stacktrace :app:testQaAppUnitTest --tests 'com.shaterguy.chatgptselfrun.SelfRun3CommittedOnlyResultGateTest' --tests 'com.shaterguy.chatgptselfrun.SelfRun3ResultWatchdogTest' --tests 'com.shaterguy.chatgptselfrun.SelfRun3ResultReadPowerPolicyTest' --tests 'com.shaterguy.chatgptselfrun.SelfRun3TrailingBraceRecoveryTest' --tests 'com.shaterguy.chatgptselfrun.TurnDocumentRetryWiringTest' --tests 'com.shaterguy.chatgptselfrun.SelfRun3AlwaysRepairPolicyTest' --tests 'com.shaterguy.chatgptselfrun.SelfRun3DisposableExecutionTest' --tests 'com.shaterguy.chatgptselfrun.SelfRun3UnboundedPayloadPolicyTest'
      - name: Full JVM regression suite
        run: gradle --build-cache --no-daemon --console=plain --stacktrace :app:testQaAppUnitTest
      - name: Commit implementation
        run: |
          rm -f .github/workflows/apply-committed-only-result-gate.yml
          rm -f .github/workflows/apply-committed-only-result-gate-v2.yml
          rm -f .github/workflows/apply-committed-only-result-gate-v3.yml
          rm -f .github/workflows/test-committed-only-result-gate.yml
          rm -f tools/apply_committed_only_gate_dev1.py
          rm -f tools/fix_committed_only_gate_guards.py
          git diff --check
          git config user.name 'SelfRun Builder'
          git config user.email '108107617+shaterguy@users.noreply.github.com'
          git add -A
          git commit -m 'fix: gate result completion on committed only'
          git push origin HEAD:${GITHUB_REF_NAME}
