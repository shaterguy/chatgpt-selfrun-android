name: Enable dev7 bootstrap hardening

on:
  push:
    branches:
      - 'selfrun-drive/staging-v1.4.2-dev7'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/staging-v1.4.2-dev7
          fetch-depth: 0
      - name: Enable the staged patch exactly once
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/github.actor != 'github-actions\[bot\]'/d" .github/workflows/apply-dev7-bootstrap-hardening.yml
          rm -f .github/workflows/enable-dev7-bootstrap-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: enable staged dev7 patch'
          git push origin HEAD:selfrun-drive/staging-v1.4.2-dev7
