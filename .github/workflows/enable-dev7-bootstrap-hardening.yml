name: Enable dev7 bootstrap hardening

on:
  push:
    branches:
      - 'selfrun-drive/staging-v1.4.2-dev7'

permissions:
  contents: write

concurrency:
  group: enable-dev7-bootstrap-hardening
  cancel-in-progress: true

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/staging-v1.4.2-dev7
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Apply finite new-chat acknowledgement window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dom_path = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java')
          dom = dom_path.read_text(encoding='utf-8')
          if 'newChatRetryMs=1800' not in dom:
              old = '''                + "const newChatKey='selfrun-drive:new-chat:" + esc(runId) + "';let newChatAt=0;try{const raw=sessionStorage.getItem(newChatKey)||'';newChatAt=Number(raw?JSON.parse(raw)?.at||0:0);}catch(_){}const recentNewChat=newChatAt>0&&Date.now()-newChatAt<1500;"
                + "if(actualConversation){if(newChatControl&&!recentNewChat){try{sessionStorage.setItem(newChatKey,JSON.stringify({at:Date.now()}));}catch(_){}newChatControl.focus?.();newChatControl.click();return result('UI_WAIT','보정된 새 대화 전환 반영 대기',{actualConversation,newChatSource:__srFind(" + q(newChatTarget) + ")?'calibrated':'heuristic'});}return result('CHAT_BOOTSTRAP_NEW_CHAT_FAILED','새 대화 화면 대신 기존 conversation이 열렸습니다.',{actualConversation,newChatControl:!!newChatControl,recentNewChat});}"
'''
              new = '''                + "const newChatKey='selfrun-drive:new-chat:" + esc(runId) + "';const newChatNow=Date.now(),newChatRetryMs=1800,newChatFailureMs=10000;let newChatState={startedAt:0,lastClickAt:0,clicks:0};try{const raw=sessionStorage.getItem(newChatKey)||localStorage.getItem(newChatKey)||'';if(raw)newChatState={...newChatState,...JSON.parse(raw)};}catch(_){}if(!(Number(newChatState.startedAt)>0))newChatState.startedAt=newChatNow;const newChatElapsed=Math.max(0,newChatNow-Number(newChatState.startedAt||newChatNow)),recentNewChat=Number(newChatState.lastClickAt)>0&&newChatNow-Number(newChatState.lastClickAt)<newChatRetryMs;const saveNewChat=()=>{const value=JSON.stringify(newChatState);try{sessionStorage.setItem(newChatKey,value);}catch(_){}try{localStorage.setItem(newChatKey,value);}catch(_){}};const clearNewChat=()=>{try{sessionStorage.removeItem(newChatKey);}catch(_){}try{localStorage.removeItem(newChatKey);}catch(_){}};"
                + "if(actualConversation){if(newChatControl&&!recentNewChat&&Number(newChatState.clicks)<2){newChatState.clicks=Math.max(0,Number(newChatState.clicks)||0)+1;newChatState.lastClickAt=newChatNow;saveNewChat();newChatControl.focus?.();newChatControl.click();return result('UI_WAIT','보정된 새 대화 전환 반영 대기',{actualConversation,newChatSource:__srFind(" + q(newChatTarget) + ")?'calibrated':'heuristic',newChatClicks:newChatState.clicks,newChatElapsedMs:newChatElapsed});}saveNewChat();if(newChatElapsed>=newChatFailureMs||(Number(newChatState.clicks)>=2&&Number(newChatState.lastClickAt)>0&&newChatNow-Number(newChatState.lastClickAt)>=2500))return result('CHAT_BOOTSTRAP_NEW_CHAT_FAILED','새 대화 화면 전환을 제한시간 안에 확인하지 못했습니다.',{actualConversation,newChatControl:!!newChatControl,recentNewChat,newChatClicks:newChatState.clicks,newChatElapsedMs:newChatElapsed});return result('UI_WAIT','새 대화 화면 전환 확인 대기',{actualConversation,newChatControl:!!newChatControl,recentNewChat,newChatClicks:newChatState.clicks,newChatElapsedMs:newChatElapsed});}clearNewChat();"
'''
              if dom.count(old) != 1:
                  raise SystemExit(f'SelfRunDom new-chat block replacement count={dom.count(old)}')
              dom_path.write_text(dom.replace(old, new, 1), encoding='utf-8')

          test_path = Path('app/src/androidTest/java/com/shaterguy/chatgptselfrun/ChatReasoningDelayedDomWebViewTest.java')
          test = test_path.read_text(encoding='utf-8')
          if 'newChatTransitionWaitsForAcknowledgementBeforeFiniteFailure' not in test:
              marker = '    @Test public void bootstrapResultPolicyParsesAndClassifiesOnAndroid() {'
              addition = r'''    @Test public void newChatTransitionWaitsForAcknowledgementBeforeFiniteFailure() throws Exception {
                  try (ActivityScenario<SelfRunNewActivity> scenario = ActivityScenario.launch(SelfRunNewActivity.class)) {
                      AtomicReference<WebView> web = new AtomicReference<>();
                      load(scenario, web, newChatTransitionFixture());
                      assertEquals("/c/fixture", read(scenario, web,
                              "(()=>{history.replaceState(null,'','/c/fixture');return location.pathname;})()"));
                      String script = SelfRunDom.prepareInitialContext(SelfRunScript.GENERAL_CHAT_URL,
                              SelfRunStore.MODE_CHAT, "SR-NEW-CHAT-WINDOW");

                      JSONObject first = evaluate(scenario, web, script);
                      assertEquals("UI_WAIT", first.getString("status"));
                      assertEquals("1", read(scenario, web, "String(window.newChatClicks)"));

                      setNow(scenario, web, 2_200L);
                      JSONObject protectedWait = evaluate(scenario, web, script);
                      assertEquals("UI_WAIT", protectedWait.getString("status"));
                      assertEquals("1", read(scenario, web, "String(window.newChatClicks)"));

                      setNow(scenario, web, 3_000L);
                      JSONObject secondClick = evaluate(scenario, web, script);
                      assertEquals("UI_WAIT", secondClick.getString("status"));
                      assertEquals("2", read(scenario, web, "String(window.newChatClicks)"));

                      setNow(scenario, web, 5_200L);
                      assertEquals("UI_WAIT", evaluate(scenario, web, script).getString("status"));

                      setNow(scenario, web, 5_600L);
                      JSONObject finiteFailure = evaluate(scenario, web, script);
                      assertEquals("CHAT_BOOTSTRAP_NEW_CHAT_FAILED", finiteFailure.getString("status"));
                      assertEquals(2, finiteFailure.getJSONObject("diagnostics").getInt("newChatClicks"));
                  }
              }

'''
              if marker not in test:
                  raise SystemExit('instrumentation insertion marker missing')
              test = test.replace(marker, addition + marker, 1)

              fixture_marker = '    private static String customAriaSliderFixture() {'
              fixture = r'''    private static String newChatTransitionFixture() {
                  return """
                          <!doctype html><html><head><style>
                          body{margin:0;min-height:800px}button{display:block;width:160px;height:48px}
                          </style></head><body><button id="new-chat" type="button" aria-label="New chat">New chat</button>
                          <script>
                          window.testNow=1000;Date.now=()=>window.testNow;window.newChatClicks=0;
                          document.getElementById('new-chat').addEventListener('click',()=>{window.newChatClicks++;});
                          </script></body></html>
                          """;
              }

'''
              if fixture_marker not in test:
                  raise SystemExit('fixture insertion marker missing')
              test = test.replace(fixture_marker, fixture + fixture_marker, 1)
              test_path.write_text(test, encoding='utf-8')

          wiring_path = Path('app/src/test/java/com/shaterguy/chatgptselfrun/BootstrapFiniteStateWiringTest.java')
          wiring = wiring_path.read_text(encoding='utf-8')
          if 'newChatRetryMs=1800' not in wiring:
              needle = '        assertTrue(dom.contains("CHAT_BOOTSTRAP_COMPOSER_NOT_FOUND"));\n'
              replacement = needle + '        assertTrue(dom.contains("newChatRetryMs=1800"));\n        assertTrue(dom.contains("newChatFailureMs=10000"));\n'
              if needle not in wiring:
                  raise SystemExit('wiring insertion marker missing')
              wiring_path.write_text(wiring.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Verify unit and instrumentation compilation
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --build-cache --no-daemon --console=plain --stacktrace \
            :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac
      - name: Commit source changes only
        shell: bash
        run: |
          set -euo pipefail
          git add app
          if git diff --cached --quiet; then
            echo 'no source changes to commit'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(drive): wait for new-chat transition acknowledgement'
          git push origin HEAD:selfrun-drive/staging-v1.4.2-dev7
