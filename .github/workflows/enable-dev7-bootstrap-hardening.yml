name: Enable dev7 bootstrap hardening

on:
  push:
    branches:
      - 'selfrun-drive/staging-v1.4.2-dev7'

permissions:
  contents: write

concurrency:
  group: enable-dev7-bootstrap-hardening
  cancel-in-progress: true

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/staging-v1.4.2-dev7
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Execute the staged patch body without changing workflow files
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "selfRunDriveVersionName = '1.4.2-dev7'" app/build.gradle; then
            echo 'dev7 patch already present'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-dev7-bootstrap-hardening.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('staged Python patch body not found')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          needle = """if old_model not in detail:
              raise SystemExit('SelfRunDetailActivity.java: model block missing')
          detail_path.write_text(detail.replace(old_model, new_model, 1), encoding='utf-8')"""
          replacement = """model_start = detail.find('    private String model(JSONObject item) {')
          model_end = detail.find('\\n\\n    private static String error', model_start)
          if model_start < 0 or model_end < 0:
              raise SystemExit('SelfRunDetailActivity.java: model boundaries missing')
          detail_path.write_text(detail[:model_start] + new_model + detail[model_end:], encoding='utf-8')"""
          if needle not in script:
              raise SystemExit('detail replacement guard not found in staged patch')
          script = script.replace(needle, replacement, 1)
          exec(compile(script, 'apply-dev7-bootstrap-hardening', 'exec'), {'__name__': '__main__'})

          tests = Path('app/src/test/java/com/shaterguy/chatgptselfrun')
          policy_source_test = r'''package com.shaterguy.chatgptselfrun;

          import org.junit.Test;

          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.Paths;

          import static org.junit.Assert.*;

          public final class BootstrapResultPolicyTest {
              @Test public void callbackPolicyHasFiniteClassificationAndSafeDiagnostics() throws Exception {
                  String source = read("app/src/main/java/com/shaterguy/chatgptselfrun/BootstrapResultPolicy.java",
                          "src/main/java/com/shaterguy/chatgptselfrun/BootstrapResultPolicy.java");
                  assertTrue(source.contains("CHAT_BOOTSTRAP_CALLBACK_INVALID"));
                  assertTrue(source.contains("CHAT_BOOTSTRAP_SCRIPT_ERROR"));
                  assertTrue(source.contains("CHAT_BOOTSTRAP_UNKNOWN_STATUS"));
                  assertTrue(source.contains("CHAT_BOOTSTRAP_TIMEOUT"));
                  assertTrue(source.contains("new JSONTokener(raw).nextValue()"));
                  assertTrue(source.contains("NON_FATAL.contains(parsed.status)"));
                  assertTrue(source.contains("status.startsWith(\"CHAT_REASONING_\")"));
                  assertTrue(source.contains("status.startsWith(\"CHAT_BOOTSTRAP_\")"));
                  assertTrue(source.contains("compactDiagnostics"));
              }

              private static String read(String first, String fallback) throws Exception {
                  Path path = Paths.get(first);
                  if (!Files.exists(path)) path = Paths.get(fallback);
                  return new String(Files.readAllBytes(path), StandardCharsets.UTF_8);
              }
          }
          '''
          (tests / 'BootstrapResultPolicyTest.java').write_text(policy_source_test, encoding='utf-8')

          state_source_test = r'''package com.shaterguy.chatgptselfrun;

          import org.junit.Test;

          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.Paths;

          import static org.junit.Assert.*;

          public final class BootstrapRunStateSummaryTest {
              @Test public void runStateSourceStoresDeadlineReasoningEvidenceAndHistory() throws Exception {
                  String source = read("app/src/main/java/com/shaterguy/chatgptselfrun/BootstrapRunStateStore.java",
                          "src/main/java/com/shaterguy/chatgptselfrun/BootstrapRunStateStore.java");
                  assertTrue(source.contains("BOOTSTRAP_TIMEOUT_MS = 60_000L"));
                  assertTrue(source.contains("REASONING_APPLIED"));
                  assertTrue(source.contains("bootstrapDeadlineAt"));
                  assertTrue(source.contains("markReasoningApplied"));
                  assertTrue(source.contains("markBootstrapFailed"));
                  assertTrue(source.contains("appendHistory"));
                  assertTrue(source.contains("chatReasoningRequested"));
                  assertTrue(source.contains("chatReasoningVerified"));
                  assertTrue(source.contains("MAX_RUNS = 120"));
              }

              private static String read(String first, String fallback) throws Exception {
                  Path path = Paths.get(first);
                  if (!Files.exists(path)) path = Paths.get(fallback);
                  return new String(Files.readAllBytes(path), StandardCharsets.UTF_8);
              }
          }
          '''
          (tests / 'BootstrapRunStateSummaryTest.java').write_text(state_source_test, encoding='utf-8')

          wiring = tests / 'BootstrapFiniteStateWiringTest.java'
          wiring_text = wiring.read_text(encoding='utf-8')
          wiring_text = wiring_text.replace(
                  'assertTrue(service.contains("CHAT_BOOTSTRAP_TIMEOUT"));',
                  'assertTrue(service.contains("BootstrapResultPolicy.TIMEOUT"));')
          wiring.write_text(wiring_text, encoding='utf-8')

          instrumentation = Path('app/src/androidTest/java/com/shaterguy/chatgptselfrun/ChatReasoningDelayedDomWebViewTest.java')
          instrumented = instrumentation.read_text(encoding='utf-8')
          if 'bootstrapResultPolicyParsesAndClassifiesOnAndroid' not in instrumented:
              instrumented = instrumented.replace(
                      'import static org.junit.Assert.assertEquals;\n',
                      'import static org.junit.Assert.assertEquals;\nimport static org.junit.Assert.assertFalse;\n', 1)
              marker = '    private static JSONObject runToReady('
              addition = r'''    @Test public void bootstrapResultPolicyParsesAndClassifiesOnAndroid() {
                  BootstrapResultPolicy.Parsed valid = BootstrapResultPolicy.parse(
                          "\"{\\\"status\\\":\\\"UI_WAIT\\\",\\\"detail\\\":\\\"mode\\\"}\"");
                  assertTrue(valid.valid);
                  assertEquals("UI_WAIT", valid.status);
                  assertEquals("", BootstrapResultPolicy.fatalStatus(valid, 20_000L, 10_000L));

                  BootstrapResultPolicy.Parsed malformed = BootstrapResultPolicy.parse(null);
                  assertFalse(malformed.valid);
                  assertEquals(BootstrapResultPolicy.CALLBACK_INVALID,
                          BootstrapResultPolicy.fatalStatus(malformed, 20_000L, 10_000L));

                  BootstrapResultPolicy.Parsed scriptError = BootstrapResultPolicy.parse(
                          "{\"status\":\"SCRIPT_ERROR\"}");
                  assertEquals(BootstrapResultPolicy.SCRIPT_ERROR,
                          BootstrapResultPolicy.fatalStatus(scriptError, 20_000L, 10_000L));

                  BootstrapResultPolicy.Parsed unknown = BootstrapResultPolicy.parse(
                          "{\"status\":\"SURPRISE\"}");
                  assertEquals(BootstrapResultPolicy.UNKNOWN_STATUS,
                          BootstrapResultPolicy.fatalStatus(unknown, 20_000L, 10_000L));

                  assertEquals(BootstrapResultPolicy.TIMEOUT,
                          BootstrapResultPolicy.fatalStatus(valid, 20_000L, 20_000L));

                  BootstrapResultPolicy.Parsed modeFailure = BootstrapResultPolicy.parse(
                          "{\"status\":\"CHAT_BOOTSTRAP_MODE_READBACK_FAILED\"}");
                  assertEquals("CHAT_BOOTSTRAP_MODE_READBACK_FAILED",
                          BootstrapResultPolicy.fatalStatus(modeFailure, 20_000L, 10_000L));
              }

              @Test public void bootstrapRunStatePersistsDeadlineAndPerRunEvidence() {
                  try (ActivityScenario<SelfRunNewActivity> scenario = ActivityScenario.launch(SelfRunNewActivity.class)) {
                      scenario.onActivity(activity -> {
                          String runId = "SR-BOOTSTRAP-STATE-A";
                          assertTrue(BootstrapRunStateStore.startRun(activity, runId,
                                  ChatReasoningPreferenceStore.HIGH));
                          BootstrapRunStateStore.Window first = BootstrapRunStateStore.touchBootstrap(
                                  activity, runId, ChatReasoningPreferenceStore.HIGH, 1_000L);
                          BootstrapRunStateStore.Window recorded = BootstrapRunStateStore.recordBootstrapResult(
                                  activity, runId, "UI_WAIT", "mode", 1_500L);
                          BootstrapRunStateStore.Window second = BootstrapRunStateStore.touchBootstrap(
                                  activity, runId, ChatReasoningPreferenceStore.HIGH, 2_000L);
                          assertTrue(first.persisted);
                          assertTrue(recorded.persisted);
                          assertTrue(second.persisted);
                          assertEquals(first.deadlineAt, second.deadlineAt);
                          assertEquals(2, second.attempts);
                          assertTrue(BootstrapRunStateStore.markReasoningApplied(activity, runId,
                                  ChatReasoningPreferenceStore.HIGH));
                          assertTrue(BootstrapRunStateStore.markBootstrapCompleted(activity, runId, "READY"));

                          JSONObject history = new JSONObject();
                          BootstrapRunStateStore.appendHistory(activity, runId, history);
                          assertEquals(ChatReasoningPreferenceStore.HIGH,
                                  history.optString("chatReasoningRequested"));
                          assertEquals(BootstrapRunStateStore.REASONING_APPLIED,
                                  history.optString("chatReasoningStatus"));
                          assertEquals(ChatReasoningPreferenceStore.HIGH,
                                  history.optString("chatReasoningVerified"));
                          assertEquals("요청: High / 적용: 확인 완료 / 확인: High",
                                  BootstrapRunStateStore.summary(history));

                          String firstSummary = BootstrapRunStateStore.summary(activity, runId);
                          assertTrue(BootstrapRunStateStore.startRun(activity, "SR-BOOTSTRAP-STATE-B",
                                  ChatReasoningPreferenceStore.PRO));
                          assertEquals(firstSummary, BootstrapRunStateStore.summary(activity, runId));
                      });
                  }
              }

          '''
              if marker not in instrumented:
                  raise SystemExit('ChatReasoningDelayedDomWebViewTest insertion marker missing')
              instrumented = instrumented.replace(marker, addition + marker, 1)
              instrumentation.write_text(instrumented, encoding='utf-8')
          PY
      - name: Verify policy and unit tests
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq "selfRunDriveVersionName = '1.4.2-dev7'" app/build.gradle; then
            echo 'dev7 patch was not applied' >&2
            exit 1
          fi
          tools/verify_drive_variant.sh
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Commit source changes only
        shell: bash
        run: |
          set -euo pipefail
          git add app
          if git diff --cached --quiet; then
            echo 'no source changes to commit'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(drive): make Chat bootstrap finite and durable'
          git push origin HEAD:selfrun-drive/staging-v1.4.2-dev7
