name: Enable dev7 bootstrap hardening

on:
  push:
    branches:
      - 'selfrun-drive/staging-v1.4.2-dev7'

permissions:
  contents: write

concurrency:
  group: enable-dev7-bootstrap-hardening
  cancel-in-progress: true

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/staging-v1.4.2-dev7
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Apply finite new-chat acknowledgement window
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_dev7_newchat_patch.py
      - name: Verify unit and instrumentation compilation
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --build-cache --no-daemon --console=plain --stacktrace \
            :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac
      - name: Commit source changes only
        shell: bash
        run: |
          set -euo pipefail
          git add app
          if git diff --cached --quiet; then
            echo 'no source changes to commit'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(drive): wait for new-chat transition acknowledgement'
          git push origin HEAD:selfrun-drive/staging-v1.4.2-dev7
