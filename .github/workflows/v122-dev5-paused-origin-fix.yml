name: SelfRun Drive dev5 paused-origin fix

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.2-dev5'
    paths:
      - '.github/workflows/v122-dev5-paused-origin-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.2.2-dev5
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply minimal paused-origin integration fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'selfrun-drive/v1.2.2-dev5'
          test "$(git merge-base HEAD d4ee904ac99747beaa49421e901a92e4f4f49a05)" = 'd4ee904ac99747beaa49421e901a92e4f4f49a05'
          python3 - <<'PY'
          from pathlib import Path

          store_path = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java')
          store = store_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'private void pauseEvent(SharedPreferences.Editor e,DriveSignalParser.Event x,String status){String origin=x.type==DriveSignalParser.Type.USER_ACTION_REQUIRED?PAUSE_ORIGIN_AI_USER_ACTION_REQUIRED:PAUSE_ORIGIN_AI_PAUSED;',
                  'private void pauseEvent(SharedPreferences.Editor e,DriveSignalParser.Event x,String status){String origin=pauseOriginForDriveSignal(x.type);',
                  'pauseEvent origin mapping'
              ),
              (
                  'recordPauseAnchor(e,blocking.type==DriveSignalParser.Type.USER_ACTION_REQUIRED?PAUSE_ORIGIN_AI_USER_ACTION_REQUIRED:PAUSE_ORIGIN_AI_PAUSED,blocking.type.name(),pauseAnchorPhase().isEmpty()?PHASE_WAIT_DRIVE_COMMIT:pauseAnchorPhase(),totalCount,blocking);',
                  'recordPauseAnchor(e,pauseOriginForDriveSignal(blocking.type),blocking.type.name(),pauseAnchorPhase().isEmpty()?PHASE_WAIT_DRIVE_COMMIT:pauseAnchorPhase(),totalCount,blocking);',
                  'post-anchor blocking origin mapping'
              ),
              (
                  'if(st.contains("SelfRun Drive 일시정지"))return PAUSE_ORIGIN_AI_PAUSED;',
                  'if(st.contains("SelfRun Drive 일시정지"))return PAUSE_ORIGIN_EXTERNAL_MANUAL;',
                  'legacy drive pause origin'
              ),
          ]
          for old, new, label in replacements:
              count = store.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              store = store.replace(old, new, 1)

          anchor = '    private static String pauseOriginForCause(String cause){String c=safe(cause);if("UI_PAUSE".equals(c))return PAUSE_ORIGIN_UI_MANUAL;if(c.isEmpty())return PAUSE_ORIGIN_UNKNOWN;return PAUSE_ORIGIN_EXTERNAL_MANUAL;}\n'
          helper = ('    static String pauseOriginForDriveSignal(DriveSignalParser.Type type){'
                    'if(type==DriveSignalParser.Type.USER_ACTION_REQUIRED)return PAUSE_ORIGIN_AI_USER_ACTION_REQUIRED;'
                    'if(type==DriveSignalParser.Type.PAUSED)return PAUSE_ORIGIN_EXTERNAL_MANUAL;'
                    'return PAUSE_ORIGIN_AI_PAUSED;}\n')
          if store.count(anchor) != 1:
              raise SystemExit('pauseOriginForCause anchor mismatch')
          if 'static String pauseOriginForDriveSignal(' in store:
              raise SystemExit('pauseOriginForDriveSignal already exists unexpectedly')
          store = store.replace(anchor, anchor + helper, 1)
          store_path.write_text(store, encoding='utf-8')

          policy_path = Path('app/src/test/java/com/shaterguy/chatgptselfrun/DriveResumePolicyTest.java')
          policy = policy_path.read_text(encoding='utf-8')
          marker = '    @Test public void aiUserActionAndAiPauseRemainLatchedWithoutResumeCompletion() {\n'
          test = '''    @Test public void drivePausedSignalMapsToExternalManualAndResumesPlainContinue() {
        String origin = SelfRunStore.pauseOriginForDriveSignal(DriveSignalParser.Type.PAUSED);
        assertEquals(SelfRunStore.PAUSE_ORIGIN_EXTERNAL_MANUAL, origin);
        DriveResumePolicy.Decision decision = DriveResumePolicy.decide(
                DriveResumePolicy.parseOrigin(origin), 3, 3, Collections.emptyList());
        assertEquals(DriveResumePolicy.Action.CONTINUE, decision.action);
        assertEquals("EXTERNAL_MANUAL_ACTION_COMPLETE", decision.reason);
        assertEquals(SelfRunStore.PAUSE_ORIGIN_AI_USER_ACTION_REQUIRED,
                SelfRunStore.pauseOriginForDriveSignal(DriveSignalParser.Type.USER_ACTION_REQUIRED));
    }

'''
          if policy.count(marker) != 1:
              raise SystemExit('DriveResumePolicyTest insertion anchor mismatch')
          if 'drivePausedSignalMapsToExternalManualAndResumesPlainContinue' in policy:
              raise SystemExit('integration policy test already exists unexpectedly')
          policy_path.write_text(policy.replace(marker, test + marker, 1), encoding='utf-8')

          source_path = Path('app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunPauseResumeTest.java')
          source = source_path.read_text(encoding='utf-8')
          marker2 = '    @Test public void pauseAnchorIsDurableAndIncludesOriginCursorAndDriveIdentity() throws Exception {\n'
          test2 = '''    @Test public void drivePauseSignalUsesExternalManualOriginAcrossInitialAndReanchorPaths() throws Exception {
        String store = src("SelfRunStore.java");
        String pause = between(store, "private void pauseEvent", "private void terminal");
        String resume = between(store, "void baselineManualResume", "void captureConversationUrl");
        assertTrue(pause.contains("pauseOriginForDriveSignal(x.type)"));
        assertTrue(resume.contains("pauseOriginForDriveSignal(blocking.type)"));
        assertTrue(store.contains("if(type==DriveSignalParser.Type.PAUSED)return PAUSE_ORIGIN_EXTERNAL_MANUAL"));
        assertTrue(store.contains("if(st.contains(\\\"SelfRun Drive 일시정지\\\"))return PAUSE_ORIGIN_EXTERNAL_MANUAL"));
        assertTrue(store.contains("recordPauseAnchor(e,PAUSE_ORIGIN_AI_PAUSED,code"));
    }

'''
          if source.count(marker2) != 1:
              raise SystemExit('SelfRunPauseResumeTest insertion anchor mismatch')
          if 'drivePauseSignalUsesExternalManualOriginAcrossInitialAndReanchorPaths' in source:
              raise SystemExit('source integration test already exists unexpectedly')
          source_path.write_text(source.replace(marker2, test2 + marker2, 1), encoding='utf-8')
          PY
          git diff --check
          grep -Fq "def selfRunDriveVersionCode = 1000025" app/build.gradle
          grep -Fq "def selfRunDriveVersionName = '1.2.2-dev5'" app/build.gradle
          grep -Fq 'String origin=pauseOriginForDriveSignal(x.type)' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          grep -Fq 'recordPauseAnchor(e,pauseOriginForDriveSignal(blocking.type)' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          grep -Fq 'if(type==DriveSignalParser.Type.PAUSED)return PAUSE_ORIGIN_EXTERNAL_MANUAL' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          grep -Fq 'recordPauseAnchor(e,PAUSE_ORIGIN_AI_PAUSED,code' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          chmod +x tools/verify_drive_variant.sh
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain :app:testDebugUnitTest --tests com.shaterguy.chatgptselfrun.DriveResumePolicyTest --tests com.shaterguy.chatgptselfrun.SelfRunPauseResumeTest
          gradle --no-daemon --console=plain :app:testDebugUnitTest
          gradle --no-daemon --console=plain :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
          grep -Fq "versionCode='1000025'" <<<"$BADGING"
          grep -Fq "versionName='1.2.2-dev5'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          test -z "$(git diff d4ee904ac99747beaa49421e901a92e4f4f49a05 -- app/src/main/AndroidManifest.xml)"
      - name: Commit verified product tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v122-dev5-paused-origin-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(drive): map paused signal to external manual resume'
          git push origin HEAD:selfrun-drive/v1.2.2-dev5
