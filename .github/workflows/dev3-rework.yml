name: SelfRun Drive dev3 verifier rework

on:
  push:
    branches:
      - selfrun-drive/v1.0.0-dev3

permissions:
  contents: write

jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply verifier rework
        run: python3 tools/dev3_rework_patch.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify
        run: |
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Commit verified rework
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/DriveApiClient.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunDriveDev3PolicyTest.java tools/verify_coinstall_emulator.sh
          git diff --cached --check
          git commit -m 'fix: keep Drive recoverable failures retrying'
          git push origin HEAD:selfrun-drive/v1.0.0-dev3
