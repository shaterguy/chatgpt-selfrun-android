        assertTrue(prepare.contains("const same=()=>norm(raw())===expected"));
    }

    @Test public void preparationAlwaysStagesClearThenEmptyReadbackThenFullRetype() {
        String prompt = "[2026.08.20 | 00:47:11] [SELF_RUN_CONTINUE SR-RETRY]\nCommand Received Record Required";
