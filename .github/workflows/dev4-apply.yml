name: Apply SelfRun Drive dev4 continuation patch

on:
  push:
    branches:
      - selfrun-drive/v1.4.1-dev4

permissions:
  contents: write

jobs:
  apply-dev4:
    if: startsWith(github.event.head_commit.message, 'chore(dev4): apply continuation patch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply scoped continuation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def rep(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def between(text, start, end, replacement, label):
              a = text.find(start)
              b = text.find(end, a + len(start))
              if a < 0 or b < 0 or b <= a:
                  raise SystemExit(f'{label}: markers not found')
              return text[:a] + replacement.rstrip() + '\n\n' + text[b:]

          # Version identity: next unused development version after dev3.
          p = 'app/build.gradle'
          s = read(p)
          s = rep(s, 'def selfRunDriveVersionCode = 1000054', 'def selfRunDriveVersionCode = 1000058', 'versionCode')
          s = rep(s, "def selfRunDriveVersionName = '1.4.0'", "def selfRunDriveVersionName = '1.4.1-dev4'", 'versionName')
          write(p, s)

          # Store: direct TURN_COMPLETED -> WebView readiness, continuation success no COMMAND_RECEIVED ACK gate.
          p = 'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java'
          s = read(p)
          s = rep(s,
              '    static final String PHASE_DRIVE_COMMIT_GUARD = "DRIVE_COMMIT_GUARD";\n    static final String PHASE_RESUME_BASELINE = "RESUME_BASELINE";',
              '    static final String PHASE_DRIVE_COMMIT_GUARD = "DRIVE_COMMIT_GUARD"; // legacy persisted-state migration only\n    static final String PHASE_CHECK_CONTINUE_READY = "CHECK_CONTINUE_READY";\n    static final String PHASE_VERIFY_CONTINUE_SUBMISSION = "VERIFY_CONTINUE_SUBMISSION";\n    static final String PHASE_RESUME_BASELINE = "RESUME_BASELINE";',
              'store phases')
          s = between(s, 'void markCommandSubmitted', 'void prepareCommandRetry', '''void markCommandSubmitted(String kind,long due){
 if(!kind.equals(activeCommandKind())||activeCommandPrompt().isEmpty())throw new IllegalStateException("prepared command required");
 if(RETRY_CONTINUE.equals(kind)){
  commitOrThrow(clearCommandWait(prefs.edit())
   .putString("phase",PHASE_WAIT_DRIVE_COMMIT)
   .putString("status","CONTINUE 실제 제출 확인 · Drive 턴 결과 대기")
   .putLong("phaseStartedAt",System.currentTimeMillis()));
  syncHistory();
  return;
 }
 if(!RETRY_BOOTSTRAP.equals(kind)||due<=0)throw new IllegalStateException("bootstrap ACK retry deadline required");
 int n=submissionRetryAttempt()==Integer.MAX_VALUE?Integer.MAX_VALUE:submissionRetryAttempt()+1;
 commitOrThrow(prefs.edit().putBoolean("awaitingCommandAck",true)
  .putString("lastSeenDriveVersion",COMMAND_ACK_FORCE_BODY_VERSION)
  .putString("submissionRetryKind",kind).putString("submissionRetryReason","COMMAND_RECEIVED_PENDING")
  .putLong("submissionRetryDueAt",due).putInt("submissionRetryAttempt",n).putBoolean("submissionRetryReady",false)
  .putString("phase",PHASE_WAIT_DRIVE_COMMIT).putString("status","Bootstrap COMMAND_RECEIVED 대기 · 5분 후 미수신 시 재제출")
  .putLong("phaseStartedAt",System.currentTimeMillis()));
 syncHistory();
}''', 'markCommandSubmitted')
