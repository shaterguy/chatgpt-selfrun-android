              (store, 'CONTINUE 실제 제출 확인 · Drive 턴 결과 대기'),
          ]
          for source, token in required:
              if token not in source:
                  raise SystemExit('required invariant missing: ' + token)
          for banned in ['CONTINUATION_GUARD_MS', 'SUBMISSION_RETRY_MS']:
              if banned in service:
                  raise SystemExit('legacy continuation timer remains: ' + banned)
          PY
