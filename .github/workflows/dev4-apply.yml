        assertTrue(script.contains("isStop"));
        assertTrue(script.contains("send.click()"));
        assertTrue(script.contains("return result('CLICKED'"));
        assertFalse(script.contains("return result('SUBMITTED'"));
    }

    @Test public void verificationUsesStopOrNewUserAndExact2500msFailureTuple() {
        String prompt = "[2026.08.20 | 00:47:11] [SELF_RUN_CONTINUE SR-RETRY]\nCommand Received Record Required";
        String script = SelfRunDom.verifyPreparedDriveTurn(URL, prompt, "SR-RETRY:2");
