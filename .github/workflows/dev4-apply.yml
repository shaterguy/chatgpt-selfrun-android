        assertTrue(script.contains("const writeExpected=()=>"));
        assertTrue(script.contains("saveStage('typed')"));
        assertTrue(script.contains("continuation 전체 문자열 readback 확인"));
    }

    @Test public void clickOnlyTargetsEnabledSendAndDoesNotClaimSubmission() {
        String prompt = "[2026.08.20 | 00:47:11] [SELF_RUN_CONTINUE SR-RETRY]\nCommand Received Record Required";
        String script = SelfRunDom.clickPreparedDriveTurn(URL, prompt, "SR-RETRY:2");
