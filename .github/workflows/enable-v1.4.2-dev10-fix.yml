name: Enable SelfRun Drive dev10 remote fix

on:
  push:
    branches:
      - 'selfrun-drive/v1.4.2-dev10'

permissions:
  contents: write

concurrency:
  group: selfrun-drive-dev10-fix-enable
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Remove connector actor gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path('.github/workflows/apply-v1.4.2-dev10-chat-work-fix.yml')
          lines = target.read_text(encoding='utf-8').splitlines(keepends=True)
          matches = [line for line in lines if line.startswith('    if:') and 'github.actor' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one actor gate, found {len(matches)}')
          target.write_text(''.join(line for line in lines if line is not matches[0]), encoding='utf-8')
          Path('.github/workflows/enable-v1.4.2-dev10-fix.yml').unlink()
          PY
          git diff --check
      - name: Commit enabled workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-v1.4.2-dev10-chat-work-fix.yml \
                  .github/workflows/enable-v1.4.2-dev10-fix.yml
          git commit -m 'ci(drive): allow connector-triggered dev10 fix'
          git push origin "HEAD:${GITHUB_REF_NAME}"
