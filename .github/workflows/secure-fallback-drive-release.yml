name: Secure Fallback Drive Release

on:
  push:
    branches:
      - ops/selfrun-drive-v1.0.0-signing-tools
    paths:
      - .github/workflows/secure-fallback-drive-release.yml

permissions:
  contents: write

env:
  STABLE_SHA: 76337f138f8cd9a802f203c22eb934d1b07d0907
  DRIVE_VERSION_NAME: 1.0.0
  DRIVE_VERSION_CODE: '1000004'
  DRIVE_TAG: drive-v1.0.0
  EXPECTED_CERT_SHA256: b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe
  RELAY_BRANCH: ops/selfrun-drive-v1.0.0-signing-tools

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Generate one-time transport key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/release-transport-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/release-transport-private.pem" -pubout -out "$RUNNER_TEMP/release-transport-public.pem"
      - name: Publish one-time public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-release-transport-public-key
          path: ${{ runner.temp }}/release-transport-public.pem
          if-no-files-found: error
          retention-days: 1
      - name: Await encrypted signing passphrase
        shell: bash
        run: |
          set -euo pipefail
          API_PATH="repos/$GITHUB_REPOSITORY/contents/release-input/passphrase.enc?ref=$RELAY_BRANCH"
          for attempt in $(seq 1 120); do
            if gh api "$API_PATH" --jq .content > "$RUNNER_TEMP/content.b64" 2>/dev/null; then
              tr -d '\n' < "$RUNNER_TEMP/content.b64" | base64 -d > "$RUNNER_TEMP/ciphertext.txt"
              base64 -d "$RUNNER_TEMP/ciphertext.txt" > "$RUNNER_TEMP/ciphertext.bin"
              openssl pkeyutl -decrypt \
                -inkey "$RUNNER_TEMP/release-transport-private.pem" \
                -in "$RUNNER_TEMP/ciphertext.bin" \
                -out "$RUNNER_TEMP/selfrun-drive-signing-pass" \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256
              test "$(wc -c < "$RUNNER_TEMP/selfrun-drive-signing-pass")" -ge 20
              chmod 600 "$RUNNER_TEMP/selfrun-drive-signing-pass"
              exit 0
            fi
            sleep 5
          done
          echo 'encrypted passphrase relay timed out' >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.STABLE_SHA }}
          path: stable
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Install exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Reverify exact stable source and build release
        working-directory: stable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STABLE_SHA"
          test "$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)" = "$DRIVE_VERSION_NAME"
          test "$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)" = "$DRIVE_VERSION_CODE"
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease
      - name: Derive fixed signing identity, sign, and verify
        working-directory: stable
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography==45.0.6'
          BT="$ANDROID_HOME/build-tools/36.0.0"
          SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p "$RUNNER_TEMP/release-output"
          ALIGNED="$RUNNER_TEMP/release-output/chatgpt-selfrun-drive-v${DRIVE_VERSION_NAME}-aligned-unsigned.apk"
          APK="$RUNNER_TEMP/release-output/chatgpt-selfrun-drive-v${DRIVE_VERSION_NAME}.apk"
          "$BT/zipalign" -p -f 4 "$SRC" "$ALIGNED"
          APKSIGNER="$BT/apksigner" tools/sign_release.sh "$ALIGNED" "$RUNNER_TEMP/selfrun-drive-signing-pass" "$APK" > "$RUNNER_TEMP/release-output/APKSIGNER_VERIFY.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/release-output/APK_CERT.txt"
          grep -Fqi "$EXPECTED_CERT_SHA256" "$RUNNER_TEMP/release-output/APK_CERT.txt"
          BADGING="$($BT/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
          grep -Fq "versionCode='$DRIVE_VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$DRIVE_VERSION_NAME'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          sha256sum "$APK" > "$RUNNER_TEMP/release-output/SHA256SUMS.txt"
          cat > "$RUNNER_TEMP/release-output/RELEASE_NOTES.md" <<EOF
          SelfRun Drive v${DRIVE_VERSION_NAME} 정식 릴리스입니다.

          - 기존 WebView SelfRun과 별도 application ID 및 별도 정식 릴리스 계보를 사용합니다.
          - 새 작업의 기본 실행 모드는 일반 Chat입니다.
          - 긴 셀프런 명령 입력 중 IME가 열린 상태에서도 현재 입력 위치가 가시 영역에 유지되도록 개선했습니다.
          - Drive signal event 기반 continuation과 기존 동시 설치 격리를 유지합니다.
          EOF
      - name: Create exact tag and GitHub Release
        working-directory: stable
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/${DRIVE_TAG}" | awk '{print $1}')"
          if [[ -n "$REMOTE_TAG" && "$REMOTE_TAG" != "$STABLE_SHA" ]]; then
            echo "tag ${DRIVE_TAG} already points to another commit" >&2
            exit 1
          fi
          if [[ -z "$REMOTE_TAG" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "$DRIVE_TAG" "$STABLE_SHA"
            git push origin "refs/tags/${DRIVE_TAG}"
          fi
          APK="$RUNNER_TEMP/release-output/chatgpt-selfrun-drive-v${DRIVE_VERSION_NAME}.apk"
          if ! gh release view "$DRIVE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$DRIVE_TAG" "$APK" "$RUNNER_TEMP/release-output/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$STABLE_SHA" \
              --title "SelfRun Drive v${DRIVE_VERSION_NAME}" \
              --notes-file "$RUNNER_TEMP/release-output/RELEASE_NOTES.md" \
              --latest=false
          fi
          gh release view "$DRIVE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets,url > "$RUNNER_TEMP/release-output/RELEASE_READBACK.json"
      - name: Upload fallback release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-v1.0.0-fallback-release-evidence
          path: |
            ${{ runner.temp }}/release-output/APKSIGNER_VERIFY.txt
            ${{ runner.temp }}/release-output/APK_CERT.txt
            ${{ runner.temp }}/release-output/SHA256SUMS.txt
            ${{ runner.temp }}/release-output/RELEASE_READBACK.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove plaintext signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/selfrun-drive-signing-pass" "$RUNNER_TEMP/release-transport-private.pem" "$RUNNER_TEMP/ciphertext.bin" "$RUNNER_TEMP/ciphertext.txt" "$RUNNER_TEMP/content.b64"
