    }
    turnCompletionResyncAttempts++;
    turnCompletionCallbackTimeouts=0;
    runLog.record(store,"TURN_COMPLETION_RESYNC","result=rebuild_same_conversation;attempt="+turnCompletionResyncAttempts+";reason="+safeReason);
