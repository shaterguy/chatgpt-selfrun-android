name: Apply SelfRun Drive v2.2.1-dev2 correction

on:
  push:
    branches:
      - selfrun-drive/v2.2.1-dev2
    paths:
      - .github/workflows/apply-v2.2.1-dev2-correction.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply corrected hidden-WebView resynchronization design
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {text.count(old)}")
              return text.replace(old, new, 1)

          def replace_regex(text, pattern, replacement, label):
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {count}")
              return updated

          dom_path = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunContinuationDom.java')
          dom = dom_path.read_text(encoding='utf-8')
          dom = replace_once(
              dom,
              '    static final String TURN_STOP_SEEN_HOST = "turn-stop-seen";\n'
              '    static final long STALE_STOP_RELOAD_MS = 3 * 60_000L;\n'
              '    static final long RELOADED_STOP_COMPLETION_MS = 30_000L;',
              '    static final String TURN_STOP_SEEN_HOST = "turn-stop-seen";\n'
              '    static final String TURN_RESYNC_HOST = "turn-resync-requested";\n'
              '    static final long STALE_STOP_RESYNC_MS = 3 * 60_000L;',
              'DOM constants')

          observe_method = r'''    static String observeTurnCompletion(String conversationUrl, String runId, String observerToken,
                                        long stabilityMs, boolean allowIdleBaseline) {
        return observeTurnCompletion(conversationUrl, runId, observerToken, stabilityMs,
                allowIdleBaseline, STALE_STOP_RESYNC_MS);
    }

    static String observeTurnCompletion(String conversationUrl, String runId, String observerToken,
                                        long stabilityMs, boolean allowIdleBaseline, long staleStopMs) {
        String conversation = q(SelfRunScript.conversationId(conversationUrl));
        String composerKey = composerKey(conversationUrl);
        String sendKey = sendKey(conversationUrl);
        return "(() =>{const result=(status,detail='')=>JSON.stringify({status,detail,url:location.href});"
                + conversationGuard(conversation) + authGuard() + calibration()
                + composer(composerKey) + "if(!composer)return result('OBSERVER_UNAVAILABLE','completion composer unavailable');"
                + controls(sendKey) + completionObserver(runId, observerToken, stabilityMs, staleStopMs)
                + "return armCompletionObserver(" + allowIdleBaseline + ");})()";
    }

'''
          dom = replace_regex(
              dom,
