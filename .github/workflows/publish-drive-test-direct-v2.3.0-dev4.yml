name: Publish SelfRun Drive TEST direct APK

on:
  push:
    branches:
      - tooling/selfrun-drive-v2.3.0-dev4-test-delivery

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-selfrun-drive-test-v2.3.0-dev4
  cancel-in-progress: false

jobs:
  publish-direct-apk:
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN_ID: '33593176767'
      SOURCE_ARTIFACT: chatgpt-selfrun-drive-test-build
      TARGET_SHA: e6d4636566b3a25829a4eb72a049bb8235e6d4b6
      VERSION_NAME: 2.3.0-dev4
      VERSION_CODE: '2020023'
      PACKAGE_NAME: com.shaterguy.chatgptselfrun.drive.test
      APK_NAME: chatgpt-selfrun-drive-test-v2.3.0-dev4.apk
      TAG_NAME: drive-test-v2.3.0-dev4
      EXPECTED_SIGNER_SHA256: 2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download immutable verified TEST artifact
        run: |
          set -euo pipefail
          mkdir -p reused
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir reused

      - name: Set up Android verification tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - name: Verify exact APK provenance, identity, signer, and checksum
        run: |
          set -euo pipefail
          APK="reused/$APK_NAME"
          SOURCE_FILE="reused/SOURCE_COMMIT.txt"
          SOURCE_SUMS="reused/SHA256SUMS.txt"
          test -s "$APK"
          test -s "$SOURCE_FILE"
          test -s "$SOURCE_SUMS"
          [[ "$(find reused -maxdepth 1 -type f -name "$APK_NAME" | wc -l)" -eq 1 ]]
          [[ "$(tr -d '[:space:]' < "$SOURCE_FILE")" == "$TARGET_SHA" ]]

          EXPECTED_SHA="$(awk '{print $1; exit}' "$SOURCE_SUMS")"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          [[ -n "$EXPECTED_SHA" && "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]

          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > reused/direct-apksigner.txt
          SIGNER_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' reused/direct-apksigner.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$SIGNER_SHA256" == "$EXPECTED_SIGNER_SHA256" ]]

          BADGING="$("$BT/aapt" dump badging "$APK")"
          grep -Fq "package: name='$PACKAGE_NAME'" <<<"$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive TEST'" <<<"$BADGING"

          DIRECT_SUM="reused/${APK_NAME%.apk}.sha256"
          printf '%s  %s\n' "$ACTUAL_SHA" "$APK_NAME" > "$DIRECT_SUM"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "SUM_PATH=$DIRECT_SUM" >> "$GITHUB_ENV"
          echo "APK_SHA256=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Publish TEST-only prerelease assets
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::TEST delivery release already exists: $TAG_NAME"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::TEST delivery tag already exists without release: $TAG_NAME"
            exit 1
          fi

          gh release create "$TAG_NAME" \
            "$APK_PATH" \
            "$SUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "SelfRun Drive TEST v$VERSION_NAME" \
            --prerelease \
            --notes "TEST-only direct install asset for SelfRun Drive $VERSION_NAME. Reuses the already verified and signed APK from Actions run $SOURCE_RUN_ID / artifact $SOURCE_ARTIFACT without rebuilding or resigning. Source commit: $TARGET_SHA. This is not a formal or stable release."

      - name: Read back TEST prerelease and direct asset identity
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME")"
          jq -e --arg tag "$TAG_NAME" --arg target "$TARGET_SHA" \
            '.tag_name == $tag and .target_commitish == $target and .prerelease == true and .draft == false' \
            <<<"$RELEASE_JSON" >/dev/null

          TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")"
          jq -e --arg target "$TARGET_SHA" '.object.sha == $target' <<<"$TAG_JSON" >/dev/null

          APK_URL="$(jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$RELEASE_JSON")"
          SUM_NAME="$(basename "$SUM_PATH")"
          SUM_URL="$(jq -r --arg name "$SUM_NAME" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$RELEASE_JSON")"
          APK_SIZE="$(jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | .size' <<<"$RELEASE_JSON")"
          [[ -n "$APK_URL" && "$APK_URL" != null ]]
          [[ -n "$SUM_URL" && "$SUM_URL" != null ]]
          [[ "$APK_SIZE" -gt 0 ]]

          printf 'TEST_DIRECT_APK_URL=%s\n' "$APK_URL"
          printf 'TEST_DIRECT_SHA256_URL=%s\n' "$SUM_URL"
          printf 'TEST_DIRECT_APK_SHA256=%s\n' "$APK_SHA256"
          printf 'TEST_DIRECT_TARGET_SHA=%s\n' "$TARGET_SHA"
          printf 'TEST_DIRECT_RELEASE_TAG=%s\n' "$TAG_NAME"
