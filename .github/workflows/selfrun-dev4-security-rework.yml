name: SelfRun Drive dev4 security rework

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev4'

permissions:
  contents: write

jobs:
  apply-security-rework:
    if: ${{ !contains(github.event.head_commit.message, '[security-rework-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.3.0-dev4
      - name: Apply bounded run-bound conversation binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          tests = Path('app/src/test/java/com/shaterguy/chatgptselfrun/ConversationFreshnessBarrierTest.java')
          s = service.read_text(encoding='utf-8')
          t = tests.read_text(encoding='utf-8')

          def rep(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          s = rep(s,
              '    static final long SUBMISSION_RETRY_MS = 5 * 60_000L;\n',
              '    static final long SUBMISSION_RETRY_MS = 5 * 60_000L;\n'
              '    private static final long BOOTSTRAP_CONVERSATION_CAPTURE_WINDOW_MS = 10_000L;\n'
              '    private static final long BOOTSTRAP_CONVERSATION_CAPTURE_POLL_MS = 500L;\n',
              'capture constants')

          s = rep(s,
              '    private final Runnable guardRunnable = this::guardElapsed;\n',
              '    private final Runnable guardRunnable = this::guardElapsed;\n'
              '    private final Runnable bootstrapConversationCaptureRunnable = this::captureBootstrapConversationIfReady;\n',
              'capture runnable')

          s = rep(s,
              '    private String conversationFreshnessToken = "";\n',
              '    private String conversationFreshnessToken = "";\n'
              '    private boolean bootstrapConversationCaptureArmed;\n'
              '    private long bootstrapConversationCaptureDeadline;\n'
              '    private int bootstrapConversationCaptureEpoch = -1;\n'
              '    private String bootstrapConversationCaptureRunId = "";\n'
              '    private WebView bootstrapConversationCaptureWebView;\n',
              'capture state')

          s = rep(s,
              '        if(webView!=null&&store.conversationUrl().isEmpty())maybeCaptureConversationUrl(webView.getUrl());\n',
              '',
              'remove continuation opportunistic capture')

          old_capture = '''private void maybeCaptureConversationUrl(String url){if(store.conversationUrl().isEmpty()&&sameProject(store.projectUrl(),url)&&!SelfRunScript.conversationId(url).isEmpty()){store.captureConversationUrl(url);if(sameConversation(store.conversationUrl(),url))runLog.record(store,"CONVERSATION_CAPTURED",SelfRunScript.isGeneralChatUrl(url)?"trusted_general_route":"trusted_project_route");}}\n'''
          new_capture = '''private boolean armBootstrapConversationCapture(){WebView active=webView;String current=active==null?"":active.getUrl();if(active==null||!sameProject(store.projectUrl(),current)||!SelfRunScript.conversationId(current).isEmpty()){disarmBootstrapConversationCapture();return false;}bootstrapConversationCaptureArmed=true;bootstrapConversationCaptureDeadline=System.currentTimeMillis()+BOOTSTRAP_CONVERSATION_CAPTURE_WINDOW_MS;bootstrapConversationCaptureEpoch=automationEpoch;bootstrapConversationCaptureRunId=store.runId();bootstrapConversationCaptureWebView=active;runLog.record(store,"BOOTSTRAP_CONVERSATION_BIND_ARMED","origin=new_chat;network_requests=0");return true;}\nprivate void scheduleBootstrapConversationCapture(){handler.removeCallbacks(bootstrapConversationCaptureRunnable);if(bootstrapConversationCaptureArmed&&store.conversationUrl().isEmpty())handler.postDelayed(bootstrapConversationCaptureRunnable,250L);}\nprivate void captureBootstrapConversationIfReady(){if(!bootstrapConversationCaptureArmed)return;if(bootstrapConversationCaptureEpoch!=automationEpoch||!bootstrapConversationCaptureRunId.equals(store.runId())||bootstrapConversationCaptureWebView==null||bootstrapConversationCaptureWebView!=webView||!canRun()||!store.awaitingCommandAck()||!store.retryForBootstrap()){disarmBootstrapConversationCapture();return;}maybeCaptureConversationUrl(bootstrapConversationCaptureWebView.getUrl());if(!store.conversationUrl().isEmpty()){disarmBootstrapConversationCapture();return;}if(System.currentTimeMillis()>=bootstrapConversationCaptureDeadline){runLog.record(store,"BOOTSTRAP_CONVERSATION_BIND_TIMEOUT","network_requests=0;action=fail_closed_later");disarmBootstrapConversationCapture();return;}handler.postDelayed(bootstrapConversationCaptureRunnable,BOOTSTRAP_CONVERSATION_CAPTURE_POLL_MS);}\nprivate void disarmBootstrapConversationCapture(){handler.removeCallbacks(bootstrapConversationCaptureRunnable);bootstrapConversationCaptureArmed=false;bootstrapConversationCaptureDeadline=0L;bootstrapConversationCaptureEpoch=-1;bootstrapConversationCaptureRunId="";bootstrapConversationCaptureWebView=null;}\nprivate void maybeCaptureConversationUrl(String url){if(!bootstrapConversationCaptureArmed||!store.conversationUrl().isEmpty())return;if(sameProject(store.projectUrl(),url)&&!SelfRunScript.conversationId(url).isEmpty()){store.captureConversationUrl(url);if(sameConversation(store.conversationUrl(),url)){runLog.record(store,"CONVERSATION_CAPTURED",SelfRunScript.isGeneralChatUrl(url)?"trusted_general_route;proof=bootstrap_submit":"trusted_project_route;proof=bootstrap_submit");disarmBootstrapConversationCapture();}}}\n'''
          s = rep(s, old_capture, new_capture, 'run-bound capture helpers')

          old_ready = 'if(SelfRunStore.PHASE_BOOTSTRAP_SEND.equals(phase)&&"READY_TO_SUBMIT".equals(status)){String prompt=commandPrompt(SelfRunStore.RETRY_BOOTSTRAP);evaluate(phase,SelfRunDom.clickPreparedDriveInitial(store.projectUrl(),prompt,store.commandMarkerId()));return;}'
          new_ready = 'if(SelfRunStore.PHASE_BOOTSTRAP_SEND.equals(phase)&&"READY_TO_SUBMIT".equals(status)){if(!armBootstrapConversationCapture()){enterPreservedPause("BOOTSTRAP_CONVERSATION_BIND_ORIGIN_INVALID","bootstrap 제출 직전 새 대화 경로 확인 필요 · 사용자 조치 대기",false);NotificationHelper.notifyUser(this,"확인 필요",store.status());return;}String prompt=commandPrompt(SelfRunStore.RETRY_BOOTSTRAP);evaluate(phase,SelfRunDom.clickPreparedDriveInitial(store.projectUrl(),prompt,store.commandMarkerId()));return;}'
          s = rep(s, old_ready, new_ready, 'arm before bootstrap click')

          old_submitted = 'private void commandSubmitted(String kind,String detail){if(!canRun())return;long due=System.currentTimeMillis()+SUBMISSION_RETRY_MS;store.markCommandSubmitted(kind,due);if(SelfRunStore.RETRY_CONTINUE.equals(kind))invalidateConversationFreshness();runLog.record(store,"COMMAND_SUBMITTED_DRIVE_WAIT","kind="+kind+";attempt="+store.submissionRetryAttempt()+";retryDueAt="+due+";detail="+detail);releaseWakeLock();scheduleDrivePoll(0L);}'
          new_submitted = 'private void commandSubmitted(String kind,String detail){if(!canRun())return;long due=System.currentTimeMillis()+SUBMISSION_RETRY_MS;store.markCommandSubmitted(kind,due);if(SelfRunStore.RETRY_CONTINUE.equals(kind))invalidateConversationFreshness();if(SelfRunStore.RETRY_BOOTSTRAP.equals(kind)){if("BOOTSTRAP_SUBMITTED".equals(detail)&&bootstrapConversationCaptureArmed&&store.conversationUrl().isEmpty())scheduleBootstrapConversationCapture();else disarmBootstrapConversationCapture();}runLog.record(store,"COMMAND_SUBMITTED_DRIVE_WAIT","kind="+kind+";attempt="+store.submissionRetryAttempt()+";retryDueAt="+due+";detail="+detail);releaseWakeLock();scheduleDrivePoll(0L);}'
          s = rep(s, old_submitted, new_submitted, 'actual bootstrap submit binding')

          s = rep(s,
              '    private void removeAutomationCallbacks() {handler.removeCallbacks(driveRunnable); handler.removeCallbacks(webRunnable);handler.removeCallbacks(guardRunnable); handler.removeCallbacks(driveRetryRunnable);}\n',
              '    private void removeAutomationCallbacks() {handler.removeCallbacks(driveRunnable); handler.removeCallbacks(webRunnable);handler.removeCallbacks(guardRunnable); handler.removeCallbacks(driveRetryRunnable);disarmBootstrapConversationCapture();}\n',
              'capture cancellation')

          s = rep(s,
              '    private void cleanupWebView() {handler.removeCallbacks(webRunnable); generation++; domInFlight = false;invalidateConversationFreshness();if (host != null) { host.destroy(); host = null; } webView = null;}\n',
              '    private void cleanupWebView() {handler.removeCallbacks(webRunnable);disarmBootstrapConversationCapture(); generation++; domInFlight = false;invalidateConversationFreshness();if (host != null) { host.destroy(); host = null; } webView = null;}\n',
              'capture cleanup')

          old_test = '''    @Test public void syncCapturesLiveConversationBeforeMissingTargetDecision() throws Exception {\n        String s=src("SelfRunService.java"),ensure=between(s,"private void ensureWebView(){","private void launchWebView");\n        int capture=ensure.indexOf("maybeCaptureConversationUrl(webView.getUrl())");\n        int missing=ensure.indexOf("CONVERSATION_SYNC_TARGET_MISSING");\n        assertTrue(capture>=0);assertTrue(missing>capture);\n        assertTrue(ensure.contains("enterPreservedPause(\\\"CONVERSATION_SYNC_TARGET_MISSING\\\""));\n        assertFalse(ensure.contains("handler.postDelayed(this::ensureWebView,2000L)"));\n    }\n'''
          new_test = '''    @Test public void syncNeverBindsUnknownLiveConversation() throws Exception {\n        String s=src("SelfRunService.java"),ensure=between(s,"private void ensureWebView(){","private void launchWebView");\n        assertFalse(ensure.contains("maybeCaptureConversationUrl(webView.getUrl())"));\n        assertTrue(ensure.contains("enterPreservedPause(\\\"CONVERSATION_SYNC_TARGET_MISSING\\\""));\n        assertFalse(ensure.contains("handler.postDelayed(this::ensureWebView,2000L)"));\n    }\n    @Test public void bootstrapConversationBindingIsCausalBoundedAndLocalOnly() throws Exception {\n        String s=src("SelfRunService.java"),binding=between(s,"private boolean armBootstrapConversationCapture()","private void postWebCallback");\n        assertTrue(binding.contains("SelfRunScript.conversationId(current).isEmpty()"));\n        assertTrue(binding.contains("bootstrapConversationCaptureEpoch=automationEpoch"));\n        assertTrue(binding.contains("bootstrapConversationCaptureRunId=store.runId()"));\n        assertTrue(binding.contains("bootstrapConversationCaptureWebView=active"));\n        assertTrue(binding.contains("store.awaitingCommandAck()"));\n        assertTrue(binding.contains("store.retryForBootstrap()"));\n        assertTrue(binding.contains("BOOTSTRAP_CONVERSATION_CAPTURE_WINDOW_MS"));\n        assertFalse(binding.contains("loadUrl("));assertFalse(binding.contains("reload("));assertFalse(binding.contains("evaluateJavascript("));\n        String submit=between(s,"private void commandSubmitted","private static boolean isSubmissionPhase");\n        assertTrue(submit.contains("\\\"BOOTSTRAP_SUBMITTED\\\".equals(detail)"));\n        assertTrue(submit.contains("scheduleBootstrapConversationCapture()"));\n        String handling=between(s,"private void handleWebResult","private String driveBootstrap");\n        assertTrue(handling.contains("armBootstrapConversationCapture()"));\n        assertTrue(handling.contains("BOOTSTRAP_CONVERSATION_BIND_ORIGIN_INVALID"));\n    }\n'''
          t = rep(t, old_test, new_test, 'security regression tests')

          service.write_text(s, encoding='utf-8')
          tests.write_text(t, encoding='utf-8')
          PY
          git diff --check
          git diff -- app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java app/src/test/java/com/shaterguy/chatgptselfrun/ConversationFreshnessBarrierTest.java
      - name: Commit security rework
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SHatergUY'
          git config user.email '108107617+shaterguy@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java app/src/test/java/com/shaterguy/chatgptselfrun/ConversationFreshnessBarrierTest.java
          git commit -m 'fix(drive): bind canonical conversation to bootstrap submit [security-rework-applied]'
          git push origin HEAD:selfrun-drive/v1.3.0-dev4
