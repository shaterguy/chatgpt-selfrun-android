name: SelfRun Drive dev4 security rework

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev4'

permissions:
  contents: write

jobs:
  apply-security-rework:
    if: ${{ !contains(github.event.head_commit.message, '[security-rework-final2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.3.0-dev4
      - name: Remove final opportunistic canonical capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          s=p.read_text(encoding='utf-8')
          old='if(webView!=null){maybeCaptureConversationUrl(webView.getUrl());scheduleWeb(250L);return;}'
          new='if(webView!=null){scheduleWeb(250L);return;}'
          if s.count(old)!=1:
              raise SystemExit(f'ensureWebView opportunistic capture: expected 1 match, got {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          test "$(grep -o 'maybeCaptureConversationUrl(' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java | wc -l)" -eq 2
      - name: Commit final security rework
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SHatergUY'
          git config user.email '108107617+shaterguy@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          git commit -m 'fix(drive): make bootstrap poll sole canonical binder [security-rework-final2-applied]'
          git push origin HEAD:selfrun-drive/v1.3.0-dev4
