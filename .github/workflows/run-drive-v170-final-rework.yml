name: Run SelfRun Drive v1.7.0 final rework

on:
  push:
    branches:
      - selfrun-drive/v1.7.0-dev1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Apply exact source patch
        run: |
          set -euo pipefail
          python3 tools/apply_drive_v170_final_rework.py
          git diff --check
          git diff --stat
      - name: Verify before committing source
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac
      - name: Commit verified source
        run: |
          set -euo pipefail
          git config user.name 'SelfRun GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src
          test -n "$(git status --porcelain -- app/src)"
          git commit -m 'fix(drive): preserve rollover state and transient boundaries'
          git push origin HEAD:selfrun-drive/v1.7.0-dev1
