name: SelfRun Drive v1.2.3 APK Delivery

on:
  push:
    branches:
      - ops/selfrun-drive-v1.2.3-release-recovery
    paths:
      - .github/workflows/apk-delivery-v1.2.3.yml

permissions:
  contents: read
  statuses: write

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DRIVE_TAG: drive-v1.2.3
      APK_NAME: chatgpt-selfrun-drive-v1.2.3.apk
      SUMS_NAME: SHA256SUMS.txt
      EXPECTED_SHA256: 626d94c2a4f49125742ac17d8f9d6a7b200de222c862a0aa38b5e5aa3eb922cb
    steps:
      - name: Download exact released APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          gh release download "$DRIVE_TAG" --repo "$GITHUB_REPOSITORY" -p "$APK_NAME" -p "$SUMS_NAME" -D delivery
          ACTUAL_SHA="$(sha256sum "delivery/$APK_NAME" | awk '{print $1}')"
          MANIFEST_SHA="$(awk 'NF {print $1; exit}' "delivery/$SUMS_NAME")"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA256"
          test "$MANIFEST_SHA" = "$EXPECTED_SHA256"
      - name: Upload exact release delivery artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-v1.2.3-apk-delivery
          path: |
            delivery/chatgpt-selfrun-drive-v1.2.3.apk
            delivery/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
      - name: Publish delivery artifact ID
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="apk-delivery-artifact/${ARTIFACT_ID}" \
            -f description="exact v1.2.3 APK delivery artifact ready" \
            -f target_url="$RUN_URL" >/dev/null
