name: Fix SelfRun Drive rollover dev1 policy

on:
  push:
    branches:
      - 'selfrun-drive/v1.7.0-dev1'
    paths:
      - '.github/workflows/fix-rollover-dev1-policy.yml'

permissions:
  contents: write

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.7.0-dev1
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Align rollover lifecycle and verification policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          s = service.read_text(encoding='utf-8')
          old = 'if (resumed.started()) { adoptSuccessorRuntime(); startForegroundCompat(); resumeStateMachine(); }'
          if s.count(old) != 1:
              raise SystemExit(f'resume foreground match count={s.count(old)}')
          s = s.replace(old, 'if (resumed.started()) { adoptSuccessorRuntime(); resumeStateMachine(); }', 1)
          old = '''        if (result.started()) {
            adoptSuccessorRuntime();
            startForegroundCompat();
            handler.post(this::resumeStateMachine);
            return;
        }
'''
          if s.count(old) != 1:
              raise SystemExit(f'rollover foreground match count={s.count(old)}')
          s = s.replace(old, '''        if (result.started()) {
            adoptSuccessorRuntime();
            handler.post(this::resumeStateMachine);
            return;
        }
''', 1)
          service.write_text(s, encoding='utf-8')

          verify = Path('tools/verify_drive_variant.sh')
          v = verify.read_text(encoding='utf-8')
          v = v.replace('ACTIVITY=$SRC/SelfRunNewActivity.java\n', 'ACTIVITY=$SRC/SelfRunNewActivity.java\nRUN_ID=$SRC/SelfRunRunId.java\n', 1)
          v = v.replace("grep -Fq 'RUN_SUFFIX_LENGTH = 6' \"$ACTIVITY\"\ngrep -Fq 'TimeZone.getTimeZone(\"Asia/Seoul\")' \"$ACTIVITY\"\n! grep -Fq 'UUID.randomUUID' \"$ACTIVITY\"\n",
                        "grep -Fq 'SUFFIX_LENGTH = 6' \"$RUN_ID\"\ngrep -Fq 'TimeZone.getTimeZone(\"Asia/Seoul\")' \"$RUN_ID\"\n! grep -Fq 'UUID.randomUUID' \"$RUN_ID\"\n", 1)
          v = v.replace('[[ "$FG_POST_COUNT" == \'4\' ]]', '[[ "$FG_POST_COUNT" == \'5\' ]]', 1)
          verify.write_text(v, encoding='utf-8')
          PY
          git diff --check
      - name: Verify policy, unit tests, and QA compile
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleQaApp
      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java tools/verify_drive_variant.sh
          git commit -m 'fix(drive): align rollover lifecycle policy'
          git push origin HEAD:selfrun-drive/v1.7.0-dev1
