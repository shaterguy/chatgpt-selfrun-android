name: SelfRun Dual Submission
on:
  push:
    branches: ['feature/ondevice-v3-submit-common-signal-20261002']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: selfrun-dual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  red-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: RED - prove requested contract is absent from exact baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == '0a90983736db71e26742933ae267b3ce3034c40d' ]]
          if gradle --build-cache --no-daemon --console=plain :app:testQaAppUnitTest --tests com.shaterguy.chatgptselfrun.SelfRunDualSubmissionTest; then
            echo 'Unexpected GREEN on the unmodified product baseline' >&2
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('app/build/test-results/testQaAppUnitTest/TEST-com.shaterguy.chatgptselfrun.SelfRunDualSubmissionTest.xml')
          root = ET.parse(p).getroot()
          expected = {'onDeviceUsesTheSameVercelCompletionWaitAsServer', 'readyEventPersistsSubmissionChoiceBeforeAnySend', 'completionAndSettingsAreSeparatedFromSubmissionTransport', 'bothSubmissionModesHaveExplicitSettingsDescriptions'}
          failures = {t.attrib['name'] for t in root.findall('testcase') if t.find('failure') is not None}
          assert failures == expected, (failures, expected)
          assert not root.findall('.//error')
          for t in root.findall('testcase'):
              assert t.find('failure').attrib.get('type') in ('java.lang.AssertionError', 'org.junit.ComparisonFailure')
          print('RED_CONFIRMED: four requested-contract assertions fail on baseline 0a909837; no compile/runtime errors')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: selfrun-dual-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/test-results/testQaAppUnitTest
