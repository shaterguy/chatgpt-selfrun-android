name: Build SelfRun DEV and TEST update

on:
  push:
    branches:
      - 'selfrun-v4/v4.0.11-dev2'

permissions:
  contents: read

jobs:
  sign-dev-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: true

      - name: Verify distinct application IDs and new version code
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "selfRunDriveVersionCode = 4002024" app/build.gradle
          grep -Fq "selfRunDriveVersionName = '4.0.11-dev2'" app/build.gradle
          grep -Fq "applicationId 'com.shaterguy.chatgptselfrun.drive'" app/build.gradle
          grep -Fq "applicationIdSuffix '.dev'" app/build.gradle
          grep -Fq "applicationIdSuffix '.test'" app/build.gradle

      - name: Build DEV and TEST only, never the formal APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:verifyDriveVariantIdentity :app:testQaAppUnitTest :app:assembleDevApp :app:assembleQaApp
          BT="$ANDROID_HOME/build-tools/36.0.0"
          DEV_RAW="$(find app/build/outputs/apk/devApp -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          TEST_RAW="$(find app/build/outputs/apk/qaApp -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -s "$DEV_RAW"
          test -s "$TEST_RAW"
          mkdir -p release-output
          "$BT/zipalign" -p -f 4 "$DEV_RAW" release-output/dev-aligned.apk
          "$BT/zipalign" -p -f 4 "$TEST_RAW" release-output/test-aligned.apk

      - name: Prepare pinned test signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all:             -r tools/signing-requirements-linux-x86_64-py312.txt

      - name: Sign both APKs using existing developer TEST signer
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/selfrun-dev-test-passphrase"
          umask 077
          trap 'rm -f "$PASS_FILE"' EXIT
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          DEV="release-output/SelfRun-Drive-DEV-v4.0.11-dev2.apk"
          TEST="release-output/SelfRun-Drive-TEST-v4.0.11-dev2.apk"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh             release-output/dev-aligned.apk "$PASS_FILE" "$DEV"             > release-output/DEV_SIGN_REPORT.txt
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh             release-output/test-aligned.apk "$PASS_FILE" "$TEST"             > release-output/TEST_SIGN_REPORT.txt
          "$BT/apksigner" verify --verbose --print-certs "$DEV" > release-output/DEV_CERT.txt
          "$BT/apksigner" verify --verbose --print-certs "$TEST" > release-output/TEST_CERT.txt
          CERT='2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e'
          grep -Fqi "$CERT" release-output/DEV_CERT.txt
          grep -Fqi "$CERT" release-output/TEST_CERT.txt

          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' release-output/DEV_CERT.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' release-output/DEV_CERT.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' release-output/TEST_CERT.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' release-output/TEST_CERT.txt
          DEV_BADGING="$($BT/aapt dump badging "$DEV")"
          TEST_BADGING="$($BT/aapt dump badging "$TEST")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.dev' versionCode='4002024' versionName='4.0.11-dev2'" <<< "$DEV_BADGING"
          grep -Fq "application-label:'SelfRun Drive DEV'" <<< "$DEV_BADGING"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test' versionCode='4002024' versionName='4.0.11-dev2'" <<< "$TEST_BADGING"
          grep -Fq "application-label:'SelfRun Drive TEST'" <<< "$TEST_BADGING"
          sha256sum "$DEV" "$TEST" > release-output/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > release-output/SOURCE_COMMIT.txt
          printf 'sourceSha=%s\nversionName=4.0.11-dev2\nversionCode=4002024\ndevPackage=com.shaterguy.chatgptselfrun.drive.dev\ntestPackage=com.shaterguy.chatgptselfrun.drive.test\ncertificateSha256=%s\n' \
            "$GITHUB_SHA" "$CERT" > release-output/IDENTITY.txt

      - name: Upload exact developer signed APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-4.0.11-dev2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-output/SelfRun-Drive-DEV-v4.0.11-dev2.apk
            release-output/SelfRun-Drive-TEST-v4.0.11-dev2.apk
            release-output/SHA256SUMS.txt
            release-output/SOURCE_COMMIT.txt
            release-output/IDENTITY.txt
            release-output/DEV_CERT.txt
            release-output/TEST_CERT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
