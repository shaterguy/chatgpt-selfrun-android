name: V02 Test Alignment

on:
  push:
    branches: [v0.2.3-dev4]
    paths:
      - .github/workflows/v02-test-align.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.2.3-dev4
          fetch-depth: 0
      - name: Align stale contract test to run-level timer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunBatteryEfficiencyTest.java')
          text = path.read_text()
          old = '''        assertTrue(rateBody.contains("scheduleRateLimitExpiry()"));\n        assertTrue(rateBody.contains("isCurrentExecution(expectedWebView, expectedGeneration, expectedRunId)"));\n        assertTrue(rateBody.contains("beginRecovery(\\"rate_limit_expired\\")"));\n'''
          new = '''        assertTrue(rateBody.contains("scheduleRateLimitExpiry()"));\n        assertTrue(rateBody.contains("rateLimitTimerEpoch"));\n        assertTrue(rateBody.contains("isCurrentRateLimitTimer(expectedRunId, expectedTimerEpoch, expectedDeadline)"));\n        assertTrue(rateBody.contains("expectedRunId.equals(store.runId())"));\n        assertTrue(rateBody.contains("expectedTimerEpoch == rateLimitTimerEpoch"));\n        assertTrue(rateBody.contains("expectedDeadline == rateLimitedUntilElapsed"));\n        assertFalse(rateBody.contains("isCurrentExecution(expectedWebView, expectedGeneration, expectedRunId)"));\n        assertTrue(rateBody.contains("beginRecovery(\\"rate_limit_expired\\")"));\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected old contract once, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunBatteryEfficiencyTest.java
      - name: Commit aligned contract test
        shell: bash
        run: |
          git config user.name 'SHatergUY'
          git config user.email '108107617+shaterguy@users.noreply.github.com'
          git add app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunBatteryEfficiencyTest.java
          git commit -m 'Align rate-limit recovery contract test'
          git push origin HEAD:v0.2.3-dev4
