name: AC06 runtime evidence

on:
  push:
    branches:
      - v0.2.3-dev6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ac06-runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_AVD_HOME="$RUNNER_TEMP/selfrun-ac06-avd"
          export ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name selfrun-ac06 \
            --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx 'selfrun-ac06'

      - name: Start emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd selfrun-ac06 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -no-metrics \
            > "$RUNNER_TEMP/selfrun-ac06-emulator.log" 2>&1 &
          boot_completed=""
          for attempt in $(seq 1 120); do
            if timeout 2 adb get-state >/dev/null 2>&1; then
              boot_completed="$(timeout 2 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot_completed" = "1" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ "$boot_completed" != "1" ]; then
            tail -n 250 "$RUNNER_TEMP/selfrun-ac06-emulator.log" || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'

      - name: Prepare exact dev5 and dev6 probe worktrees
        shell: bash
        env:
          BASELINE_SHA: c3d7d800405608fa7bdee34b1f4a7d4a14795291
        run: |
          set -euo pipefail
          DEV5="$RUNNER_TEMP/ac06-dev5"
          DEV6="$RUNNER_TEMP/ac06-dev6"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git cat-file -e "$GITHUB_SHA^{commit}"
          git worktree add --detach "$DEV5" "$BASELINE_SHA"
          git worktree add --detach "$DEV6" "$GITHUB_SHA"
          python3 tools/ac06/instrument_variant.py --source-root "$GITHUB_WORKSPACE" --worktree "$DEV5"
          python3 tools/ac06/instrument_variant.py --source-root "$GITHUB_WORKSPACE" --worktree "$DEV6"
          echo "DEV5=$DEV5" >> "$GITHUB_ENV"
          echo "DEV6=$DEV6" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/ac06-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ac06-evidence"
          git -C "$DEV5" rev-parse HEAD
          git -C "$DEV6" rev-parse HEAD

      - name: Build instrumented debug variants
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$DEV5" --no-daemon --console=plain --stacktrace :app:assembleDebug
          gradle -p "$DEV6" --no-daemon --console=plain --stacktrace :app:assembleDebug
          test -s "$DEV5/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$DEV6/app/build/outputs/apk/debug/app-debug.apk"

      - name: Run dev5 process renderer and I/O scenarios
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/ac06/run_variant.sh
          tools/ac06/run_variant.sh \
            dev5-c3d7d800405608fa7bdee34b1f4a7d4a14795291 \
            "$DEV5/app/build/outputs/apk/debug/app-debug.apk" \
            "$EVIDENCE/dev5"

      - name: Run dev6 process renderer and I/O scenarios
        shell: bash
        run: |
          set -euo pipefail
          tools/ac06/run_variant.sh \
            "dev6-$GITHUB_SHA" \
            "$DEV6/app/build/outputs/apk/debug/app-debug.apk" \
            "$EVIDENCE/dev6"

      - name: Compare dev5 and dev6 runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ac06/compare_matrix.py \
            "$EVIDENCE/dev5/combined.json" \
            "$EVIDENCE/dev6/combined.json" \
            | tee "$EVIDENCE/AC06_SUMMARY.md"
          cat "$EVIDENCE/AC06_SUMMARY.md"

      - name: Upload AC06 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-v0.2.3-dev6-ac06-runtime-evidence
          path: ${{ runner.temp }}/ac06-evidence

      - name: Emulator diagnostics
        if: always()
        shell: bash
        run: |
          adb devices || true
          timeout 2 adb shell getprop ro.build.version.sdk || true
          tail -n 250 "$RUNNER_TEMP/selfrun-ac06-emulator.log" || true
