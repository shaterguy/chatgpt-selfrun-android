name: Build SelfRun 2.0 TEST
run-name: SelfRun 2.0 TEST (${{ github.ref_name }}) #${{ github.run_number }}.${{ github.run_attempt }}

on:
  push:
    branches:
      - 'selfrun-drive-v2/v2.*-dev*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: selfrun-v2-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-coinstall:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Verify source lineage, profile tests, and build
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='5f4756c433c49f4ad083db9b0d18c0e1100c9236'
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          [[ "$(git rev-list --max-parents=0 HEAD | head -1)" != '' ]]
          grep -Fq "applicationId 'com.shaterguy.chatgptselfrun.v2'" app/build.gradle
          grep -Fq "selfRunDriveVersionName = '2.0.0-dev9'" app/build.gradle
          grep -Fq "androidx.webkit:webkit:1.17.0" app/build.gradle
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleQaApp
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$(find app/build/outputs/apk/qaApp -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -s "$UNSIGNED"
          BADGING="$($BT/aapt dump badging "$UNSIGNED")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.v2.test'" <<<"$BADGING"
          grep -Fq "versionCode='2000009'" <<<"$BADGING"
          grep -Fq "versionName='2.0.0-dev9'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun 2.0 TEST'" <<<"$BADGING"

      - name: Install hash-locked signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt

      - name: Sign and verify SelfRun 2.0 TEST
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/selfrun-v2-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$(find app/build/outputs/apk/qaApp -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          OUT=app/build/outputs/selfrun-v2-test
          mkdir -p "$OUT"
          ALIGNED="$OUT/chatgpt-selfrun-v2-test-v2.0.0-dev9-aligned-unsigned.apk"
          APK="$OUT/chatgpt-selfrun-v2-test-v2.0.0-dev9.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh "$ALIGNED" "$PASS_FILE" "$APK" > "$OUT/APKSIGNER_VERIFY.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$OUT/APK_CERT.txt"
          BADGING="$($BT/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.v2.test'" <<<"$BADGING"
          grep -Fq "versionCode='2000009'" <<<"$BADGING"
          grep -Fq "versionName='2.0.0-dev9'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun 2.0 TEST'" <<<"$BADGING"
          sha256sum "$APK" > "$OUT/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_COMMIT.txt"
          printf '%s\n' "$GITHUB_REF_NAME" > "$OUT/SOURCE_BRANCH.txt"

      - name: Build and sign immutable v1.8.0 TEST comparator
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          BASE_SHA='5f4756c433c49f4ad083db9b0d18c0e1100c9236'
          PREV_SRC="$RUNNER_TEMP/selfrun-v18-test-src"
          git worktree add --detach "$PREV_SRC" "$BASE_SHA"
          gradle --build-cache --no-daemon --console=plain --stacktrace --project-dir "$PREV_SRC" :app:assembleQaApp
          PREV_UNSIGNED="$(find "$PREV_SRC/app/build/outputs/apk/qaApp" -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -s "$PREV_UNSIGNED"
          PASS_FILE="$RUNNER_TEMP/selfrun-v18-signing-pass"
          trap 'rm -f "$PASS_FILE"; git worktree remove --force "$PREV_SRC" || true' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p comparator
          PREV_ALIGNED=comparator/selfrun-v18-test-aligned.apk
          PREV_APK=comparator/selfrun-v18-test.apk
          "$BT/zipalign" -p -f 4 "$PREV_UNSIGNED" "$PREV_ALIGNED"
          APKSIGNER="$BT/apksigner" bash "$PREV_SRC/tools/sign_test.sh" "$PREV_ALIGNED" "$PASS_FILE" "$PREV_APK" >/dev/null
          "$BT/apksigner" verify "$PREV_APK"
          "$BT/aapt" dump badging "$PREV_APK" | grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'"

      - name: Download immutable v1.8.0 formal comparator
        shell: bash
        run: |
          set -euo pipefail
          gh release download drive-v1.8.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'chatgpt-selfrun-drive-v1.8.0.apk' --dir comparator
          test -s comparator/chatgpt-selfrun-drive-v1.8.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging comparator/chatgpt-selfrun-drive-v1.8.0.apk \
            | grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'"

      - name: Download immutable v2.0.0-dev8 TEST predecessor
        shell: bash
        run: |
          set -euo pipefail
          PREV_RUN_ID='33180300750'
          PREV_ARTIFACT='selfrun-v2-test-843d3cdabe5633c04b5b1f73582cb2a695c85d70-1'
          PREV_SHA='843d3cdabe5633c04b5b1f73582cb2a695c85d70'
          PREV_BRANCH='selfrun-drive-v2/v2.0.0-dev8'
          mkdir -p comparator-v2
          gh run download "$PREV_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PREV_ARTIFACT" --dir comparator-v2
          PREV_V2="$(find comparator-v2 -type f -name 'chatgpt-selfrun-v2-test-v2.0.0-dev8.apk' -print -quit)"
          test -s "$PREV_V2"
          [[ "$(tr -d '[:space:]' < comparator-v2/SOURCE_COMMIT.txt)" == "$PREV_SHA" ]]
          [[ "$(tr -d '\r\n' < comparator-v2/SOURCE_BRANCH.txt)" == "$PREV_BRANCH" ]]
          BT="$ANDROID_HOME/build-tools/36.0.0"
          BADGING="$($BT/aapt dump badging "$PREV_V2")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.v2.test'" <<<"$BADGING"
          grep -Fq "versionCode='2000008'" <<<"$BADGING"
          grep -Fq "versionName='2.0.0-dev8'" <<<"$BADGING"
          "$BT/apksigner" verify --verbose --print-certs "$PREV_V2" > comparator-v2/APK_CERT.txt
          grep -Fqi '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' comparator-v2/APK_CERT.txt

      - name: Prepare simultaneous-install and update verification script
        shell: bash
        run: |
          set -euo pipefail
          COINSTALL_SCRIPT="$RUNNER_TEMP/selfrun-v2-coinstall.sh"
          cat > "$COINSTALL_SCRIPT" <<'BASH'
          set -euo pipefail
          adb wait-for-device
          READY=0
          for attempt in $(seq 1 30); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]] \
                && adb shell cmd package list packages >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          [[ "$READY" == '1' ]]
          gradle --build-cache --no-daemon --console=plain --stacktrace \
            :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.shaterguy.chatgptselfrun.RichComposerBootstrapWebViewTest
          adb uninstall com.shaterguy.chatgptselfrun.v2.test >/dev/null 2>&1 || true
          adb uninstall com.shaterguy.chatgptselfrun.v2 >/dev/null 2>&1 || true
          CURRENT=app/build/outputs/selfrun-v2-test/chatgpt-selfrun-v2-test-v2.0.0-dev9.apk
          PREV_V2="$(find comparator-v2 -type f -name 'chatgpt-selfrun-v2-test-v2.0.0-dev8.apk' -print -quit)"
          PROD=comparator/chatgpt-selfrun-drive-v1.8.0.apk
          TEST1=comparator/selfrun-v18-test.apk
          adb install "$PROD"
          adb install "$TEST1"
          adb install "$PREV_V2"
          PROD_BEFORE="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.drive | grep -E 'versionCode=|lastUpdateTime=|dataDir=' | tr -d '\r')"
          TEST_BEFORE="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.drive.test | grep -E 'versionCode=|lastUpdateTime=|dataDir=' | tr -d '\r')"
          V2_BEFORE="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.v2.test | grep -E 'versionCode=|lastUpdateTime=|dataDir=' | tr -d '\r')"
          V2_DATA_BEFORE="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.v2.test | grep -m1 'dataDir=' | sed 's/.*dataDir=//' | tr -d '\r')"
          grep -Fq 'versionCode=2000008' <<<"$V2_BEFORE"
          adb install -r "$CURRENT"
          PROD_AFTER="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.drive | grep -E 'versionCode=|lastUpdateTime=|dataDir=' | tr -d '\r')"
          TEST_AFTER="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.drive.test | grep -E 'versionCode=|lastUpdateTime=|dataDir=' | tr -d '\r')"
          V2_AFTER="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.v2.test | grep -E 'versionCode=|lastUpdateTime=|dataDir=' | tr -d '\r')"
          V2_DATA_AFTER="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.v2.test | grep -m1 'dataDir=' | sed 's/.*dataDir=//' | tr -d '\r')"
          grep -Fq 'versionCode=2000009' <<<"$V2_AFTER"
          [[ "$V2_DATA_BEFORE" == "$V2_DATA_AFTER" ]]
          [[ "$PROD_BEFORE" == "$PROD_AFTER" ]]
          [[ "$TEST_BEFORE" == "$TEST_AFTER" ]]
          adb shell pm list packages | grep -Fxq 'package:com.shaterguy.chatgptselfrun.drive'
          adb shell pm list packages | grep -Fxq 'package:com.shaterguy.chatgptselfrun.drive.test'
          adb shell pm list packages | grep -Fxq 'package:com.shaterguy.chatgptselfrun.v2.test'
          V2_DATA="$V2_DATA_AFTER"
          PROD_DATA="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.drive | grep -m1 'dataDir=' | sed 's/.*dataDir=//' | tr -d '\r')"
          TEST_DATA="$(adb shell dumpsys package com.shaterguy.chatgptselfrun.drive.test | grep -m1 'dataDir=' | sed 's/.*dataDir=//' | tr -d '\r')"
          [[ -n "$V2_DATA" && "$V2_DATA" != "$PROD_DATA" && "$V2_DATA" != "$TEST_DATA" ]]
          printf '%s\n' "$PROD_BEFORE" > app/build/outputs/selfrun-v2-test/COINSTALL_PROD_STATE.txt
          printf '%s\n' "$TEST_BEFORE" > app/build/outputs/selfrun-v2-test/COINSTALL_TEST_STATE.txt
          printf 'before:\n%s\nafter:\n%s\n' "$V2_BEFORE" "$V2_AFTER" > app/build/outputs/selfrun-v2-test/COINSTALL_V2_UPDATE_STATE.txt
          printf 'v2DataDir=%s\nprodDataDir=%s\ntestDataDir=%s\n' "$V2_DATA" "$PROD_DATA" "$TEST_DATA" > app/build/outputs/selfrun-v2-test/DATA_DIRS.txt
          BASH
          chmod 700 "$COINSTALL_SCRIPT"

      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Verify slugged project bootstrap, dev8 update, and 1.x coinstallation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash "$RUNNER_TEMP/selfrun-v2-coinstall.sh"

      - name: Upload SelfRun 2.0 TEST artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-v2-test-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/selfrun-v2-test/chatgpt-selfrun-v2-test-v2.0.0-dev9.apk
            app/build/outputs/selfrun-v2-test/SHA256SUMS.txt
            app/build/outputs/selfrun-v2-test/APKSIGNER_VERIFY.txt
            app/build/outputs/selfrun-v2-test/APK_CERT.txt
            app/build/outputs/selfrun-v2-test/SOURCE_COMMIT.txt
            app/build/outputs/selfrun-v2-test/SOURCE_BRANCH.txt
            app/build/outputs/selfrun-v2-test/COINSTALL_PROD_STATE.txt
            app/build/outputs/selfrun-v2-test/COINSTALL_TEST_STATE.txt
            app/build/outputs/selfrun-v2-test/COINSTALL_V2_UPDATE_STATE.txt
            app/build/outputs/selfrun-v2-test/DATA_DIRS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30