name: Verify SelfRun Drive update paths

on:
  push:
    branches:
      - 'verification/selfrun-drive-v1.2.1-update-paths'

permissions:
  contents: read
  actions: read

jobs:
  verify-update-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download exact signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apks/dev6 apks/rc1
          gh release download drive-v1.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'chatgpt-selfrun-drive-v1.1.0.apk' --dir apks
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/9243381956/zip" > dev6-build.zip
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/9245498235/zip" > rc1-build.zip
          unzip -q dev6-build.zip -d apks/dev6
          unzip -q rc1-build.zip -d apks/rc1
          test -s apks/chatgpt-selfrun-drive-v1.1.0.apk
          test -s apks/dev6/chatgpt-selfrun-drive-v1.2.1-dev6.apk
          test -s apks/rc1/chatgpt-selfrun-drive-v1.2.1.apk
      - name: Verify package versions and signing lineage
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          EXPECTED_CERT='b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe'
          : > update-evidence.txt
          check_apk() {
            local apk="$1" expected_name="$2" expected_code="$3" label="$4"
            local badging cert
            badging="$($BT/aapt dump badging "$apk")"
            grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$badging"
            grep -Fq "versionName='$expected_name'" <<<"$badging"
            grep -Fq "versionCode='$expected_code'" <<<"$badging"
            cert="$($BT/apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
            [[ "$cert" == "$EXPECTED_CERT" ]]
            printf '%s package=PASS versionName=%s versionCode=%s cert=%s\n' "$label" "$expected_name" "$expected_code" "$cert" | tee -a update-evidence.txt
          }
          check_apk apks/chatgpt-selfrun-drive-v1.1.0.apk 1.1.0 1000009 v1.1.0
          check_apk apks/dev6/chatgpt-selfrun-drive-v1.2.1-dev6.apk 1.2.1-dev6 1000020 dev6
          check_apk apks/rc1/chatgpt-selfrun-drive-v1.2.1.apk 1.2.1 1000021 rc1
          sha256sum apks/chatgpt-selfrun-drive-v1.1.0.apk apks/dev6/chatgpt-selfrun-drive-v1.2.1-dev6.apk apks/rc1/chatgpt-selfrun-drive-v1.2.1.apk | tee -a update-evidence.txt
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Verify in-place update paths on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: >-
            bash -o pipefail -c '
            set -euo pipefail;
            PKG=com.shaterguy.chatgptselfrun.drive;
            RC1=apks/rc1/chatgpt-selfrun-drive-v1.2.1.apk;
            field() { adb shell dumpsys package "$PKG" | tr -d "\r" | sed -n "s/^[[:space:]]*$1=//p" | head -1; };
            uid() { adb shell dumpsys package "$PKG" | tr -d "\r" | sed -n "s/^[[:space:]]*userId=//p" | head -1; };
            vname() { adb shell dumpsys package "$PKG" | tr -d "\r" | sed -n "s/^[[:space:]]*versionName=//p" | head -1; };
            vcode() { adb shell dumpsys package "$PKG" | tr -d "\r" | sed -n "s/^[[:space:]]*versionCode=\([0-9][0-9]*\).*/\1/p" | head -1; };
            scenario() {
              local base="$1" expected_base="$2" marker="$3" label="$4";
              adb uninstall "$PKG" >/dev/null 2>&1 || true;
              adb install -r "$base" | tee -a update-evidence.txt;
              [[ "$(vname)" == "$expected_base" ]];
              local before_uid before_dir before_first ext;
              before_uid="$(uid)";
              before_dir="$(field dataDir)";
              before_first="$(field firstInstallTime)";
              ext="/sdcard/Android/data/$PKG/files";
              adb shell mkdir -p "$ext";
              printf "%s" "$marker" | adb shell "cat > $ext/update-sentinel.txt";
              [[ "$(adb shell cat "$ext/update-sentinel.txt" | tr -d "\r")" == "$marker" ]];
              adb install -r "$RC1" | tee -a update-evidence.txt;
              [[ "$(vname)" == "1.2.1" ]];
              [[ "$(vcode)" == "1000021" ]];
              [[ "$(uid)" == "$before_uid" ]];
              [[ "$(field dataDir)" == "$before_dir" ]];
              [[ "$(field firstInstallTime)" == "$before_first" ]];
              [[ "$(adb shell cat "$ext/update-sentinel.txt" | tr -d "\r")" == "$marker" ]];
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > "monkey-$label.txt";
              grep -Fq "Events injected: 1" "monkey-$label.txt";
              printf "%s UPDATE_PASS base=%s target=1.2.1 uid=%s dataDir=%s firstInstallTime=%s sentinel=PASS launch=PASS\n" "$label" "$expected_base" "$before_uid" "$before_dir" "$before_first" | tee -a update-evidence.txt;
            };
            scenario apks/chatgpt-selfrun-drive-v1.1.0.apk 1.1.0 state-from-1.1.0 v1.1.0-to-v1.2.1;
            scenario apks/dev6/chatgpt-selfrun-drive-v1.2.1-dev6.apk 1.2.1-dev6 state-from-dev6 dev6-to-v1.2.1;
            grep -Fq "v1.1.0-to-v1.2.1 UPDATE_PASS" update-evidence.txt;
            grep -Fq "dev6-to-v1.2.1 UPDATE_PASS" update-evidence.txt;
            cat update-evidence.txt'
      - name: Upload update verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-v1.2.1-update-verification
          path: |
            update-evidence.txt
            monkey-*.txt
          if-no-files-found: error
          retention-days: 30
