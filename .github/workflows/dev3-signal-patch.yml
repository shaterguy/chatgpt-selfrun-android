name: SelfRun Drive dev3 signal patch
on:
  push:
    branches: [selfrun-drive/v1.0.0-dev3]
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply fixed patch blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          url='https://api.github.com/repos/shaterguy/chatgpt-selfrun-android/git/blobs/ad281c75401236b80e81c828fdc24091d5339744'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r:data=json.load(r)
          text=base64.b64decode(data['content']).decode().replace("R=Path(__file__).resolve().parents[1]","R=Path.cwd()",1)
          open('/tmp/dev3_signal_patch.py','w').write(text)
          PY
          python3 /tmp/dev3_signal_patch.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: true
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Static policy
        run: chmod +x tools/verify_drive_variant.sh && tools/verify_drive_variant.sh
      - name: Compile main
        run: |
          set +e
          gradle --no-daemon --console=plain :app:compileDebugJavaWithJavac > /tmp/compile.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|cannot find symbol|symbol:|location:' /tmp/compile.log | tail -n 100 | while IFS= read -r line; do echo "::error title=javac::$line"; done
            tail -n 120 /tmp/compile.log
          fi
          exit "$status"
      - name: Unit tests
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/dev3-signal-patch.yml
          git add -A
          git commit -m 'feat: simplify Drive SelfRun signal loop'
          git push origin HEAD:selfrun-drive/v1.0.0-dev3
