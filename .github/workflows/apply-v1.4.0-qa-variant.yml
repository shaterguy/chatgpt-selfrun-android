name: Apply SelfRun Drive QA build type rename

on:
  push:
    branches:
      - 'selfrun-drive/v1.4.0-dev1'
    paths:
      - '.github/workflows/apply-v1.4.0-qa-variant.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.4.0-dev1
      - name: Rename internal TEST build type without changing TEST identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('app/build.gradle'): [
                  ('        testApp {', '        qaApp {'),
                  ("android.buildTypes.getByName('testApp')", "android.buildTypes.getByName('qaApp')"),
              ],
              Path('.github/workflows/build-drive-test.yml'): [
                  (':app:assembleTestApp', ':app:assembleQaApp'),
                  ('app/build/outputs/apk/testApp', 'app/build/outputs/apk/qaApp'),
              ],
              Path('app/src/test/java/com/shaterguy/chatgptselfrun/TestAppVariantPolicyTest.java'): [
                  ('gradle.contains("testApp {")', 'gradle.contains("qaApp {")'),
              ],
              Path('tools/verify_drive_variant.sh'): [
                  ('grep -Fq "testApp {" "$BUILD"', 'grep -Fq "qaApp {" "$BUILD"'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count == 1:
                      text = text.replace(old, new)
                  elif count == 0 and text.count(new) == 1:
                      pass
                  else:
                      raise SystemExit(f'unexpected token count in {path}: {old!r} old={count} new={text.count(new)}')
              path.write_text(text, encoding='utf-8')
          PY
          git rm -f .github/workflows/apply-v1.4.0-qa-variant.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle .github/workflows/build-drive-test.yml \
                  app/src/test/java/com/shaterguy/chatgptselfrun/TestAppVariantPolicyTest.java \
                  tools/verify_drive_variant.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(drive): use valid QA build type for TEST app'
          git push origin HEAD:selfrun-drive/v1.4.0-dev1
