name: Verify SelfRun Drive TEST co-install

on:
  push:
    branches:
      - 'selfrun-drive/v*-dev*'
      - 'selfrun-drive/v*-rc*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-drive-test-coinstall:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact formal 1.3.0 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a1d41d849c4c59fcd1fd319293246161e720c2dc
          path: formal-baseline
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Install Android build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build formal 1.3.0 and current TEST APKs for emulator
        shell: bash
        run: |
          set -euo pipefail
          echo '[coinstall] verify Drive variant policy'
          tools/verify_drive_variant.sh
          echo '[coinstall] run unit tests and build current TEST qaApp'
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleQaApp
          echo '[coinstall] build exact formal 1.3.0 baseline'
          gradle --no-daemon --console=plain --stacktrace --project-dir formal-baseline :app:assembleDebug
      - name: Build lower-version TEST predecessor for update verification
        shell: bash
        run: |
          set -euo pipefail
          PREV_SRC="$RUNNER_TEMP/selfrun-drive-test-prev-src"
          rm -rf "$PREV_SRC"
          git worktree add --detach "$PREV_SRC" "$GITHUB_SHA"
          sed -i "s/def selfRunDriveVersionCode = 1000052/def selfRunDriveVersionCode = 1000051/" "$PREV_SRC/app/build.gradle"
          sed -i "s/def selfRunDriveVersionName = '1.4.0-dev2'/def selfRunDriveVersionName = '1.4.0-dev1'/" "$PREV_SRC/app/build.gradle"
          grep -Fq 'def selfRunDriveVersionCode = 1000051' "$PREV_SRC/app/build.gradle"
          grep -Fq "def selfRunDriveVersionName = '1.4.0-dev1'" "$PREV_SRC/app/build.gradle"
          gradle --no-daemon --console=plain --stacktrace --project-dir "$PREV_SRC" :app:assembleQaApp
          PREV_UNSIGNED="$(find "$PREV_SRC/app/build/outputs/apk/qaApp" -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -n "$PREV_UNSIGNED"
          test -s "$PREV_UNSIGNED"
          mkdir -p app/build/outputs/apk/qaApp
          cp "$PREV_UNSIGNED" app/build/outputs/apk/qaApp/app-qaApp-prev-unsigned.apk
          git worktree remove --force "$PREV_SRC"
      - name: Install hash-locked TEST signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == 'Linux' ]]
          [[ "$(uname -m)" == 'x86_64' ]]
          PYTHON_VERSION="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          [[ "$PYTHON_VERSION" == '3.12' ]]
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
      - name: Prepare and validate co-install and update APK identities
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          PRE=drive-test-coinstall-preflight.txt
          : > "$PRE"
          note() {
            printf '%s\n' "$1" | tee -a "$PRE"
          }

          note 'preflight: start'
          test -n "$SIGNING_PASSPHRASE" || fail 'TEST signing passphrase secret is unavailable'
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$BT/aapt" || fail 'aapt is unavailable'
          test -x "$BT/zipalign" || fail 'zipalign is unavailable'
          test -x "$BT/apksigner" || fail 'apksigner is unavailable'

          TEST_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          TEST_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          TEST_PREV_VERSION_NAME='1.4.0-dev1'
          TEST_PREV_VERSION_CODE='1000051'
          FORMAL_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" formal-baseline/app/build.gradle | head -1)"
          FORMAL_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' formal-baseline/app/build.gradle | head -1)"
          [[ "$FORMAL_VERSION_NAME" == '1.3.0' ]] || fail "formal versionName mismatch: $FORMAL_VERSION_NAME"
          [[ "$FORMAL_VERSION_CODE" == '1000050' ]] || fail "formal versionCode mismatch: $FORMAL_VERSION_CODE"
          [[ "$TEST_VERSION_NAME" == '1.4.0-dev2' ]] || fail "TEST versionName mismatch: $TEST_VERSION_NAME"
          [[ "$TEST_VERSION_CODE" == '1000052' ]] || fail "TEST versionCode mismatch: $TEST_VERSION_CODE"
          (( TEST_VERSION_CODE > TEST_PREV_VERSION_CODE )) || fail 'TEST current versionCode is not greater than predecessor'
          note "formal identity: versionName=$FORMAL_VERSION_NAME versionCode=$FORMAL_VERSION_CODE"
          note "TEST predecessor identity: versionName=$TEST_PREV_VERSION_NAME versionCode=$TEST_PREV_VERSION_CODE"
          note "TEST current identity: versionName=$TEST_VERSION_NAME versionCode=$TEST_VERSION_CODE"

          TEST_UNSIGNED="$(find app/build/outputs/apk/qaApp -maxdepth 1 -type f -name 'app-qaApp-unsigned.apk' -print -quit)"
          TEST_PREV_UNSIGNED="app/build/outputs/apk/qaApp/app-qaApp-prev-unsigned.apk"
          test -n "$TEST_UNSIGNED" || fail 'current TEST unsigned APK was not produced'
          test -s "$TEST_UNSIGNED" || fail "current TEST unsigned APK is empty: $TEST_UNSIGNED"
          test -s "$TEST_PREV_UNSIGNED" || fail "TEST predecessor unsigned APK is missing or empty: $TEST_PREV_UNSIGNED"
          FORMAL_APK="formal-baseline/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$FORMAL_APK" || fail "formal baseline APK is missing or empty: $FORMAL_APK"
          note "TEST predecessor unsigned APK: $TEST_PREV_UNSIGNED"
          note "TEST current unsigned APK: $TEST_UNSIGNED"
          note "formal APK: $FORMAL_APK"

          TEST_PREV_ALIGNED="app/build/outputs/apk/qaApp/app-qaApp-prev-coinstall-aligned.apk"
          TEST_PREV_SIGNED="app/build/outputs/apk/qaApp/app-qaApp-prev-coinstall-signed.apk"
          TEST_ALIGNED="app/build/outputs/apk/qaApp/app-qaApp-coinstall-aligned.apk"
          TEST_SIGNED="app/build/outputs/apk/qaApp/app-qaApp-coinstall-signed.apk"
          "$BT/zipalign" -p -f 4 "$TEST_PREV_UNSIGNED" "$TEST_PREV_ALIGNED" || fail 'TEST predecessor APK zipalign failed'
          "$BT/zipalign" -c -v 4 "$TEST_PREV_ALIGNED" >/dev/null || fail 'TEST predecessor aligned APK validation failed'
          "$BT/zipalign" -p -f 4 "$TEST_UNSIGNED" "$TEST_ALIGNED" || fail 'current TEST APK zipalign failed'
          "$BT/zipalign" -c -v 4 "$TEST_ALIGNED" >/dev/null || fail 'current TEST aligned APK validation failed'
          note 'TEST predecessor/current APK zipalign: PASS'

          PASS_FILE="$RUNNER_TEMP/selfrun-test-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh "$TEST_PREV_ALIGNED" "$PASS_FILE" "$TEST_PREV_SIGNED" >/dev/null \
            || fail 'stable TEST predecessor signing failed'
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh "$TEST_ALIGNED" "$PASS_FILE" "$TEST_SIGNED" >/dev/null \
            || fail 'stable current TEST signing failed'
          test -s "$TEST_PREV_SIGNED" || fail 'stable TEST predecessor signed APK is missing or empty'
          test -s "$TEST_SIGNED" || fail 'stable current TEST signed APK is missing or empty'
          "$BT/apksigner" verify --verbose --print-certs "$TEST_PREV_SIGNED" > app/build/outputs/apk/qaApp/coinstall-test-prev-cert.txt \
            || fail 'stable TEST predecessor APK signature verification failed'
          "$BT/apksigner" verify --verbose --print-certs "$TEST_SIGNED" > app/build/outputs/apk/qaApp/coinstall-test-cert.txt \
            || fail 'stable current TEST APK signature verification failed'
          TEST_PREV_CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' app/build/outputs/apk/qaApp/coinstall-test-prev-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          TEST_CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' app/build/outputs/apk/qaApp/coinstall-test-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          TEST_CERT_SHA1="$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {print $2; exit}' app/build/outputs/apk/qaApp/coinstall-test-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$TEST_PREV_CERT_SHA256" == '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' ]] \
            || fail "TEST predecessor certificate SHA-256 mismatch: $TEST_PREV_CERT_SHA256"
          [[ "$TEST_CERT_SHA256" == '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' ]] \
            || fail "current TEST certificate SHA-256 mismatch: $TEST_CERT_SHA256"
          [[ "$TEST_PREV_CERT_SHA256" == "$TEST_CERT_SHA256" ]] \
            || fail 'TEST predecessor/current signing certificates differ'
          [[ "$TEST_CERT_SHA1" == '91f7420d62af199020848cf87e0758ce60c3b009' ]] \
            || fail "current TEST certificate SHA-1 mismatch: $TEST_CERT_SHA1"
          note "TEST predecessor/current certificate SHA-256: $TEST_CERT_SHA256"
          note "TEST current certificate SHA-1: $TEST_CERT_SHA1"

          FORMAL_BADGING="$($BT/aapt dump badging "$FORMAL_APK")" || fail 'formal APK badging read failed'
          TEST_PREV_BADGING="$($BT/aapt dump badging "$TEST_PREV_SIGNED")" || fail 'TEST predecessor APK badging read failed'
          TEST_BADGING="$($BT/aapt dump badging "$TEST_SIGNED")" || fail 'current TEST APK badging read failed'
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$FORMAL_BADGING" \
            || fail 'formal package identity mismatch'
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$TEST_PREV_BADGING" \
            || fail 'TEST predecessor package identity mismatch'
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$TEST_BADGING" \
            || fail 'current TEST package identity mismatch'
          grep -Fq "versionCode='$FORMAL_VERSION_CODE'" <<<"$FORMAL_BADGING" \
            || fail 'formal versionCode badging mismatch'
          grep -Fq "versionCode='$TEST_PREV_VERSION_CODE'" <<<"$TEST_PREV_BADGING" \
            || fail 'TEST predecessor versionCode badging mismatch'
          grep -Fq "versionCode='$TEST_VERSION_CODE'" <<<"$TEST_BADGING" \
            || fail 'current TEST versionCode badging mismatch'
          grep -Fq "versionName='$FORMAL_VERSION_NAME'" <<<"$FORMAL_BADGING" \
            || fail 'formal versionName badging mismatch'
          grep -Fq "versionName='$TEST_PREV_VERSION_NAME'" <<<"$TEST_PREV_BADGING" \
            || fail 'TEST predecessor versionName badging mismatch'
          grep -Fq "versionName='$TEST_VERSION_NAME'" <<<"$TEST_BADGING" \
            || fail 'current TEST versionName badging mismatch'
          note 'formal package identity: com.shaterguy.chatgptselfrun.drive'
          note 'TEST predecessor/current package identity: com.shaterguy.chatgptselfrun.drive.test'
          note 'preflight: PASS'
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Verify formal co-install and TEST in-place update
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: >-
            bash -o pipefail -c
            'TEST_VERSION=$(sed -n "s/.*selfRunDriveVersionName = '\''\([^'\'']*\)'\''.*/\1/p" app/build.gradle | head -1);
            FORMAL_EXPECTED_VERSION="1.3.0" TEST_PREV_EXPECTED_VERSION="1.4.0-dev1" TEST_EXPECTED_VERSION="$TEST_VERSION"
            timeout --foreground 6m bash tools/verify_drive_test_coinstall_emulator.sh
            formal-baseline/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/qaApp/app-qaApp-prev-coinstall-signed.apk
            app/build/outputs/apk/qaApp/app-qaApp-coinstall-signed.apk |
            tee drive-test-coinstall-evidence.txt'
      - name: Upload TEST co-install evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-test-coinstall-evidence
          path: |
            drive-test-coinstall-preflight.txt
            drive-test-coinstall-evidence.txt
            app/build/outputs/apk/qaApp/coinstall-test-prev-cert.txt
            app/build/outputs/apk/qaApp/coinstall-test-cert.txt
          if-no-files-found: warn
          retention-days: 30