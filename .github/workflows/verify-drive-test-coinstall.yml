name: Verify SelfRun Drive TEST co-install

on:
  push:
    branches:
      - 'selfrun-drive/v*-dev*'
      - 'selfrun-drive/v*-rc*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-drive-test-coinstall:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact formal 1.3.0 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a1d41d849c4c59fcd1fd319293246161e720c2dc
          path: formal-baseline
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Install Android build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build formal 1.3.0 and TEST APKs for emulator
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleQaApp
          gradle --no-daemon --console=plain --stacktrace --project-dir formal-baseline :app:assembleDebug
          BT="$ANDROID_HOME/build-tools/36.0.0"
          TEST_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          TEST_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          FORMAL_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" formal-baseline/app/build.gradle | head -1)"
          FORMAL_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' formal-baseline/app/build.gradle | head -1)"
          [[ "$FORMAL_VERSION_NAME" == '1.3.0' ]]
          [[ "$FORMAL_VERSION_CODE" == '1000050' ]]
          TEST_UNSIGNED="$(find app/build/outputs/apk/qaApp -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -n "$TEST_UNSIGNED"
          test -s "$TEST_UNSIGNED"
          TEST_ALIGNED="app/build/outputs/apk/qaApp/app-qaApp-emulator-aligned.apk"
          TEST_SIGNED="app/build/outputs/apk/qaApp/app-qaApp-emulator-signed.apk"
          "$BT/zipalign" -p -f 4 "$TEST_UNSIGNED" "$TEST_ALIGNED"
          test -s "$HOME/.android/debug.keystore"
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$TEST_SIGNED" \
            "$TEST_ALIGNED"
          "$BT/apksigner" verify --verbose "$TEST_SIGNED"
          FORMAL_APK="formal-baseline/app/build/outputs/apk/debug/app-debug.apk"
          FORMAL_BADGING="$($BT/aapt dump badging "$FORMAL_APK")"
          TEST_BADGING="$($BT/aapt dump badging "$TEST_SIGNED")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$FORMAL_BADGING"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$TEST_BADGING"
          grep -Fq "versionCode='$FORMAL_VERSION_CODE'" <<<"$FORMAL_BADGING"
          grep -Fq "versionCode='$TEST_VERSION_CODE'" <<<"$TEST_BADGING"
          grep -Fq "versionName='$FORMAL_VERSION_NAME'" <<<"$FORMAL_BADGING"
          grep -Fq "versionName='$TEST_VERSION_NAME'" <<<"$TEST_BADGING"
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Verify formal 1.3.0 and TEST simultaneous installation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: >-
            bash -o pipefail -c
            'TEST_VERSION=$(sed -n "s/.*selfRunDriveVersionName = '\''\([^'\'']*\)'\''.*/\1/p" app/build.gradle | head -1);
            FORMAL_EXPECTED_VERSION="1.3.0" TEST_EXPECTED_VERSION="$TEST_VERSION"
            timeout --foreground 6m bash tools/verify_drive_test_coinstall_emulator.sh
            formal-baseline/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/qaApp/app-qaApp-emulator-signed.apk |
            tee drive-test-coinstall-evidence.txt'
      - name: Upload TEST co-install evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-test-coinstall-evidence
          path: drive-test-coinstall-evidence.txt
          if-no-files-found: warn
          retention-days: 30
