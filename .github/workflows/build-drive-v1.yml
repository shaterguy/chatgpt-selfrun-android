name: Build SelfRun Drive

on:
  push:
    branches:
      - 'selfrun-drive/v*-rc*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: selfrun-drive-formal-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-drive-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Policy, unit tests, and canonical release build
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleRelease
          BT="$ANDROID_HOME/build-tools/36.0.0"
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          BADGING="$($BT/aapt dump badging "$UNSIGNED")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          mkdir -p app/build/outputs/selfrun-drive
          ALIGNED="app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v${VERSION_NAME}-aligned-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" >/dev/null
          sha256sum "$ALIGNED" > app/build/outputs/selfrun-drive/UNSIGNED_SHA256SUMS.txt
      - name: Upload aligned unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-unsigned
          path: |
            app/build/outputs/selfrun-drive/*-aligned-unsigned.apk
            app/build/outputs/selfrun-drive/UNSIGNED_SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Install hash-locked signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == 'Linux' ]]
          [[ "$(uname -m)" == 'x86_64' ]]
          PYTHON_VERSION="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          [[ "$PYTHON_VERSION" == '3.12' ]]
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
          python3 - <<'PY'
          import cffi
          import cryptography
          import pycparser
          assert cryptography.__version__ == '45.0.6'
          assert cffi.__version__ == '1.17.1'
          assert pycparser.__version__ == '2.22'
          PY
      - name: Sign and verify canonical formal candidate
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/selfrun-drive-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          DIR=app/build/outputs/selfrun-drive
          ALIGNED="$DIR/chatgpt-selfrun-drive-v${VERSION_NAME}-aligned-unsigned.apk"
          APK="$DIR/chatgpt-selfrun-drive-v${VERSION_NAME}.apk"
          APKSIGNER="$BT/apksigner" bash tools/sign_release.sh "$ALIGNED" "$PASS_FILE" "$APK" > "$DIR/APKSIGNER_VERIFY.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$DIR/APK_CERT.txt"
          grep -Fqi 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' "$DIR/APK_CERT.txt"
          BADGING="$($BT/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          sha256sum "$APK" > "$DIR/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$DIR/SOURCE_COMMIT.txt"
      - name: Upload canonical stable-signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-build
          path: |
            app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v*.apk
            !app/build/outputs/selfrun-drive/*unsigned*
            app/build/outputs/selfrun-drive/SHA256SUMS.txt
            app/build/outputs/selfrun-drive/APKSIGNER_VERIFY.txt
            app/build/outputs/selfrun-drive/APK_CERT.txt
            app/build/outputs/selfrun-drive/SOURCE_COMMIT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify-formal-update-emulator:
    needs: build-drive-v1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download canonical current candidate from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: chatgpt-selfrun-drive-build
          path: current-candidate
      - name: Verify canonical current artifact identity
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_APK="$(find current-candidate -type f -name 'chatgpt-selfrun-drive-v*.apk' ! -name '*unsigned*' -print -quit)"
          SUM_FILE="$(find current-candidate -type f -name 'SHA256SUMS.txt' -print -quit)"
          SOURCE_FILE="$(find current-candidate -type f -name 'SOURCE_COMMIT.txt' -print -quit)"
          test -s "$CURRENT_APK"
          test -s "$SUM_FILE"
          test -s "$SOURCE_FILE"
          [[ "$(tr -d '[:space:]' < "$SOURCE_FILE")" == "$GITHUB_SHA" ]]
          EXPECTED_SHA="$(awk '{print $1; exit}' "$SUM_FILE")"
          ACTUAL_SHA="$(sha256sum "$CURRENT_APK" | awk '{print $1}')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]
          cp "$CURRENT_APK" current-candidate/current-formal.apk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download immutable formal 1.4.0 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formal-baseline
          gh release download drive-v1.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'chatgpt-selfrun-drive-v1.4.0.apk' \
            --dir formal-baseline
          test -s formal-baseline/chatgpt-selfrun-drive-v1.4.0.apk
      - name: Validate formal update pair and prepare test
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          CURRENT_APK=current-candidate/current-formal.apk
          BASE_APK=formal-baseline/chatgpt-selfrun-drive-v1.4.0.apk
          CURRENT_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          CURRENT_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          [[ "$CURRENT_VERSION_NAME" =~ ^1\.4\.1-rc[0-9]+$ ]] || { echo "unexpected RC versionName: $CURRENT_VERSION_NAME" >&2; exit 1; }
          (( CURRENT_VERSION_CODE > 1000054 ))
          "$BT/apksigner" verify --verbose --print-certs "$BASE_APK" > formal-baseline/base-cert.txt
          "$BT/apksigner" verify --verbose --print-certs "$CURRENT_APK" > current-candidate/current-cert.txt
          BASE_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' formal-baseline/base-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          CURRENT_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' current-candidate/current-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$BASE_CERT" == 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' ]]
          [[ "$CURRENT_CERT" == "$BASE_CERT" ]]
          BASE_BADGING="$($BT/aapt dump badging "$BASE_APK")"
          CURRENT_BADGING="$($BT/aapt dump badging "$CURRENT_APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BASE_BADGING"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$CURRENT_BADGING"
          grep -Fq "versionCode='1000054'" <<<"$BASE_BADGING"
          grep -Fq "versionName='1.4.0'" <<<"$BASE_BADGING"
          grep -Fq "versionCode='$CURRENT_VERSION_CODE'" <<<"$CURRENT_BADGING"
          grep -Fq "versionName='$CURRENT_VERSION_NAME'" <<<"$CURRENT_BADGING"
          cat > verify-formal-update.sh <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          PKG='com.shaterguy.chatgptselfrun.drive'
          BASE_APK='formal-baseline/chatgpt-selfrun-drive-v1.4.0.apk'
          CURRENT_APK='current-candidate/current-formal.apk'
          CURRENT_VERSION_NAME='${CURRENT_VERSION_NAME}'
          CURRENT_VERSION_CODE='${CURRENT_VERSION_CODE}'
          fail() { echo "[formal-update] FAIL: \$*" >&2; exit 1; }
          package_version() { adb shell dumpsys package "\$PKG" | tr -d '\r' | sed -n 's/^[[:space:]]*versionName=//p' | head -1; }
          package_version_code() { adb shell dumpsys package "\$PKG" | tr -d '\r' | sed -n 's/^[[:space:]]*versionCode=\([0-9][0-9]*\).*/\1/p' | head -1; }
          package_uid_line() { adb shell pm list packages -U "\$PKG" | tr -d '\r' | grep -F "package:\$PKG" | head -1 || true; }
          uid_from_line() { sed -n 's/.*uid:\([0-9][0-9]*\).*/\1/p' <<<"\$1"; }
          adb uninstall "\$PKG" >/dev/null 2>&1 || true
          adb install --no-incremental "\$BASE_APK"
          [[ "\$(package_version)" == '1.4.0' ]] || fail 'unexpected baseline version'
          [[ "\$(package_version_code)" == '1000054' ]] || fail 'unexpected baseline versionCode'
          BEFORE_UID="\$(uid_from_line "\$(package_uid_line)")"
          [[ -n "\$BEFORE_UID" ]] || fail 'baseline UID unavailable'
          adb install -r --no-incremental "\$CURRENT_APK" || fail 'adb install -r failed'
          [[ "\$(package_version)" == "\$CURRENT_VERSION_NAME" ]] || fail 'unexpected updated version'
          [[ "\$(package_version_code)" == "\$CURRENT_VERSION_CODE" ]] || fail 'unexpected updated versionCode'
          AFTER_UID="\$(uid_from_line "\$(package_uid_line)")"
          [[ -n "\$AFTER_UID" ]] || fail 'updated UID unavailable'
          [[ "\$BEFORE_UID" == "\$AFTER_UID" ]] || fail 'UID changed across update'
          echo '[formal-update] PASS'
          SH
          chmod +x verify-formal-update.sh
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Verify formal in-place update using canonical candidate
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: >-
            bash -o pipefail -c
            'set -e;
            bash verify-formal-update.sh 2>&1 | tee formal-update-evidence.txt;
            grep -Fxq "[formal-update] PASS" formal-update-evidence.txt'
      - name: Upload formal update evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-formal-update-evidence
          path: |
            formal-baseline/base-cert.txt
            current-candidate/current-cert.txt
            formal-update-evidence.txt
            verify-formal-update.sh
          if-no-files-found: warn
          retention-days: 30
