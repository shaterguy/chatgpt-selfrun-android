name: Build SelfRun Drive v1

on:
  push:
    branches:
      - v1.0.0-dev1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-drive-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: SelfRun Drive policy checks
        run: tools/verify_drive_variant.sh
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build debug and unsigned release
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease
      - name: Verify merged manifests and component isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          android = '{http://schemas.android.com/apk/res/android}'
          manifests = glob.glob('app/build/intermediates/merged_manifest/**/AndroidManifest.xml', recursive=True)
          if not manifests:
              raise SystemExit('merged manifests missing')
          for path in manifests:
              root = ET.parse(path).getroot()
              package = root.attrib.get('package', '')
              if package != 'com.shaterguy.chatgptselfrun.drive':
                  raise SystemExit(f'wrong merged package in {path}: {package}')
              if android + 'sharedUserId' in root.attrib:
                  raise SystemExit(f'sharedUserId forbidden in {path}')
              app = root.find('application')
              if app is None:
                  raise SystemExit(f'application missing in {path}')
              for provider in app.findall('provider'):
                  authority = provider.attrib.get(android + 'authorities', '')
                  if not authority.startswith(package + '.'):
                      raise SystemExit(f'non-isolated provider authority: {authority}')
                  if provider.attrib.get(android + 'exported') != 'false':
                      raise SystemExit(f'provider must not be exported: {authority}')
              for component in ('service', 'receiver'):
                  for node in app.findall(component):
                      if node.attrib.get(android + 'exported') == 'true':
                          name = node.attrib.get(android + 'name', '')
                          permission = node.attrib.get(android + 'permission', '')
                          allowed_gms = (component == 'service'
                              and name == 'com.google.android.gms.auth.api.signin.RevocationBoundService'
                              and permission == 'com.google.android.gms.auth.api.signin.permission.REVOCATION_NOTIFICATION')
                          if not allowed_gms:
                              raise SystemExit(f'unprotected or unapproved exported {component}: {node.attrib}')
              for permission in root.findall('permission'):
                  name = permission.attrib.get(android + 'name', '')
                  allowed_gms = (name == 'com.google.android.gms.auth.api.signin.permission.REVOCATION_NOTIFICATION'
                      and permission.attrib.get(android + 'protectionLevel', '') == 'signature')
                  if not name.startswith(package + '.') and not allowed_gms:
                      raise SystemExit('fixed custom permission is forbidden')
          PY
      - name: Verify package, version, label and installation identity
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          RELEASE=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DEBUG"
          test -s "$RELEASE"
          for APK in "$DEBUG" "$RELEASE"; do
            BADGING="$($BT/aapt dump badging "$APK")"
            grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
            ! grep -Fq "package: name='com.shaterguy.chatgptselfrun' " <<<"$BADGING"
            grep -Fq "versionCode='1000001'" <<<"$BADGING"
            grep -Fq "versionName='1.0.0-dev1'" <<<"$BADGING"
            grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          done
          mkdir -p app/build/outputs/selfrun-drive
          cp "$DEBUG" app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v1.0.0-dev1-debug.apk
          "$BT/zipalign" -p -f 4 "$RELEASE" app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v1.0.0-dev1-aligned-unsigned.apk
          "$BT/zipalign" -c -v 4 app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v1.0.0-dev1-aligned-unsigned.apk
          printf '%s\n' "com.shaterguy.chatgptselfrun" "com.shaterguy.chatgptselfrun.drive" > app/build/outputs/selfrun-drive/COINSTALL_PACKAGES.txt
          sha256sum app/build/outputs/selfrun-drive/*.apk > app/build/outputs/selfrun-drive/SHA256SUMS.txt
      - name: Create private signing pass-file
        id: signing
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_PASSPHRASE" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$RUNNER_TEMP/selfrun-drive-signing-pass"
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Install signing dependency
        if: ${{ steps.signing.outputs.available == 'true' }}
        run: python3 -m pip install --disable-pip-version-check 'cryptography==45.0.6'
      - name: Sign and verify release APK
        if: ${{ steps.signing.outputs.available == 'true' }}
        shell: bash
        env:
          APKSIGNER: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/apksigner
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/selfrun-drive-signing-pass"' EXIT
          tools/sign_release.sh \
            app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v1.0.0-dev1-aligned-unsigned.apk \
            "$RUNNER_TEMP/selfrun-drive-signing-pass" \
            app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v1.0.0-dev1.apk \
            > app/build/outputs/selfrun-drive/APKSIGNER_VERIFY.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v1.0.0-dev1.apk \
            > app/build/outputs/selfrun-drive/RELEASE_BADGING.txt
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" \
            app/build/outputs/selfrun-drive/RELEASE_BADGING.txt
          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v1.0.0-dev1.apk \
            > app/build/outputs/selfrun-drive/APK_CERT.txt
          sha256sum app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v1.0.0-dev1.apk \
            >> app/build/outputs/selfrun-drive/SHA256SUMS.txt
      - name: Remove signing pass-file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/selfrun-drive-signing-pass"
      - name: Upload SelfRun Drive build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-v1.0.0-dev1
          path: app/build/outputs/selfrun-drive/
          if-no-files-found: error
          retention-days: 30

  verify-coinstall-emulator:
    needs: build-drive-v1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact legacy baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 526a9f604fc6e2b3d785293d7ce056bfc5efa5af
          path: legacy-baseline
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Install Android build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'
      - name: Build current and exact legacy debug APKs
        run: |
          gradle --no-daemon --console=plain :app:assembleDebug
          gradle --no-daemon --console=plain --project-dir legacy-baseline :app:assembleDebug
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging legacy-baseline/app/build/outputs/apk/debug/app-debug.apk \
            | tee legacy-badging.txt
          "$BT/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | tee drive-badging.txt
          grep -Fq "package: name='com.shaterguy.chatgptselfrun'" legacy-badging.txt
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" drive-badging.txt
          grep -Fq "application-label:'ChatGPT SelfRun'" legacy-badging.txt
          grep -Fq "application-label:'SelfRun Drive'" drive-badging.txt
      - name: Verify simultaneous installation, runtime and data isolation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: |
            set -o pipefail
            timeout --foreground 8m tools/verify_coinstall_emulator.sh \
              legacy-baseline/app/build/outputs/apk/debug/app-debug.apk \
              app/build/outputs/apk/debug/app-debug.apk \
              | tee coinstall-evidence.txt
      - name: Upload co-install evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-v1.0.0-dev1-coinstall-evidence
          path: |
            coinstall-evidence.txt
            legacy-badging.txt
            drive-badging.txt
          if-no-files-found: warn
          retention-days: 30
