name: Build SelfRun Drive

on:
  push:
    branches:
      - 'selfrun-drive/v*-rc*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-drive-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Policy and unit tests
        run: |
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build debug and unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug :app:assembleRelease
          BT="$ANDROID_HOME/build-tools/36.0.0"
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -s "$APK"
            BADGING="$($BT/aapt dump badging "$APK")"
            grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
            grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
            grep -Fq "versionName='$VERSION_NAME'" <<<"$BADGING"
            grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          done
          mkdir -p app/build/outputs/selfrun-drive
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v${VERSION_NAME}-aligned-unsigned.apk"
          "$BT/zipalign" -c -v 4 "app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v${VERSION_NAME}-aligned-unsigned.apk"
          sha256sum "app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v${VERSION_NAME}-aligned-unsigned.apk" > app/build/outputs/selfrun-drive/UNSIGNED_SHA256SUMS.txt
      - name: Upload aligned unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-unsigned
          path: |
            app/build/outputs/selfrun-drive/*-aligned-unsigned.apk
            app/build/outputs/selfrun-drive/UNSIGNED_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Check optional stable signing secret
        id: signing_secret
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_PASSPHRASE" ]]; then
            echo 'has_secret=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_secret=false' >> "$GITHUB_OUTPUT"
            echo 'SELFRUN_SIGNING_PASSPHRASE is not configured; keeping the validated unsigned artifact for external stable signing.'
          fi
      - name: Install hash-locked signing dependencies
        if: ${{ steps.signing_secret.outputs.has_secret == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == 'Linux' ]]
          [[ "$(uname -m)" == 'x86_64' ]]
          PYTHON_VERSION="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          [[ "$PYTHON_VERSION" == '3.12' ]]
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
          python3 - <<'PY'
          import cffi
          import cryptography
          import pycparser
          assert cryptography.__version__ == '45.0.6'
          assert cffi.__version__ == '1.17.1'
          assert pycparser.__version__ == '2.22'
          PY
      - name: Sign and verify update-installable candidate APK
        if: ${{ steps.signing_secret.outputs.has_secret == 'true' }}
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          PASS_FILE="$RUNNER_TEMP/selfrun-drive-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          test -n "$SIGNING_PASSPHRASE"
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          DIR=app/build/outputs/selfrun-drive
          ALIGNED="$DIR/chatgpt-selfrun-drive-v${VERSION_NAME}-aligned-unsigned.apk"
          APK="$DIR/chatgpt-selfrun-drive-v${VERSION_NAME}.apk"
          APKSIGNER="$BT/apksigner" bash tools/sign_release.sh "$ALIGNED" "$PASS_FILE" "$APK" > "$DIR/APKSIGNER_VERIFY.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$DIR/APK_CERT.txt"
          grep -Fqi 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' "$DIR/APK_CERT.txt"
          BADGING="$($BT/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          sha256sum "$APK" > "$DIR/SHA256SUMS.txt"
      - name: Upload stable-signed candidate
        if: ${{ steps.signing_secret.outputs.has_secret == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-build
          path: |
            app/build/outputs/selfrun-drive/chatgpt-selfrun-drive-v*.apk
            app/build/outputs/selfrun-drive/SHA256SUMS.txt
            app/build/outputs/selfrun-drive/APKSIGNER_VERIFY.txt
            app/build/outputs/selfrun-drive/APK_CERT.txt
          if-no-files-found: error
          retention-days: 30

  verify-formal-update-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact formal 1.3.0 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a1d41d849c4c59fcd1fd319293246161e720c2dc
          path: formal-baseline
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Install Android build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build release APKs for formal update verification
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleRelease
          gradle --no-daemon --console=plain --stacktrace --project-dir formal-baseline :app:assembleRelease
      - name: Install hash-locked signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == 'Linux' ]]
          [[ "$(uname -m)" == 'x86_64' ]]
          PYTHON_VERSION="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          [[ "$PYTHON_VERSION" == '3.12' ]]
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
      - name: Prepare stable-signed formal update pair
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          CURRENT_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          CURRENT_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          BASE_VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" formal-baseline/app/build.gradle | head -1)"
          BASE_VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' formal-baseline/app/build.gradle | head -1)"
          [[ "$CURRENT_VERSION_NAME" == '1.4.0' ]]
          [[ "$CURRENT_VERSION_CODE" == '1000054' ]]
          [[ "$BASE_VERSION_NAME" == '1.3.0' ]]
          [[ "$BASE_VERSION_CODE" == '1000050' ]]
          (( CURRENT_VERSION_CODE > BASE_VERSION_CODE ))

          mkdir -p formal-update
          BASE_UNSIGNED=formal-baseline/app/build/outputs/apk/release/app-release-unsigned.apk
          CURRENT_UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          BASE_ALIGNED=formal-update/selfrun-drive-v1.3.0-aligned-unsigned.apk
          CURRENT_ALIGNED=formal-update/selfrun-drive-v1.4.0-aligned-unsigned.apk
          BASE_APK=formal-update/selfrun-drive-v1.3.0.apk
          CURRENT_APK=formal-update/selfrun-drive-v1.4.0.apk
          test -s "$BASE_UNSIGNED"
          test -s "$CURRENT_UNSIGNED"
          "$BT/zipalign" -p -f 4 "$BASE_UNSIGNED" "$BASE_ALIGNED"
          "$BT/zipalign" -p -f 4 "$CURRENT_UNSIGNED" "$CURRENT_ALIGNED"
          "$BT/zipalign" -c -v 4 "$BASE_ALIGNED" >/dev/null
          "$BT/zipalign" -c -v 4 "$CURRENT_ALIGNED" >/dev/null

          PASS_FILE="$RUNNER_TEMP/selfrun-drive-formal-update-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          APKSIGNER="$BT/apksigner" bash tools/sign_release.sh "$BASE_ALIGNED" "$PASS_FILE" "$BASE_APK" >/dev/null
          APKSIGNER="$BT/apksigner" bash tools/sign_release.sh "$CURRENT_ALIGNED" "$PASS_FILE" "$CURRENT_APK" >/dev/null
          "$BT/apksigner" verify --verbose --print-certs "$BASE_APK" > formal-update/base-cert.txt
          "$BT/apksigner" verify --verbose --print-certs "$CURRENT_APK" > formal-update/current-cert.txt
          BASE_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' formal-update/base-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          CURRENT_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' formal-update/current-cert.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$BASE_CERT" == 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' ]]
          [[ "$CURRENT_CERT" == "$BASE_CERT" ]]

          BASE_BADGING="$($BT/aapt dump badging "$BASE_APK")"
          CURRENT_BADGING="$($BT/aapt dump badging "$CURRENT_APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BASE_BADGING"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$CURRENT_BADGING"
          grep -Fq "versionCode='1000050'" <<<"$BASE_BADGING"
          grep -Fq "versionName='1.3.0'" <<<"$BASE_BADGING"
          grep -Fq "versionCode='1000054'" <<<"$CURRENT_BADGING"
          grep -Fq "versionName='1.4.0'" <<<"$CURRENT_BADGING"

          cat > formal-update/verify-formal-update.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG='com.shaterguy.chatgptselfrun.drive'
          BASE_APK='formal-update/selfrun-drive-v1.3.0.apk'
          CURRENT_APK='formal-update/selfrun-drive-v1.4.0.apk'

          fail() {
            echo "[formal-update] FAIL: $*" >&2
            exit 1
          }

          package_version() {
            adb shell dumpsys package "$PKG" | tr -d '\r' | sed -n 's/^[[:space:]]*versionName=//p' | head -1
          }

          package_version_code() {
            adb shell dumpsys package "$PKG" | tr -d '\r' | sed -n 's/^[[:space:]]*versionCode=\([0-9][0-9]*\).*/\1/p' | head -1
          }

          package_uid_line() {
            adb shell pm list packages -U "$PKG" | tr -d '\r' | grep -F "package:$PKG" | head -1 || true
          }

          uid_from_line() {
            sed -n 's/.*uid:\([0-9][0-9]*\).*/\1/p' <<<"$1"
          }

          adb uninstall "$PKG" >/dev/null 2>&1 || true
          echo '[formal-update] install 1.3.0 baseline'
          adb install --no-incremental "$BASE_APK"
          BASE_VERSION="$(package_version)"
          BASE_CODE="$(package_version_code)"
          [[ "$BASE_VERSION" == '1.3.0' ]] || fail "unexpected baseline versionName: $BASE_VERSION"
          [[ "$BASE_CODE" == '1000050' ]] || fail "unexpected baseline versionCode: $BASE_CODE"
          BEFORE_UID_RAW="$(package_uid_line)"
          BEFORE_UID="$(uid_from_line "$BEFORE_UID_RAW")"
          [[ -n "$BEFORE_UID" ]] || fail "baseline UID unavailable: $BEFORE_UID_RAW"
          echo "[formal-update] baseline version=$BASE_VERSION versionCode=$BASE_CODE uid=$BEFORE_UID"

          echo '[formal-update] update in place to 1.4.0'
          adb install -r --no-incremental "$CURRENT_APK" || fail 'adb install -r failed'
          CURRENT_VERSION="$(package_version)"
          CURRENT_CODE="$(package_version_code)"
          [[ "$CURRENT_VERSION" == '1.4.0' ]] || fail "unexpected updated versionName: $CURRENT_VERSION"
          [[ "$CURRENT_CODE" == '1000054' ]] || fail "unexpected updated versionCode: $CURRENT_CODE"
          AFTER_UID_RAW="$(package_uid_line)"
          AFTER_UID="$(uid_from_line "$AFTER_UID_RAW")"
          [[ -n "$AFTER_UID" ]] || fail "updated UID unavailable: $AFTER_UID_RAW"
          [[ "$BEFORE_UID" == "$AFTER_UID" ]] || fail "UID changed across update: before=$BEFORE_UID after=$AFTER_UID"
          adb shell pm path "$PKG" >/dev/null || fail 'updated package path unavailable'
          echo "[formal-update] updated version=$CURRENT_VERSION versionCode=$CURRENT_CODE uid=$AFTER_UID"
          echo '[formal-update] PASS'
          SH
          chmod +x formal-update/verify-formal-update.sh
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Verify formal 1.3.0 to 1.4.0 in-place update
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: >-
            bash -o pipefail -c
            'set -e;
            bash formal-update/verify-formal-update.sh 2>&1 |
            tee formal-update/formal-update-evidence.txt;
            grep -Fxq "[formal-update] PASS" formal-update/formal-update-evidence.txt'
      - name: Upload formal update evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-formal-update-evidence
          path: |
            formal-update/base-cert.txt
            formal-update/current-cert.txt
            formal-update/formal-update-evidence.txt
            formal-update/verify-formal-update.sh
          if-no-files-found: warn
          retention-days: 30

  verify-coinstall-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact legacy baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 526a9f604fc6e2b3d785293d7ce056bfc5efa5af
          path: legacy-baseline
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Install Android build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build current and exact legacy debug APKs
        run: |
          gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
          gradle --no-daemon --console=plain --project-dir legacy-baseline :app:assembleDebug
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Verify full co-install isolation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: >-
            bash -o pipefail -c
            'gradle --no-daemon --console=plain :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.shaterguy.chatgptselfrun.WorkPreferenceDomWebViewTest;
            adb shell dumpsys webviewupdate | tee webview-evidence.txt;
            VERSION=$(sed -n "s/.*selfRunDriveVersionName = '\''\([^'\'']*\)'\''.*/\1/p" app/build.gradle | head -1);
            sed -i "s/^DRIVE_EXPECTED_VERSION=.*/DRIVE_EXPECTED_VERSION=\"$VERSION\"/" tools/verify_coinstall_emulator.sh;
            timeout --foreground 8m tools/verify_coinstall_emulator.sh
            legacy-baseline/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk |
            tee coinstall-evidence.txt'
      - name: Upload co-install evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-drive-coinstall-evidence
          path: |
            coinstall-evidence.txt
            webview-evidence.txt
          if-no-files-found: warn
          retention-days: 30
