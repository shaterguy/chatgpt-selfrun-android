name: Run SelfRun Drive dev4 continuation patch

on:
  push:
    branches:
      - selfrun-drive/v1.4.1-dev4

permissions:
  contents: write

jobs:
  run-dev4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Execute scoped patch embedded in dev4 apply workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RUNNER'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/dev4-apply.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('embedded patch start not found')
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          body = textwrap.dedent(body)
          compile(body, 'dev4-embedded-patch.py', 'exec')
          exec(body, {'__name__': '__main__'})
          RUNNER
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Verify scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
          git diff --check
      - name: Commit verified implementation and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'selfrun-dev4-builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/dev4-apply.yml .github/workflows/dev4-run.yml
          git add app/build.gradle app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java app/src/test/java/com/shaterguy/chatgptselfrun/DriveVariantPolicyTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunContinuationRetryRegressionTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunContinuationSubmissionTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunDriveCommandAckPollingTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunDriveDev3PolicyTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunDriveAssistantIsolationTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunFocusRetentionTest.java
          git diff --cached --check
          git commit -m 'feat(drive): verify continuation submission before retry'
          git push origin HEAD:selfrun-drive/v1.4.1-dev4
