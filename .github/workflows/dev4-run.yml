name: Run SelfRun Drive dev4 continuation patch

on:
  push:
    branches:
      - selfrun-drive/v1.4.1-dev4

permissions:
  contents: write

jobs:
  run-dev4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Execute scoped patch embedded in dev4 apply workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RUNNER'
          from pathlib import Path
          workflow = Path('.github/workflows/dev4-apply.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('embedded patch start not found')
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          compile(body, 'dev4-embedded-patch.py', 'exec')
          exec(body, {'__name__': '__main__'})

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          verifier = Path('tools/verify_drive_variant.sh')
          text = verifier.read_text(encoding='utf-8')
          old = "grep -Fq 'CONTINUATION_GUARD_MS = 60_000L' \"$SERVICE\"\ngrep -Fq 'SUBMISSION_RETRY_MS = 5 * 60_000L' \"$SERVICE\""
          new = "! grep -Fq 'CONTINUATION_GUARD_MS' \"$SERVICE\"\n! grep -Fq 'SUBMISSION_RETRY_MS' \"$SERVICE\"\ngrep -Fq 'CONTINUE_DOM_POLL_MS = 250L' \"$SERVICE\"\ngrep -Fq 'CONTINUE_RETRY_MS = 2_500L' \"$SERVICE\"\ngrep -Fq 'PHASE_VERIFY_CONTINUE_SUBMISSION' \"$SERVICE\"\ngrep -Fq 'SUBMISSION_CONFIRMED' \"$SERVICE\""
          if text.count(old) != 1:
              raise SystemExit('legacy continuation timing verifier block not found exactly once')
          verifier.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in [
              'app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java',
              'app/src/test/java/com/shaterguy/chatgptselfrun/TestAppVariantPolicyTest.java',
              'app/src/test/java/com/shaterguy/chatgptselfrun/WebUiCalibrationBackupPolicyTest.java',
          ]:
              replace_once(path, 'selfRunDriveVersionCode = 1000054', 'selfRunDriveVersionCode = 1000058', path + ' versionCode')
              replace_once(path, "selfRunDriveVersionName = '1.4.0'", "selfRunDriveVersionName = '1.4.1-dev4'", path + ' versionName')

          submission_test = Path('app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunContinuationSubmissionTest.java')
          text = submission_test.read_text(encoding='utf-8')
          old_assert = 'assertTrue(verify.contains("data-message-author-role=\\\\\\\"user\\\\\\\""));'
          if old_assert not in text:
              # Keep the assertion robust to Java/JS escape representation while still verifying the selector path.
              start = 'assertTrue(verify.contains("data-message-author-role'
              line = next((ln for ln in text.splitlines() if start in ln), None)
              if line is None:
                  raise SystemExit('continuation submission selector assertion not found')
              text = text.replace(line, '        assertTrue(verify.contains("data-message-author-role"));', 1)
          else:
              text = text.replace(old_assert, 'assertTrue(verify.contains("data-message-author-role"));', 1)
          submission_test.write_text(text, encoding='utf-8')
          RUNNER
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Verify scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
          git diff --check
      - name: Commit verified implementation and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'selfrun-dev4-builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/dev4-apply.yml .github/workflows/dev4-run.yml
          git add app/build.gradle app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java tools/verify_drive_variant.sh app/src/test/java/com/shaterguy/chatgptselfrun/DriveVariantPolicyTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunContinuationRetryRegressionTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunContinuationSubmissionTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunDriveCommandAckPollingTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunDriveDev3PolicyTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunDriveAssistantIsolationTest.java app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunFocusRetentionTest.java app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java app/src/test/java/com/shaterguy/chatgptselfrun/TestAppVariantPolicyTest.java app/src/test/java/com/shaterguy/chatgptselfrun/WebUiCalibrationBackupPolicyTest.java
          git diff --cached --check
          git commit -m 'feat(drive): verify continuation submission before retry'
          git push origin HEAD:selfrun-drive/v1.4.1-dev4
