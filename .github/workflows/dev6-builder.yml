name: Apply SelfRun Drive dev6 minimal patch

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.2-dev6'

permissions:
  contents: write

jobs:
  apply-dev6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Extract and execute staged patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/dev6-builder.yml > /tmp/dev6-builder-source.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/dev6-builder-source.yml').read_text(encoding='utf-8').splitlines()
          start = source.index("          python3 - <<'PY'") + 1
          end = max(i for i, line in enumerate(source) if line == '          PY')
          body = []
          for line in source[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(body) + '\n'
          exec(compile(code, '/tmp/dev6_apply.py', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          git diff --stat
          git status --short
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(drive): add minimal next-input continuation to 1.2.1 baseline'
          git push origin HEAD:selfrun-drive/v1.2.2-dev6
