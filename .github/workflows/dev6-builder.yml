name: Apply SelfRun Drive dev6 minimal patch

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.2-dev6'

permissions:
  contents: write

jobs:
  apply-dev6:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
