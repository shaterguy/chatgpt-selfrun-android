          JAVA
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              source = path.read_text(encoding='utf-8')
              if source.count(old) != 1:
                  raise SystemExit(f'exact replacement mismatch: {path} count={source.count(old)}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          service = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          status_anchor = '''static boolean isWatchdogRecoverySubmissionPhase(String phase){return PHASE_WATCHDOG_SEND_CONTINUE.equals(phase)||PHASE_WATCHDOG_CLICK_CONTINUE.equals(phase);}\n'''
          status_replacement = status_anchor + '''static boolean isChatReasoningFailureStatus(String status){return switch(status){case "CHAT_REASONING_TRIGGER_NOT_FOUND","CHAT_REASONING_SLIDER_NOT_FOUND","CHAT_REASONING_OPTION_UNAVAILABLE","CHAT_REASONING_READBACK_MISMATCH","CHAT_REASONING_MENU_CLOSE_FAILED"->true;default->false;};}\nstatic String chatReasoningFailureMessage(String status){return switch(status){case "CHAT_REASONING_TRIGGER_NOT_FOUND"->"Chat 추론 선택기를 찾지 못했습니다. ChatGPT 화면 구조를 확인하세요.";case "CHAT_REASONING_SLIDER_NOT_FOUND"->"Chat 추론 메뉴에서 슬라이더를 찾지 못했습니다. ChatGPT 화면 구조를 확인하세요.";case "CHAT_REASONING_OPTION_UNAVAILABLE"->"선택한 Chat 추론 단계가 현재 계정 또는 워크스페이스에서 제공되지 않습니다.";case "CHAT_REASONING_READBACK_MISMATCH"->"Chat 추론 적용 결과가 요청한 의미값과 일치하지 않습니다.";case "CHAT_REASONING_MENU_CLOSE_FAILED"->"Chat 추론 적용 후 모델 메뉴를 닫지 못했습니다.";default->"Chat 추론 설정을 적용하지 못했습니다.";};}\n'''
