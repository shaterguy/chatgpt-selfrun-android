                          const __srcFail=(status,detail,extra={})=>{__srcState.at=Date.now();__srcSave();return result(status,detail,__srcDiagnostics(extra));};
                          if(!__srcSlider){
                            __srcState.findAttempts++;__srcState.at=Date.now();__srcSave();
                            if(__srcState.applied){
