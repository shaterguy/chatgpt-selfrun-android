name: SelfRun Drive 1.2.3 Builder

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.3-dev1'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.2.3-dev1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply Drive-only progress patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunRunLog.java"); s=p.read_text(encoding="utf-8"); old="            item.put(\"role\", safeToken(store.role()));\n"; assert s.count(old)==1; p.write_text(s.replace(old,"",1),encoding="utf-8")'
          cat tools/selfrun_123_patch.part00.b64 tools/selfrun_123_patch.part01.b64 tools/selfrun_123_patch.part02.b64 tools/selfrun_123_patch.part03.b64 tools/selfrun_123_patch.part04.b64 > /tmp/selfrun_123_patch.b64
          base64 -d /tmp/selfrun_123_patch.b64 > /tmp/selfrun_123_patch.py
          python3 -m py_compile /tmp/selfrun_123_patch.py
          if ! python3 /tmp/selfrun_123_patch.py; then
            echo '--- residual ROLE references after patch ---'
            grep -R -n -E 'setRole\(|store\.role\(\)' app/src/main/java || true
            exit 1
          fi
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run builder verification
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Commit implementation and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/selfrun-drive-123-builder.yml tools/selfrun_123_patch.b64 tools/selfrun_123_patch.part00.b64 tools/selfrun_123_patch.part01.b64 tools/selfrun_123_patch.part02.b64 tools/selfrun_123_patch.part03.b64 tools/selfrun_123_patch.part04.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: make SelfRun Drive progress Drive-only'
          git push origin HEAD:selfrun-drive/v1.2.3-dev1
