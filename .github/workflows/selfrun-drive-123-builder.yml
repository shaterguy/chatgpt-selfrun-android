name: SelfRun Drive 1.2.3 Builder

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.3-dev1'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.2.3-dev1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply Drive-only progress patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def must_replace(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)
          def must_sub(text, pattern, repl, label, flags=0):
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, got {count}')
              return out

          # Version identity: 1.2.2 is frozen; this branch targets 1.2.3-dev1.
          p = 'app/build.gradle'
          s = read(p)
          s = must_replace(s, "def selfRunDriveVersionCode = 1000026", "def selfRunDriveVersionCode = 1000027", 'versionCode')
          s = must_replace(s, "def selfRunDriveVersionName = '1.2.2'", "def selfRunDriveVersionName = '1.2.3-dev1'", 'versionName')
          old = """        if (service.contains('com.shaterguy.chatgptselfrun.RUN')
                || service.contains('WAIT_ASSISTANT') || service.contains('SelfRunDom.observeAssistant')) {
            throw new GradleException('legacy assistant runtime must not be reachable in Drive V1')
        }
"""
          new = """        def store = file('src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java').getText('UTF-8')
        def dom = file('src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java').getText('UTF-8')
        def protocol = file('src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java').getText('UTF-8')
        if (service.contains('com.shaterguy.chatgptselfrun.RUN')
                || service.contains('WAIT_ASSISTANT')
                || service.contains('PHASE_READ_NEXT_CONTROL')
                || service.contains('readLatestSelfRunControl')
                || service.contains('applyNextControl')
                || store.contains('PHASE_READ_NEXT_CONTROL')
                || store.contains('setRole(')
                || dom.contains('readLatestSelfRunControl')
                || dom.contains('SELF_RUN_NEXT')
                || dom.contains('observeAssistant')
                || protocol.contains('parseLatest(')
                || protocol.contains('SELF_RUN_NEXT')) {
            throw new GradleException('Drive V1 progress must not depend on assistant conversation control or ROLE')
        }
"""
          s = must_replace(s, old, new, 'variant policy guard')
          write(p, s)

          # Service: Drive TURN_COMPLETED is the sole progress gate; no assistant-control hop.
          p = 'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java'
          s = read(p)
          s = must_replace(s,
              '/** Drive V1-only runtime. The legacy assistant-DOM state machine is intentionally not reachable. */',
              '/** Drive V1-only runtime. Progress is derived from the Drive turn document; WebView only submits commands and applies WORK preferences. */',
              'service class comment')
          s = must_replace(s,
              'if(SelfRunStore.PHASE_READ_NEXT_CONTROL.equals(store.phase())){ensureWebView();return;}',
              'if(!SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(store.phase())){resumeStateMachine();return;}',
              'guard recovery')
          s = must_replace(s,
              'private void guardElapsed(){if(canRun()&&SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(store.phase())){transition(SelfRunStore.PHASE_READ_NEXT_CONTROL,"Drive TURN_COMPLETED 확인 · conversation 제어신호 1회 확인","guard_elapsed");ensureWebView();}}',
              'private void guardElapsed(){if(canRun()&&SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(store.phase())){String next=SelfRunStore.MODE_WORK.equals(store.mode())?SelfRunStore.PHASE_APPLY_PREFS:SelfRunStore.PHASE_SEND_CONTINUE;transition(next,"Drive TURN_COMPLETED 확인 · Drive 상태 기준 continuation 준비","guard_elapsed");ensureWebView();}}',
              'guard elapsed')
          s = s.replace('SelfRunStore.PHASE_READ_NEXT_CONTROL.equals(phase)||', '')
          s = must_replace(s,
              'case SelfRunStore.PHASE_READ_NEXT_CONTROL->script=SelfRunDom.readLatestSelfRunControl(store.conversationUrl(),store.runId());',
              '', 'read control switch')
          s = must_replace(s,
              'if(SelfRunStore.PHASE_READ_NEXT_CONTROL.equals(phase)&&("CONTROL_FOUND".equals(status)||"CONTROL_MISSING".equals(status)||"SCRIPT_ERROR".equals(status))){applyNextControl("CONTROL_FOUND".equals(status)?result.optString("signal",""):"");return;}',
              '', 'read control result')
          s = must_sub(s,
              r'private void applyNextControl\(String raw\)\{.*?\}\n\n    private static boolean isSubmissionPhase',
              '    private static boolean isSubmissionPhase', 'applyNextControl removal', re.S)
          if 'PHASE_READ_NEXT_CONTROL' in s or 'readLatestSelfRunControl' in s or 'applyNextControl' in s:
              raise SystemExit('SelfRunService still contains conversation progress control')
          write(p, s)

          # Store: remove ROLE state and make manual resume mode-aware after Drive re-read.
          p = 'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java'
          s = read(p)
          s = must_replace(s, '    static final String PHASE_READ_NEXT_CONTROL = "READ_NEXT_CONTROL";\n', '', 'phase constant')
          s = must_replace(s,
              '.putString("phase",PHASE_DRIVE_ACCOUNT_CHECK).putString("status","Drive 계정 확인 준비").putString("role","PLANNER")',
              '.putString("phase",PHASE_DRIVE_ACCOUNT_CHECK).putString("status","Drive 계정 확인 준비")',
              'initial role')
          s = must_replace(s, '.remove("driveProtocolVersion")', '.remove("role").remove("driveProtocolVersion")', 'legacy role cleanup')
          s = must_replace(s, '    String role() { return get("role"); }\n', '', 'role getter')
          s = must_replace(s, '    void setRole(String value) { put("role", value); }\n', '', 'role setter')
          new_resume = '''void baselineManualResume(int cursor,DriveSignalParser.Event latest,DriveSignalParser.Event latestUnseenCompletion){
    boolean workCompletion=MODE_WORK.equals(mode())&&latestUnseenCompletion!=null&&latestUnseenCompletion.protocolError.isEmpty();
    String nextPhase=workCompletion?PHASE_APPLY_PREFS:PHASE_SEND_CONTINUE;
    String nextStatus=workCompletion?"사용자 재개 override · Drive WORK profile 적용 준비":"사용자 재개 override · CONTINUE 강제 제출 준비";
    SharedPreferences.Editor e=clearCommandWait(prefs.edit()).putInt("driveSignalCursor",Math.max(0,cursor)).putBoolean("paused",false).putBoolean("active",true).putBoolean("userStopped",false).putString("phase",nextPhase).putString("status",nextStatus).putLong("phaseStartedAt",System.currentTimeMillis());
    if(latestUnseenCompletion!=null&&latestUnseenCompletion.protocolError.isEmpty()){
        e.putString("pendingDriveSignalRaw",latestUnseenCompletion.raw).putString("pendingDriveSignalTimestamp",latestUnseenCompletion.timestamp).putString("pendingDriveSignalType",DriveSignalParser.Type.TURN_COMPLETED.name());
    }else{
        e.putString("pendingDriveSignalRaw","").putString("pendingDriveSignalTimestamp","").putString("pendingDriveSignalType","");
    }
    putLatest(e,latest);commitOrThrow(e);syncHistory();
}
'''
          s = must_sub(s, r'void baselineManualResume\(.*?\nvoid captureConversationUrl', new_resume + 'void captureConversationUrl', 'manual resume', re.S)
          if 'PHASE_READ_NEXT_CONTROL' in s or 'String role()' in s or 'setRole(' in s:
              raise SystemExit('SelfRunStore still contains app ROLE/control state')
          write(p, s)

          # History/detail no longer read or display ROLE.
          p = 'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunHistoryStore.java'
          s = read(p)
          s = must_replace(s, '            item.put("role", store.role());\n', '', 'history role')
          write(p, s)

          p = 'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDetailActivity.java'
          s = read(p)
          s = must_replace(s, '                        + "\\n역할: " + empty(item.optString("role"))\n', '', 'detail role')
          write(p, s)

          # DOM adapter: retain only bootstrap/CONTINUE composer operations and WORK preference support elsewhere.
          p = 'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java'
          s = read(p)
          s = must_replace(s,
              '/** Runtime DOM adapter. Startup behavior is aligned with the scheduler\'s proven project bootstrap flow. */',
              '/** Drive V1 DOM adapter: bootstrap/CONTINUE composer control only. Assistant messages are never progress inputs. */',
              'dom class comment')
          s = must_sub(s,
              r'\n    static String sendInitial\(.*?\n    /\*\* Stages Drive V1 bootstrap without clicking\. \*/',
              '\n    /** Stages Drive V1 bootstrap without clicking. */', 'legacy initial removal', re.S)
          s = must_sub(s,
              r'\n    /\*\* Crash recovery checks an increase in the unchanged continuation user line\. \*/.*?\n    private static String projectGuard',
              '\n    private static String projectGuard', 'assistant/control DOM removal', re.S)
          s = must_sub(s,
              r'\n    /\*\* Stable identity excludes assistant text so late DOM decoration cannot masquerade as a new turn\. \*/\n    private static String assistantSnapshot\(\) \{.*?\n    \}\n',
              '\n', 'assistantSnapshot removal', re.S)
          s = must_sub(s,
              r'\n    private static String durableMarkerWrite\(String marker\) \{.*?\n    \}\n',
              '\n', 'legacy durableMarkerWrite removal', re.S)
          s = must_sub(s,
              r'\n    private static String durableMarkerWriteWithBaseline\(String marker, String baselineExpression\) \{.*?\n    \}\n',
              '\n', 'legacy baseline marker removal', re.S)
          for token in ['readLatestSelfRunControl', 'SELF_RUN_NEXT', 'observeAssistant', 'sendTurn(', 'sendInitial(', 'assistantSnapshot', 'data-message-author-role=\\"assistant\\"']:
