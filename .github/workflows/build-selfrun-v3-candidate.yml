name: Build SelfRun 3 Candidate
run-name: SelfRun 3 Candidate (${{ github.ref_name }}) #${{ github.run_number }} attempt-${{ github.run_attempt }}

on:
  push:
    branches:
      - 'selfrun-v3/v3.*-dev*'
      - 'selfrun-v3/v3.*-rc*'
      - 'v3.*-dev*'
      - 'v3.*-rc*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: selfrun-v3-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ARTIFACT: selfrun-v3-candidate-${{ github.run_attempt }}

jobs:
  static-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Resolve candidate identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          test -n "$VERSION_NAME"; test -n "$VERSION_CODE"
          [[ "$VERSION_NAME" =~ ^3\.[0-9]+\.[0-9]+-(dev|rc)[0-9]+$ ]]
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_ENV"
      - name: STATIC_PREFLIGHT - V3 policy and all test-source compile
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          bash tools/verify_selfrun3_dev4_limits_settings.sh
          gradle --build-cache --no-daemon --console=plain --stacktrace \
            :app:verifyDriveVariantIdentity \
            :app:compileQaAppJavaWithJavac \
            :app:compileQaAppUnitTestJavaWithJavac \
            :app:compileQaAppAndroidTestJavaWithJavac
      - name: FAST_TEST - complete JVM regression suite
        shell: bash
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:testQaAppUnitTest
      - name: ARTIFACT_BUILD - TEST target and TEST instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:assembleQaApp :app:assembleQaAppAndroidTest
          BT="$ANDROID_HOME/build-tools/36.0.0"
          TARGET_RAW="$(find app/build/outputs/apk/qaApp -maxdepth 1 -type f -name '*.apk' -print -quit)"
          TEST_RAW="$(find app/build/outputs/apk/androidTest -type f -name '*.apk' -print -quit)"
          test -s "$TARGET_RAW"; test -s "$TEST_RAW"
          TARGET_BADGING="$($BT/aapt dump badging "$TARGET_RAW")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$TARGET_BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$TARGET_BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$TARGET_BADGING"
          TEST_BADGING="$($BT/aapt dump badging "$TEST_RAW")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test.test'" <<<"$TEST_BADGING"
          mkdir -p app/build/outputs/selfrun-v3
          "$BT/zipalign" -p -f 4 "$TARGET_RAW" app/build/outputs/selfrun-v3/target-aligned.apk
          "$BT/zipalign" -p -f 4 "$TEST_RAW" app/build/outputs/selfrun-v3/androidTest-aligned.apk
      - name: Install hash-locked signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
      - name: Sign and verify canonical TEST pair
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/selfrun-v3-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          DIR=app/build/outputs/selfrun-v3
          TARGET="$DIR/chatgpt-selfrun-drive-test-v${VERSION_NAME}.apk"
          TEST_APK="$DIR/chatgpt-selfrun-drive-test-v${VERSION_NAME}-androidTest.apk"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh "$DIR/target-aligned.apk" "$PASS_FILE" "$TARGET" > "$DIR/APKSIGNER_TARGET_VERIFY.txt"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh "$DIR/androidTest-aligned.apk" "$PASS_FILE" "$TEST_APK" > "$DIR/APKSIGNER_ANDROIDTEST_VERIFY.txt"
          "$BT/apksigner" verify --verbose --print-certs "$TARGET" > "$DIR/TARGET_CERT.txt"
          "$BT/apksigner" verify --verbose --print-certs "$TEST_APK" > "$DIR/ANDROIDTEST_CERT.txt"
          grep -Fqi '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' "$DIR/TARGET_CERT.txt"
          grep -Fqi '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' "$DIR/ANDROIDTEST_CERT.txt"
          BADGING="$($BT/aapt dump badging "$TARGET")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$BADGING"
          TEST_BADGING="$($BT/aapt dump badging "$TEST_APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test.test'" <<<"$TEST_BADGING"
          sha256sum "$TARGET" "$TEST_APK" > "$DIR/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$DIR/SOURCE_COMMIT.txt"
      - name: Upload canonical candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: |
            app/build/outputs/selfrun-v3/chatgpt-selfrun-drive-test-v*.apk
            app/build/outputs/selfrun-v3/SHA256SUMS.txt
            app/build/outputs/selfrun-v3/APKSIGNER_TARGET_VERIFY.txt
            app/build/outputs/selfrun-v3/APKSIGNER_ANDROIDTEST_VERIFY.txt
            app/build/outputs/selfrun-v3/TARGET_CERT.txt
            app/build/outputs/selfrun-v3/ANDROIDTEST_CERT.txt
            app/build/outputs/selfrun-v3/SOURCE_COMMIT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  emulator-regression:
    needs: static-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: current
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Resolve and verify candidate plus baselines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          printf 'VERSION_NAME=%s\n' "$VERSION_NAME" >> "$GITHUB_ENV"
          TARGET="$(find current -type f -name "chatgpt-selfrun-drive-test-v${VERSION_NAME}.apk" -print -quit)"
          TEST_APK="$(find current -type f -name "chatgpt-selfrun-drive-test-v${VERSION_NAME}-androidTest.apk" -print -quit)"
          test -s "$TARGET"; test -s "$TEST_APK"
          cp "$TARGET" current/candidate.apk
          cp "$TEST_APK" current/androidTest.apk
          [[ "$(tr -d '[:space:]' < current/SOURCE_COMMIT.txt)" == "$GITHUB_SHA" ]]
          grep -F "$(sha256sum current/candidate.apk | awk '{print $1}')" current/SHA256SUMS.txt >/dev/null
          grep -F "$(sha256sum current/androidTest.apk | awk '{print $1}')" current/SHA256SUMS.txt >/dev/null
          mkdir -p stable
          gh release download drive-v3.2.2 --repo "$GITHUB_REPOSITORY" \
            --pattern 'chatgpt-selfrun-drive-v3.2.2.apk' --dir stable
          test -s stable/chatgpt-selfrun-drive-v3.2.2.apk
          echo '1684c6518e4babe607ba2e4b03d4a14074e29e5d6759e6ba6827f5aa434b70c9  stable/chatgpt-selfrun-drive-v3.2.2.apk' | sha256sum -c -
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs stable/chatgpt-selfrun-drive-v3.2.2.apk > stable-cert.txt
          grep -Fqi 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' stable-cert.txt
      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: EXPENSIVE_RUNTIME - co-install, launch and V3 instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: bash tools/verify_selfrun3_candidate_emulator.sh
      - name: Upload runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-v3-runtime-evidence-${{ github.run_attempt }}
          path: |
            selfrun-v3-runtime-evidence.txt
            selfrun-v3-runtime-settings-evidence.txt
            selfrun-v3-runtime-settings-restart-seed.txt
            selfrun-v3-runtime-settings-restart-verify.txt
            selfrun-v3-unbounded-limits-evidence.txt
            selfrun-v3-work-fix-evidence.txt
            selfrun-v3-project-directory-evidence.txt
            selfrun-v3-stopped-resume-evidence.txt
            stable-cert.txt
            selfrun-v3-previous-test-cert.txt
            selfrun-v3-upgrade-seed.txt
            selfrun-v3-upgrade-verify.txt
          if-no-files-found: warn
          retention-days: 30

  publish-direct-test-apk:
    needs: [static-test-build, emulator-regression]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: current
      - name: Prepare immutable direct TEST APK
        id: prepare_publish
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          APK="current/chatgpt-selfrun-drive-test-v${VERSION_NAME}.apk"
          NAMED_FILE="SelfRun-Drive-TEST-${VERSION_NAME}.apk"
          NAMED_PATH="deliverables/${NAMED_FILE}"
          SUM_FILE='current/SHA256SUMS.txt'
          SOURCE_FILE='current/SOURCE_COMMIT.txt'
          CERT_FILE='current/TARGET_CERT.txt'
          test -s "$APK"; test -s "$SUM_FILE"; test -s "$SOURCE_FILE"; test -s "$CERT_FILE"
          [[ "$(tr -d '[:space:]' < "$SOURCE_FILE")" == "$GITHUB_SHA" ]]
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          grep -F "$APK_SHA256" "$SUM_FILE" >/dev/null
          grep -Fqi '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' "$CERT_FILE"
          ARTIFACT_BRANCH="artifacts/selfrun-v3-v${VERSION_NAME}-sha256-${APK_SHA256}"
          if git ls-remote --exit-code --heads origin "refs/heads/$ARTIFACT_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=2 origin "refs/heads/$ARTIFACT_BRANCH:refs/remotes/origin/$ARTIFACT_BRANCH"
            git show "refs/remotes/origin/$ARTIFACT_BRANCH:deliverables/direct-apk.txt" > direct-apk.txt
            PUBLISHED_SOURCE_SHA="$(sed -n 's/^SOURCE_SHA=//p' direct-apk.txt)"
            ARTIFACT_COMMIT_SHA="$(sed -n 's/^ARTIFACT_COMMIT_SHA=//p' direct-apk.txt)"
            PUBLISHED_FILE="$(sed -n 's/^APK_FILE=//p' direct-apk.txt)"
            PUBLISHED_SHA="$(sed -n 's/^APK_SHA256=//p' direct-apk.txt)"
            PUBLISHED_URL="$(sed -n 's/^APK_URL=//p' direct-apk.txt)"
            test -n "$PUBLISHED_SOURCE_SHA"; test -n "$ARTIFACT_COMMIT_SHA"
            test -n "$PUBLISHED_FILE"; test -n "$PUBLISHED_SHA"; test -n "$PUBLISHED_URL"
            [[ "$PUBLISHED_FILE" == "$NAMED_FILE" ]]
            [[ "$PUBLISHED_URL" == "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$ARTIFACT_COMMIT_SHA/$NAMED_PATH" ]]
            EXISTING_APK="$RUNNER_TEMP/$PUBLISHED_FILE"
            curl --fail --location --retry 4 --retry-delay 2 --output "$EXISTING_APK" "$PUBLISHED_URL"
            test -s "$EXISTING_APK"
            EXISTING_SHA="$(sha256sum "$EXISTING_APK" | awk '{print $1}')"
            [[ "$EXISTING_SHA" == "$PUBLISHED_SHA" ]]
            [[ "$APK_SHA256" == "$PUBLISHED_SHA" ]]
            echo "REUSE_EXISTING_IDENTICAL_APK=$PUBLISHED_FILE sha256=$PUBLISHED_SHA source=$PUBLISHED_SOURCE_SHA"
            echo "publish_mode=reuse" >> "$GITHUB_OUTPUT"
            echo "artifact_branch=$ARTIFACT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "existing_source_sha=$PUBLISHED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "existing_artifact_commit=$ARTIFACT_COMMIT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/selfrun-v3-direct-apk.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          APK_BLOB="$(git hash-object -w "$APK")"
          git update-index --add --cacheinfo 100644,"$APK_BLOB",deliverables/current-test.apk
          git update-index --add --cacheinfo 100644,"$APK_BLOB","$NAMED_PATH"
          APK_TREE="$(git write-tree)"
          APK_COMMIT="$(printf '%s\n' "publish: SelfRun 3 ${VERSION_NAME} TEST APK" | git commit-tree "$APK_TREE" -p "$GITHUB_SHA")"
          RAW_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$APK_COMMIT/$NAMED_PATH"
          {
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "ARTIFACT_COMMIT_SHA=$APK_COMMIT"
            echo "APK_FILE=$NAMED_FILE"
            echo "APK_SHA256=$APK_SHA256"
            echo "APK_URL=$RAW_URL"
          } > direct-apk.txt
          META_BLOB="$(git hash-object -w direct-apk.txt)"
          git update-index --add --cacheinfo 100644,"$META_BLOB",deliverables/direct-apk.txt
          META_TREE="$(git write-tree)"
          META_COMMIT="$(printf '%s\n' 'docs: record immutable SelfRun 3 TEST APK identity' | git commit-tree "$META_TREE" -p "$APK_COMMIT")"
          echo "publish_mode=create" >> "$GITHUB_OUTPUT"
          echo "meta_commit=$META_COMMIT" >> "$GITHUB_OUTPUT"
          echo "artifact_branch=$ARTIFACT_BRANCH" >> "$GITHUB_OUTPUT"
      - name: PUBLISH_DELIVER - publish immutable artifact ref
        if: ${{ steps.prepare_publish.outputs.publish_mode == 'create' }}
        shell: bash
        env:
          META_COMMIT: ${{ steps.prepare_publish.outputs.meta_commit }}
          ARTIFACT_BRANCH: ${{ steps.prepare_publish.outputs.artifact_branch }}
        run: |
          set -euo pipefail
          test -n "$META_COMMIT"; test -n "$ARTIFACT_BRANCH"
          git push origin "$META_COMMIT:refs/heads/$ARTIFACT_BRANCH"
      - name: Verify direct APK accessibility and identity
        shell: bash
        env:
          PUBLISH_MODE: ${{ steps.prepare_publish.outputs.publish_mode }}
        run: |
          set -euo pipefail
          PUBLISHED_SOURCE_SHA="$(sed -n 's/^SOURCE_SHA=//p' direct-apk.txt)"
          ARTIFACT_COMMIT_SHA="$(sed -n 's/^ARTIFACT_COMMIT_SHA=//p' direct-apk.txt)"
          RAW_URL="$(sed -n 's/^APK_URL=//p' direct-apk.txt)"
          EXPECTED_SHA="$(sed -n 's/^APK_SHA256=//p' direct-apk.txt)"
          EXPECTED_FILE="$(sed -n 's/^APK_FILE=//p' direct-apk.txt)"
          test -n "$PUBLISH_MODE"; test -n "$PUBLISHED_SOURCE_SHA"; test -n "$ARTIFACT_COMMIT_SHA"
          test -n "$RAW_URL"; test -n "$EXPECTED_SHA"; test -n "$EXPECTED_FILE"
          [[ "$EXPECTED_FILE" == "SelfRun-Drive-TEST-${VERSION_NAME}.apk" ]]
          [[ "$RAW_URL" == "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$ARTIFACT_COMMIT_SHA/deliverables/$EXPECTED_FILE" ]]
          CURRENT_APK="current/chatgpt-selfrun-drive-test-v${VERSION_NAME}.apk"
          test -s "$CURRENT_APK"
          [[ "$(sha256sum "$CURRENT_APK" | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          curl --fail --location --retry 4 --retry-delay 2 --output "$EXPECTED_FILE" "$RAW_URL"
          test -s "$EXPECTED_FILE"
          ACTUAL_SHA="$(sha256sum "$EXPECTED_FILE" | awk '{print $1}')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]
          {
            echo "RUN_SOURCE_SHA=$GITHUB_SHA"
            echo "PUBLISHED_SOURCE_SHA=$PUBLISHED_SOURCE_SHA"
            echo "ARTIFACT_COMMIT_SHA=$ARTIFACT_COMMIT_SHA"
            echo "PUBLISH_MODE=$PUBLISH_MODE"
            echo "APK_FILE=$EXPECTED_FILE"
            echo "APK_URL=$RAW_URL"
            echo "APK_SHA256=$ACTUAL_SHA"
            echo "APK_SIZE_BYTES=$(stat -c%s "$EXPECTED_FILE")"
            if [[ "$PUBLISH_MODE" == 'reuse' ]]; then
              echo "REUSE_EXISTING_IDENTICAL_APK=PASS"
            else
              echo "NEW_IMMUTABLE_ARTIFACT=PASS"
            fi
            echo "HTTP_DOWNLOAD=PASS"
          } > direct-apk-access.txt
          cat direct-apk-access.txt
      - name: Upload direct APK identity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-v3-direct-apk-${{ github.run_attempt }}
          path: |
            direct-apk.txt
            direct-apk-access.txt
          if-no-files-found: error
          retention-days: 30
