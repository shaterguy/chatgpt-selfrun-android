name: Apply v1.7.0 work-mode capture bypass

on:
  push:
    branches:
      - selfrun-drive/v1.7.0-dev1

permissions:
  contents: write

concurrency:
  group: apply-v170-work-capture-bypass
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.head_commit.message != 'fix(drive): bypass chat picker capture in work mode'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Add work-mode bypass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/shaterguy/chatgptselfrun/ChatReasoningOptionDom.java')
          s=p.read_text(encoding='utf-8')
          old='''                const __sroWanted=__WANTED__,__sroWantedOrdinal=__ORDINAL__,__sroRunId=__RUN_ID__,__sroCaptureOnly=__CAPTURE_ONLY__;\n                const __sroLevel=source=>{'''
          new='''                const __sroWanted=__WANTED__,__sroWantedOrdinal=__ORDINAL__,__sroRunId=__RUN_ID__,__sroCaptureOnly=__CAPTURE_ONLY__;\n                if(__sroCaptureOnly&&typeof requestedMode!==\'undefined\'&&requestedMode===\'work\')return result(\'READY\',\'WORK 모드에서는 Chat picker 현재값 캡처를 생략합니다.\',{strategy:\'advanced-menu\',action:\'skip-chat-picker-work\'});\n                const __sroLevel=source=>{'''
          if s.count(old)!=1: raise SystemExit(f'expected one insertion anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/ChatReasoningOptionDom.java
          git commit -m 'fix(drive): bypass chat picker capture in work mode'
          git push origin HEAD:selfrun-drive/v1.7.0-dev1
