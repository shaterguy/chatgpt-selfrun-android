name: Apply v0.2.3-dev5 lifecycle patch

on:
  push:
    branches:
      - v0.2.3-dev5
    paths:
      - .github/workflows/dev5-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.2.3-dev5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply minimal pause-safe observer lifecycle patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # Version and branch metadata.
          replace_once('app/build.gradle', "versionCode 16", "versionCode 17")
          replace_once('app/build.gradle', "versionName '0.2.3-dev4'", "versionName '0.2.3-dev5'")
          replace_once('app/src/main/java/com/shaterguy/chatgptselfrun/MainActivity.java',
                       'v0.2.3-dev4 · 첫 화면은 작업 대시보드입니다.',
                       'v0.2.3-dev5 · 첫 화면은 작업 대시보드입니다.')
          replace_once('app/src/main/java/com/shaterguy/chatgptselfrun/WebViewConfig.java',
                       'ChatGPTSelfRun/0.2.3-dev4', 'ChatGPTSelfRun/0.2.3-dev5')

          build = read('.github/workflows/build.yml')
          branch_line = '      - v0.2.3-dev4\n'
          if build.count(branch_line) != 1:
              raise SystemExit('build.yml: dev4 branch line mismatch')
          build = build.replace(branch_line, branch_line + '      - v0.2.3-dev5\n', 1)
          build = build.replace("grep -q 'versionCode 16' \"$BUILD\"", "grep -q 'versionCode 17' \"$BUILD\"")
          build = build.replace("grep -q \"versionName '0.2.3-dev4'\" \"$BUILD\"", "grep -q \"versionName '0.2.3-dev5'\" \"$BUILD\"")
          build = build.replace("grep -q 'v0.2.3-dev4' \"$MAIN\"", "grep -q 'v0.2.3-dev5' \"$MAIN\"")
          build = build.replace("grep -q 'ChatGPTSelfRun/0.2.3-dev4' \"$WEB\"", "grep -q 'ChatGPTSelfRun/0.2.3-dev5' \"$WEB\"")
          build = build.replace("versionCode='16'", "versionCode='17'")
          build = build.replace("versionName='0.2.3-dev4'", "versionName='0.2.3-dev5'")
          build = build.replace('chatgpt-selfrun-android-v0.2.3-dev4-', 'chatgpt-selfrun-android-v0.2.3-dev5-')
          anchor = "          grep -q 'detachDomObserver(cause)' \"$SERVICE\"\n"
          if anchor not in build:
              raise SystemExit('build.yml: observer lifecycle policy anchor missing')
          build = build.replace(anchor, anchor
              + "          grep -q 'executionEpoch' \"$SERVICE\"\n"
              + "          grep -q 'resumeObserverGate' \"$SERVICE\"\n"
              + "          grep -q 'SelfRunDomObserver.detach(detachedLease)' \"$SERVICE\"\n"
              + "          grep -q 'if (!current()) return;' \"$OBSERVER\"\n"
              + "          grep -q \"if (state.lease !== expectedLease) return 'STALE'\" \"$OBSERVER\"\n")
          write('.github/workflows/build.yml', build)

