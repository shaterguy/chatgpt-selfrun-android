name: Apply v0.2.3-dev5 lifecycle patch

on:
  push:
    branches:
      - v0.2.3-dev5
    paths:
      - .github/workflows/dev5-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.2.3-dev5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Normalize duplicated automation UA version
        run: sed -i '0,/ChatGPTSelfRun\/0.2.3-dev4/s//ChatGPTSelfRun\/0.2.3-dev5/' app/src/main/java/com/shaterguy/chatgptselfrun/WebViewConfig.java
      - name: Apply patch
        run: python3 tools/dev5_apply.py
      - name: Fix generated lifecycle test escaping
        run: python3 tools/dev5_fix_generated.py
      - name: Source policy checks
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          OBSERVER=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDomObserver.java
          BUILD=app/build.gradle
          grep -q 'versionCode 17' "$BUILD"
          grep -q "versionName '0.2.3-dev5'" "$BUILD"
          grep -q 'executionEpoch' "$SERVICE"
          grep -q 'resumeObserverGate' "$SERVICE"
          grep -q 'SelfRunDomObserver.detach(detachedLease)' "$SERVICE"
          grep -q 'SelfRunDomObserver.install(token, lease, activeRunId, activeGeneration, activeEpoch)' "$SERVICE"
          grep -q 'activeExecutionEpoch != executionEpoch' "$SERVICE"
          grep -q 'DOM_WATCHDOG_MS = 15_000L' "$SERVICE"
          grep -q 'if (!current()) return;' "$OBSERVER"
          grep -q "if (state.lease !== expectedLease) return 'STALE'" "$OBSERVER"
          grep -q 'takeRecords' "$OBSERVER"
          ! grep -q 'pauseTimers' "$SERVICE"
          ! grep -q 'webView.onPause()' "$SERVICE"
          ! grep -q 'webView.onResume()' "$SERVICE"
          ! grep -q 'setInterval' "$OBSERVER"
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Align and inspect builder APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=app/build/outputs/apk/release/chatgpt-selfrun-android-v0.2.3-dev5-builder-aligned-unsigned.apk
          "$BT/zipalign" -p -f 4 "$SRC" "$OUT"
          "$BT/zipalign" -c -v 4 "$OUT"
          "$BT/aapt" dump badging "$OUT" | tee app/build/outputs/apk/release/BUILDER_BADGING.txt
          grep -q "package: name='com.shaterguy.chatgptselfrun'" app/build/outputs/apk/release/BUILDER_BADGING.txt
          grep -q "versionCode='17'" app/build/outputs/apk/release/BUILDER_BADGING.txt
          grep -q "versionName='0.2.3-dev5'" app/build/outputs/apk/release/BUILDER_BADGING.txt
          unzip -t "$OUT" >/dev/null
          sha256sum "$OUT" | tee app/build/outputs/apk/release/BUILDER_SHA256SUMS.txt
      - name: Commit verified builder changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dev5-apply.yml tools/dev5_apply.py tools/dev5_fix_generated.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement pause-safe DOM observer lifecycle for v0.2.3-dev5'
          git push origin HEAD:v0.2.3-dev5
      - name: Upload builder unsigned APK evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-android-v0.2.3-dev5-builder-unsigned
          path: |
            app/build/outputs/apk/release/chatgpt-selfrun-android-v0.2.3-dev5-builder-aligned-unsigned.apk
            app/build/outputs/apk/release/BUILDER_BADGING.txt
            app/build/outputs/apk/release/BUILDER_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
