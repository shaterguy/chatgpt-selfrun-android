name: Fix v1.7.0 legacy slider compatibility

on:
  push:
    branches:
      - 'selfrun-drive/v1.7.0-dev1'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.7.0-dev1
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply legacy-only compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); t=p.read_text(); actual=t.count(old)
              if actual != count: raise SystemExit(f'{path}: expected {count}, found {actual}')
              p.write_text(t.replace(old,new,count))

          dom='app/src/main/java/com/shaterguy/chatgptselfrun/ChatReasoningDom.java'
          replace(dom,
              '        String wanted = ChatReasoningPreferenceStore.normalize(selection);\n        int ordinal = ChatReasoningPreferenceStore.ordinal(wanted);\n',
              '        String requested = ChatReasoningPreferenceStore.normalize(selection);\n        String wanted = ChatReasoningPreferenceStore.PRO_STANDARD.equals(requested) ? "pro" : requested;\n        int ordinal = ChatReasoningPreferenceStore.PRO_STANDARD.equals(requested)\n                ? 4 : ChatReasoningPreferenceStore.ordinal(requested);\n')

          test='app/src/androidTest/java/com/shaterguy/chatgptselfrun/ChatReasoningDelayedDomWebViewTest.java'
          replace(test,
              '                    ChatReasoningPreferenceStore.EXTRA_HIGH,\n                    ChatReasoningPreferenceStore.INSTANT\n            };\n            int[] expected = {1, 2, 3, 0};\n',
              '                    ChatReasoningPreferenceStore.EXTRA_HIGH,\n                    ChatReasoningPreferenceStore.PRO_STANDARD,\n                    ChatReasoningPreferenceStore.INSTANT\n            };\n            int[] expected = {1, 2, 3, 4, 0};\n')
          replace(test,
              '                assertEquals(selections[index], ready.getJSONObject("diagnostics").getString("observed"));\n',
              '                String expectedObserved = ChatReasoningPreferenceStore.PRO_STANDARD.equals(selections[index])\n                        ? "pro" : selections[index];\n                assertEquals(expectedObserved, ready.getJSONObject("diagnostics").getString("observed"));\n',
              1)
          replace(test,
              '            assertEquals("4", read(scenario, web, "String(window.menuOpenClicks)"));\n            assertEquals("4", read(scenario, web, "String(window.menuCloseClicks)"));\n',
              '            assertEquals("5", read(scenario, web, "String(window.menuOpenClicks)"));\n            assertEquals("5", read(scenario, web, "String(window.menuCloseClicks)"));\n')
          PY
          git diff --check
      - name: Compile and test
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac
      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name 'SelfRun Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app
          test -n "$(git diff --cached --name-only)"
          git commit -m '[v170-legacy-fixed] fix(drive): retain legacy five-position slider coverage'
          git push origin HEAD:selfrun-drive/v1.7.0-dev1
