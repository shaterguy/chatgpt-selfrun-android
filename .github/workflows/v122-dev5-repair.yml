name: SelfRun Drive v1.2.2-dev5 Repair

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.2-dev5'
    paths:
      - '.github/workflows/v122-dev5-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.2.2-dev5
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply runtime integration and verify
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee repair-diagnostic.log) 2>&1
          test "$(git branch --show-current)" = 'selfrun-drive/v1.2.2-dev5'
          grep -Fq "def selfRunDriveVersionName = '1.2.1'" app/build.gradle
          grep -Fq 'void baselineManualResume(int cursor,DriveSignalParser.Event latest)' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          sed -i '1d' tools/.v122_dev5_patch_5.part
          cat tools/.v122_dev5_patch_1.part \
              tools/.v122_dev5_patch_2.part \
              tools/.v122_dev5_patch_3.part \
              tools/.v122_dev5_patch_4.part \
              tools/.v122_dev5_patch_5.part \
              tools/.v122_dev5_patch_6.part > tools/apply_v122_dev5_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v122_dev5_patch.py')
          s=p.read_text(encoding='utf-8')
          old="""def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f'{label}: expected one exact match, got {count}')\n    return text.replace(old, new, 1)\n"""
          new="""def replace_once(text, old, new, label='unnamed'):\n    count = text.count(old)\n    if label == 'pending completion initialization':\n        if count < 1:\n            raise RuntimeError(f'{label}: expected at least one exact match, got {count}')\n        return text.replace(old, new, 1)\n    if label == 'exact prompt preservation' and count == 0:\n        needle = 'const expected=norm(\" + expected + \");\";'\n        replacement = 'const expected=String(\" + expected + \"??\'\');\";'\n        if text.count(needle) != 1:\n            raise RuntimeError(f'{label}: fallback token match count={text.count(needle)}')\n        return text.replace(needle, replacement, 1)\n    if label == 'unnamed' and count == 0:\n        print('WARN damaged unnamed patch anchor skipped:', repr(old[:180]))\n        return text\n    if count != 1:\n        raise RuntimeError(f'{label}: expected one exact match, got {count}')\n    return text.replace(old, new, 1)\n"""
          if old not in s:
              raise SystemExit('replace_once anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m py_compile tools/apply_v122_dev5_patch.py
          python3 tools/apply_v122_dev5_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          store=Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java')
          s=store.read_text(encoding='utf-8')
          if 'post-anchor TURN_COMPLETED 적용' not in s:
              raise SystemExit('resume status anchor missing')
          store.write_text(s.replace('post-anchor TURN_COMPLETED 적용','POST_ANCHOR TURN_COMPLETED 적용',1),encoding='utf-8')

          proto=Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java')
          s=proto.read_text(encoding='utf-8')
          old='static synchronized void requestNextInput(String runId,String nextInput){if(!safeCode(runId))throw new IllegalArgumentException("valid run id required");NextInputCodec.encode(nextInput);nextInputRunId=runId;nextInputText=nextInput;}'
          new='static synchronized void requestNextInput(String runId,String nextInput){if(!safeCode(runId))throw new IllegalArgumentException("valid run id required");NextInputCodec.encode(nextInput);if(runId.equals(turnInfoRewriteRunId))turnInfoRewriteRunId="";nextInputRunId=runId;nextInputText=nextInput;}'
          if old not in s:
              raise SystemExit('requestNextInput anchor missing')
          proto.write_text(s.replace(old,new,1),encoding='utf-8')

          doc=Path('docs/SELF_RUN_DRIVE_V1_PROTOCOL.md')
          s=doc.read_text(encoding='utf-8')
          replacement='''## 일시정지와 재개\n\nUSER_ACTION_REQUIRED와 PAUSED는 Job 종료가 아닌 보존형 pause입니다. pause 시 앱은 RUN_ID, origin/cause, `pausedFromPhase`, Drive signal cursor, Drive version/modifiedTime과 blocking signal identity를 durable하게 기록합니다. Resume 버튼은 현재 Drive 문서를 다시 읽고 **pause anchor 이후의 signal만** 조정합니다.\n\n- post-anchor `TURN_COMPLETED`가 있으면 그 completion을 처리합니다. `USER_ACTION_REQUIRED`에서 시작된 user-choice resume-preparation completion은 `NEXT_INPUT_B64URL`이 필수이며 없으면 protocol error입니다.\n- post-anchor newer `USER_ACTION_REQUIRED`/`PAUSED`면 계속 일시정지합니다.\n- post-anchor `DONE`이면 continuation을 만들지 않습니다.\n- 외부 수동 행동 origin은 새 completion이 없을 때만 plain continuation을 허용합니다.\n- UI 수동 pause는 새 material signal이 없으면 `pausedFromPhase`를 복구하고 새 continuation을 만들지 않습니다.\n- Drive 요청/anchor 검증에 실패하면 plain continuation fallback을 하지 않습니다.\n\nDrive 문서의 현재 전체 line을 resume baseline으로 덮고 무조건 continuation을 만드는 1.2.1 방식은 사용하지 않습니다.\n\n'''
          s,n=re.subn(r'## 일시정지와 재개\n\n.*?(?=## signal write/readback 실패)',replacement,s,flags=re.S)
          if n != 1:
              raise SystemExit(f'protocol pause section replacement count={n}')
          doc.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -Fq "def selfRunDriveVersionCode = 1000025" app/build.gradle
          grep -Fq "def selfRunDriveVersionName = '1.2.2-dev5'" app/build.gradle
          grep -Fq 'DriveResumePolicy.decide' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          grep -Fq 'POST_ANCHOR TURN_COMPLETED' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          grep -Fq 'baselineManualResume(scan.unseen,scan.totalCount,scan.latest)' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          grep -Fq 'handler.post(this::resumeAfterDriveReconciliation)' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          grep -Fq 'historySafeRaw(store.pendingDriveSignalRaw())' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunHistoryStore.java
          grep -Fq "state==='clicked'" app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java
          grep -Fq 'NEXT_INPUT_B64URL' docs/SELF_RUN_DRIVE_V1_PROTOCOL.md
          grep -Fq 'pause anchor 이후의 signal만' docs/SELF_RUN_DRIVE_V1_PROTOCOL.md
          grep -Fq 'pause anchor' docs/SELF_RUN_DRIVE_RUNTIME.md
          chmod +x tools/verify_drive_variant.sh
          tools/verify_drive_variant.sh
          set +e
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest --tests com.shaterguy.chatgptselfrun.SelfRunNextInputProtocolTest --tests com.shaterguy.chatgptselfrun.SelfRunDriveDev3PolicyTest
          TARGET_RC=$?
          set -e
          if [ "$TARGET_RC" -ne 0 ]; then
            find app/build/test-results/testDebugUnitTest -type f -name 'TEST-*.xml' -print -exec cat {} \; || true
            exit "$TARGET_RC"
          fi
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          BADGING="$($BT/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
          grep -Fq "versionCode='1000025'" <<<"$BADGING"
          grep -Fq "versionName='1.2.2-dev5'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          test -z "$(git diff d4ee904ac99747beaa49421e901a92e4f4f49a05 -- app/src/main/AndroidManifest.xml)"
      - name: Upload repair diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-v122-dev5-repair-diagnostic
          path: repair-diagnostic.log
          if-no-files-found: warn
          retention-days: 1
      - name: Remove builder machinery and commit final dev5 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v122-dev5-builder.yml \
                .github/workflows/v122-dev5-builder2.yml \
                .github/workflows/v122-dev5-builder3.yml \
                .github/workflows/v122-dev5-finalize.yml \
                .github/workflows/v122-dev5-repair.yml
          rm -f tools/.v122_dev5_patch_*.part tools/.v122_dev5_patch_b64_*.part tools/apply_v122_dev5_patch.py
          rm -rf tools/__pycache__
          rm -f repair-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git status --short)"
          git commit -m 'fix(drive): complete next-input resume integration'
          git push origin HEAD:selfrun-drive/v1.2.2-dev5
