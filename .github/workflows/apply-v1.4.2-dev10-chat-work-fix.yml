name: Apply SelfRun Drive dev10 CHAT and WORK fix

on:
  push:
    branches:
      - 'selfrun-drive/v1.4.2-dev10'

permissions:
  contents: write

concurrency:
  group: selfrun-drive-dev10-remote-fix
  cancel-in-progress: false

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply bounded semantic selector patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_dev10_chat_work_fix.py
          git diff --check
          bash tools/verify_drive_variant.sh
          git status --short
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app tools/apply_dev10_chat_work_fix.py
          git commit -m 'fix(drive): use advanced chat menu and bound work preference waits'
          git push origin "HEAD:${GITHUB_REF_NAME}"
