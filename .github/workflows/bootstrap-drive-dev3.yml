name: Bootstrap SelfRun Drive dev3

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev3'

permissions:
  contents: write

jobs:
  apply-dev3-source:
    if: github.event.head_commit.message == 'chore(dev3): bootstrap worktree patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Apply conversation freshness barrier in Git worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Version identity.
          replace_once('app/build.gradle',
              "def selfRunDriveVersionCode = 1000042\ndef selfRunDriveVersionName = '1.3.0-dev2'",
              "def selfRunDriveVersionCode = 1000043\ndef selfRunDriveVersionName = '1.3.0-dev3'")

          # Durable continuation-sync state.
          replace_once('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java',
              '    static final String PHASE_RESUME_BASELINE = "RESUME_BASELINE";\n    static final String PHASE_APPLY_PREFS = "APPLY_PREFS";',
              '    static final String PHASE_RESUME_BASELINE = "RESUME_BASELINE";\n    static final String PHASE_SYNC_CONVERSATION = "SYNC_CONVERSATION";\n    static final String PHASE_APPLY_PREFS = "APPLY_PREFS";')
          replace_once('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java',
              '  .putString("creationStage",CREATION_NONE).putString("pausedFromPhase","").putBoolean("resumeNeedsContinuation",false)',
              '  .putString("creationStage",CREATION_NONE).putString("conversationSyncNextPhase","").putString("pausedFromPhase","").putBoolean("resumeNeedsContinuation",false)')
          replace_once('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java',
              '    String status() { return getOr("status", "대기"); }\n',
              '    String status() { return getOr("status", "대기"); }\n    String conversationSyncNextPhase() { return get("conversationSyncNextPhase"); }\n')
          replace_once('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java',
              '    void reserveJobFolderId(String id) {',
              '''    private static boolean validConversationSyncNextPhase(String phase) {
        return PHASE_APPLY_PREFS.equals(phase) || PHASE_APPLY_REASONING.equals(phase) || PHASE_SEND_CONTINUE.equals(phase);
    }

    void beginConversationSync(String nextPhase, String status) {
        if (!validConversationSyncNextPhase(nextPhase)) throw new IllegalArgumentException("valid post-sync phase required");
        commitOrThrow(prefs.edit().putString("conversationSyncNextPhase", nextPhase)
                .putString("phase", PHASE_SYNC_CONVERSATION).putString("status", safe(status))
                .putLong("phaseStartedAt", System.currentTimeMillis()));
        syncHistory();
    }

    String finishConversationSync() {
        String next = conversationSyncNextPhase();
        if (!validConversationSyncNextPhase(next)) throw new IllegalStateException("post-sync phase missing");
        commitOrThrow(prefs.edit().putString("conversationSyncNextPhase", "")
                .putString("phase", next).putString("status", "conversation freshness 확인 완료")
                .putLong("phaseStartedAt", System.currentTimeMillis()));
        syncHistory();
        return next;
    }

