name: Verify and release SelfRun v0.2.1

on:
  push:
    branches:
      - main
      - v0.2.1-dev1

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK and zstd
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          sudo apt-get update
          sudo apt-get install -y zstd
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build canonical unsigned APK and recover exact signed v0.2.1 APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          CANONICAL=chatgpt-selfrun-android-v0.2.1-canonical-unsigned.apk
          APK=chatgpt-selfrun-android-v0.2.1.apk
          gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
          test -s "$SRC"
          python3 tools/canonicalize_apk.py "$SRC" "$CANONICAL"
          echo '2a8fed067482738f61d364300f8e3a35b184954d1c1a4a1ccd7f698faccad07d  chatgpt-selfrun-android-v0.2.1-canonical-unsigned.apk' | sha256sum --check --strict
          printf '%s' '' | base64 --decode > signed.patch.zst
          echo '7be43ce437dc72072536c035d188fd51492cb837f165ba7d3b47e7198264fa53  signed.patch.zst' | sha256sum --check --strict
          zstd -d --patch-from="$CANONICAL" signed.patch.zst -o "$APK"
          test "$(stat -c %s "$APK")" -eq 693765
          echo 'fb6c12d5008b66964fb597cb5b54d5889355499586453ea29073368af7de2d2b  chatgpt-selfrun-android-v0.2.1.apk' | sha256sum --check --strict
          "$BT/aapt" dump badging "$APK" | tee BADGING.txt
          grep -q "package: name='com.shaterguy.chatgptselfrun'" BADGING.txt
          grep -q "versionCode='10'" BADGING.txt
          grep -q "versionName='0.2.1'" BADGING.txt
          java -jar "$BT/lib/apksigner.jar" verify --verbose --print-certs "$APK" | tee APKSIGNER.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' APKSIGNER.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' APKSIGNER.txt
          grep -q 'Signer #1 certificate SHA-256 digest: b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' APKSIGNER.txt
          unzip -t "$APK" >/dev/null
          python3 - "$APK" <<'PYALIGN'
          import struct, sys, zipfile
          apk = sys.argv[1]
          with open(apk, 'rb') as raw, zipfile.ZipFile(apk) as archive:
              for entry in archive.infolist():
                  if entry.compress_type != zipfile.ZIP_STORED or entry.is_dir():
                      continue
                  raw.seek(entry.header_offset)
                  header = raw.read(30)
                  fields = struct.unpack('<IHHHHHIIIHH', header)
                  name_len, extra_len = fields[-2], fields[-1]
                  data_offset = entry.header_offset + 30 + name_len + extra_len
                  if data_offset % 4:
                      raise SystemExit(f'unaligned stored entry: {entry.filename} offset={data_offset}')
          PYALIGN
          echo 'fb6c12d5008b66964fb597cb5b54d5889355499586453ea29073368af7de2d2b  chatgpt-selfrun-android-v0.2.1.apk' > SHA256SUMS.txt
      - name: Upload verified signed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-android-v0.2.1-release
          path: |
            chatgpt-selfrun-android-v0.2.1.apk
            SHA256SUMS.txt
            BADGING.txt
            APKSIGNER.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify-release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-v0.2.1]')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name chatgpt-selfrun-android-v0.2.1-release --dir release-assets
          echo 'fb6c12d5008b66964fb597cb5b54d5889355499586453ea29073368af7de2d2b  release-assets/chatgpt-selfrun-android-v0.2.1.apk' | sha256sum --check --strict
      - name: Publish v0.2.1 as latest GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.2.1
          APK=release-assets/chatgpt-selfrun-android-v0.2.1.apk
          SUMS=release-assets/SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'chatgpt-selfrun-android-v0.2.1.apk' --dir existing-release
            echo 'fb6c12d5008b66964fb597cb5b54d5889355499586453ea29073368af7de2d2b  existing-release/chatgpt-selfrun-android-v0.2.1.apk' | sha256sum --check --strict
            exit 0
          fi
          printf '%s\n' \
            'SelfRun v0.2.1 정식 릴리스입니다.' \
            '' \
            '- 일반 Chat bootstrap에서 Chat/Work 선택 상태 속성을 강제 readback하던 무한 대기 결함을 수정했습니다.' \
            '- 모드 전환은 실행당 한 번만 수행하고 입력창 준비가 확인되면 정상적으로 첫 요청 전송 단계로 진행합니다.' \
            '- 기존 conversation 유지, USER_ACTION_REQUIRED 재개, Work 모델/추론 및 continuation 동작은 그대로 유지합니다.' \
            '- versionName: 0.2.1 / versionCode: 10' \
            '- APK SHA-256: fb6c12d5008b66964fb597cb5b54d5889355499586453ea29073368af7de2d2b' \
            '- 인증서 SHA-256: b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' \
            > RELEASE_NOTES.md
          gh release create "$TAG" "$APK" "$SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'v0.2.1' \
            --notes-file RELEASE_NOTES.md \
            --latest
