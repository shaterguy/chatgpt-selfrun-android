name: Test Committed-Only Result Gate

on:
  push:
    branches:
      - 'selfrun-v3/v3.2.5-dev1-committed-only-result-gate'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  committed-only-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: RED - committed-only contract
        run: gradle --no-daemon --console=plain --stacktrace :app:testQaAppUnitTest --tests 'com.shaterguy.chatgptselfrun.SelfRun3CommittedOnlyResultGateTest'
