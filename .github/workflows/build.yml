name: Build SelfRun APK

on:
  push:
    branches:
      - main
      - v0.2.2-rc1
      - v0.2.3-dev1
      - v0.2.3-dev2
      - v0.2.3-dev3
      - v0.2.3-dev4
      - v0.2.3-dev5
      - v0.2.3-dev6
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Static SelfRun policy checks
        shell: bash
        run: |
          set -euo pipefail
          BUILD=app/build.gradle
          MANIFEST=app/src/main/AndroidManifest.xml
          HOST=app/src/main/java/com/shaterguy/chatgptselfrun/HeadlessWebViewHost.java
          WEB=app/src/main/java/com/shaterguy/chatgptselfrun/WebViewConfig.java
          LOGIN=app/src/main/java/com/shaterguy/chatgptselfrun/LoginActivity.java
          MAIN=app/src/main/java/com/shaterguy/chatgptselfrun/MainActivity.java
          NEW=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java
          SERVICE=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          WAKE=app/src/main/java/com/shaterguy/chatgptselfrun/WakeLockController.java
          DOM=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java
          OBSERVER=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDomObserver.java
          STORE=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          HISTORY_STORE=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunHistoryStore.java
          RUNLOG=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunRunLog.java
          SAMPLER=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunLogSampler.java
          PROTOCOL=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java
          HISTORY=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunHistoryActivity.java
          LOGMENU=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunLogMenuActivity.java
          LOGS=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunLogsActivity.java
          SIGNING_SCRIPT=tools/sign_release.sh
          ICON_FOREGROUND=app/src/main/res/drawable/ic_launcher_foreground.xml
          ICON_MONOCHROME=app/src/main/res/drawable/ic_launcher_monochrome.xml
          ICON_V26=app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          ICON_ROUND_V26=app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          ICON_V33=app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          ICON_ROUND_V33=app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml
          test "$(grep -c 'android:screenOrientation=' "$MANIFEST" || true)" -eq 0
          grep -q 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"
          grep -q "applicationId 'com.shaterguy.chatgptselfrun'" "$BUILD"
          grep -q 'versionCode 18' "$BUILD"
          grep -q "versionName '0.2.3-dev6'" "$BUILD"
          test -s "$ICON_FOREGROUND"
          test -s "$ICON_MONOCHROME"
          test -s "$ICON_V26"
          test -s "$ICON_ROUND_V26"
          test -s "$ICON_V33"
          test -s "$ICON_ROUND_V33"
          grep -q '<adaptive-icon' "$ICON_V26"
          grep -q '<adaptive-icon' "$ICON_ROUND_V26"
          grep -q '<monochrome android:drawable="@drawable/ic_launcher_monochrome"' "$ICON_V33"
          grep -q '<monochrome android:drawable="@drawable/ic_launcher_monochrome"' "$ICON_ROUND_V33"
          test -s "$SIGNING_SCRIPT"
          ! grep -q 'jarsigner' "$SIGNING_SCRIPT"
          grep -q 'APKSIGNER' "$SIGNING_SCRIPT"
          grep -q -- '--ks-type PKCS12' "$SIGNING_SCRIPT"
          grep -q -- '--ks-key-alias selfrun' "$SIGNING_SCRIPT"
          grep -q -- '--v2-signing-enabled true' "$SIGNING_SCRIPT"
          grep -q -- '--v3-signing-enabled true' "$SIGNING_SCRIPT"
          grep -q 'verify --verbose --print-certs' "$SIGNING_SCRIPT"
          grep -q 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' "$SIGNING_SCRIPT"
          grep -q 'SelfRunNewActivity' "$MANIFEST"
          grep -q 'SelfRunLogMenuActivity' "$MANIFEST"
          ! grep -q 'SCHEDULE_EXACT_ALARM' "$MANIFEST"
          grep -q 'WIDTH = 1440' "$HOST"
          grep -q 'HEIGHT = 900' "$HOST"
          grep -q 'DENSITY_DPI = 160' "$HOST"
          ! grep -q 'setRendererPriorityPolicy' "$HOST"
          grep -q 'applyLogin(webView)' "$LOGIN"
          grep -q 'applyAutomation(webView)' "$SERVICE"
          grep -q 'setUseWideViewPort(true)' "$WEB"
          grep -q 'setUseWideViewPort(false)' "$WEB"
          grep -q 'getUserAgentString' "$WEB"
          ! grep -q 'Windows NT 10.0' "$WEB"
          grep -q 'v0.2.3-dev6' "$MAIN"
          grep -q 'ChatGPTSelfRun/0.2.3-dev6' "$WEB"
          grep -q '새 작업' "$MAIN"
          ! grep -q 'new EditText' "$MAIN"
          grep -q '일시정지' "$MAIN"
          grep -q 'ACTION_PAUSE' "$MAIN"
          grep -q 'ACTION_RESUME' "$MAIN"
          grep -q 'SOFT_INPUT_STATE_ALWAYS_HIDDEN' "$NEW"
          grep -q 'setVerticalScrollBarEnabled(true)' "$NEW"
          grep -q 'setHorizontallyScrolling(false)' "$NEW"
          grep -q 'canScrollVertically' "$NEW"
          grep -q 'requestDisallowInterceptTouchEvent' "$NEW"
          grep -q 'prepareInitialContext' "$DOM"
          grep -q 'EXISTING_CONVERSATION' "$DOM"
          grep -q 'const chatControl=' "$DOM"
          grep -q 'const workControl=' "$DOM"
          grep -q 'selectedModes' "$DOM"
          grep -q 'targetSelected=selectedState(target)' "$DOM"
          grep -q 'modeReadback=targetFound&&targetSelected&&currentMode===requestedMode&&selectedModes.length===1' "$DOM"
          grep -q "if(action)return result('UI_WAIT','모드 전환 반영 대기" "$DOM"
          grep -q "if(!modeReadback)return result('UI_WAIT','실행 모드 실제 상태 대기" "$DOM"
          grep -q 'retryIntervalMs=1200' "$DOM"
          grep -q '!modeReadback&&targetFound&&!recentClick' "$DOM"
          grep -q 'finalReadback:modeReadback' "$DOM"
          grep -q 'targetFound=${targetFound?1:0}' "$DOM"
          grep -q 'sessionStorage.removeItem(modeKey)' "$DOM"
          grep -q 'const matching=' "$DOM"
          grep -q 'durableMarkerWriteWithBaseline(marker, "matching")' "$DOM"
          grep -q 'matching>baseline' "$DOM"
          grep -q 'userIndex=-1' "$DOM"
          grep -q 'for(let i=userIndex+1' "$DOM"
          ! grep -q 'assistantDigest' "$DOM"
          grep -q 'new MutationObserver' "$OBSERVER"
          grep -q "postMessage('state|' + fingerprint)" "$OBSERVER"
          grep -q 'fingerprint === state.lastFingerprint' "$OBSERVER"
          grep -q 'state.suppressed++' "$OBSERVER"
          grep -q "status:'ALIVE'" "$OBSERVER"
          grep -q 'rootConnected' "$OBSERVER"
          grep -q 'observer?.disconnect()' "$OBSERVER"
          grep -q 'clearTimeout' "$OBSERVER"
          grep -q 'if (!current()) return;' "$OBSERVER"
          grep -q "if (state.lease !== expectedLease) return 'STALE'" "$OBSERVER"
          grep -q 'takeRecords' "$OBSERVER"
          ! grep -q 'setInterval' "$OBSERVER"
          grep -q 'DOM_WATCHDOG_MS = 15_000L' "$SERVICE"
          grep -q 'watchdogRunnable = this::runDomWatchdog' "$SERVICE"
          grep -q 'SelfRunDomObserver.health(activeLease)' "$SERVICE"
          grep -q 'DOM_OBSERVER_HEALTH_EVALUATE' "$SERVICE"
          grep -q 'watchdog_missed_event' "$SERVICE"
          grep -q 'domEvaluationPending' "$SERVICE"
          grep -q 'DOM_EFFICIENCY' "$SERVICE"
          grep -q 'createWebMessageChannel()' "$SERVICE"
          grep -q 'postWebMessage(new WebMessage(token' "$SERVICE"
          grep -q 'return Uri.parse("https://" + host);' "$SERVICE"
          grep -q 'ensureDomObserver()' "$SERVICE"
          grep -q 'detachDomObserver(cause)' "$SERVICE"
          grep -q 'SelfRunDomObserver.detach(detachedLease)' "$SERVICE"
          grep -q 'SelfRunDomObserver.install(token, lease, activeRunId, activeGeneration, activeEpoch)' "$SERVICE"
          grep -q 'executionEpoch' "$SERVICE"
          grep -q 'activeExecutionEpoch != executionEpoch' "$SERVICE"
          grep -q 'resumeObserverGate' "$SERVICE"
          grep -q 'updateWakeLockForState("resume_observer_ready")' "$SERVICE"
          grep -q 'scheduleWatchdog()' "$SERVICE"
          grep -q 'WakeLockController wakeLockController' "$SERVICE"
          grep -q 'wakeLockStateFor' "$SERVICE"
          grep -q 'WAKELOCK_STATE' "$SERVICE"
          grep -q 'WAKELOCK_EFFICIENCY' "$SERVICE"
          grep -q 'beginRecovery' "$SERVICE"
          grep -q 'finishRecovery' "$SERVICE"
          ! grep -q 'PowerManager.WakeLock' "$SERVICE"
          ! grep -q 'wakeLock.acquire' "$SERVICE"
          ! grep -q 'wakeLock.release' "$SERVICE"
          test -s "$WAKE"
          grep -q 'PowerManager.PARTIAL_WAKE_LOCK' "$WAKE"
          grep -q 'setReferenceCounted(false)' "$WAKE"
          grep -q 'lock.acquire()' "$WAKE"
          grep -q 'lock.release()' "$WAKE"
          grep -q 'State.AUTOMATION' "$SERVICE"
          grep -q 'State.RECOVERY' "$SERVICE"
          grep -q 'State.RATE_LIMIT' "$SERVICE"
          grep -q 'DOM_EVALUATE' "$SERVICE"
          grep -q 'DOM_RESULT' "$SERVICE"
          grep -q 'DOM_WAIT' "$SERVICE"
          grep -q 'static final String ACTION_PAUSE' "$SERVICE"
          grep -q 'static final String ACTION_RESUME' "$SERVICE"
          grep -q 'enterPreservedPause' "$SERVICE"
          grep -q 'WEBVIEW_RECOVERY_RECONNECT' "$SERVICE"
          grep -q 'STALE_CALLBACK' "$SERVICE"
          grep -q 'DOM_OBSERVER_DUPLICATE' "$SERVICE"
          grep -q 'DOM_EVALUATION_COALESCED' "$SERVICE"
          grep -q 'DOM_WATCHDOG_SKIPPED' "$SERVICE"
          grep -q 'IO_EFFICIENCY' "$SERVICE"
          grep -q 'updateLogExecutionContext' "$SERVICE"
          ! grep -q 'webView.onPause()' "$SERVICE"
          ! grep -q 'webView.onResume()' "$SERVICE"
          ! grep -q 'pauseTimers' "$SERVICE"
          ! grep -q 'addJavascriptInterface' "$SERVICE"
          ! grep -q 'WorkManager' "$SERVICE"
          ! grep -q 'AlarmManager' "$SERVICE"
          ! grep -q 'setRendererPriorityPolicy' "$SERVICE"
          grep -q 'restartPhaseClock' "$STORE"
          grep -q 'setPhaseAndStatus' "$STORE"
          grep -q 'enterPausedState' "$STORE"
          grep -q 'enterErrorPausedState' "$STORE"
          grep -q 'resumeState' "$STORE"
          grep -q 'stopByUser' "$STORE"
          grep -q 'markNoop' "$STORE"
          grep -q 'SYNC_DEBOUNCE_MS = 250L' "$HISTORY_STORE"
          grep -q 'pendingSnapshots' "$HISTORY_STORE"
          grep -q 'syncCritical' "$HISTORY_STORE"
          grep -q 'physicalWrites' "$HISTORY_STORE"
          ! grep -q '\.commit()' "$HISTORY_STORE"
          grep -q '\.apply()' "$HISTORY_STORE"
          test -s "$SAMPLER"
          grep -q 'SUMMARY_INTERVAL_MS = 60_000L' "$SAMPLER"
          grep -q 'BURST_WINDOW_MS = 10_000L' "$SAMPLER"
          grep -q 'BURST_THRESHOLD = 25L' "$SAMPLER"
          grep -q 'REPEAT_SUMMARY' "$SAMPLER"
          grep -q 'STALE_CALLBACK' "$SAMPLER"
          grep -q 'ScheduledExecutorService' "$RUNLOG"
          grep -q 'WRITE_BATCH_MS = 250L' "$RUNLOG"
          grep -q 'REPEAT_SUMMARY' "$RUNLOG"
          grep -q 'first_occurrence_kst' "$RUNLOG"
          grep -q 'last_occurrence_kst' "$RUNLOG"
          grep -q 'repeat_count' "$RUNLOG"
          grep -q 'observer_epoch' "$RUNLOG"
          grep -q 'wakelock_state' "$RUNLOG"
          ! grep -q 'output.flush()' "$RUNLOG"
          grep -q '"luna".equals(model)' "$PROTOCOL"
          grep -q '"max".equals(reasoning)' "$PROTOCOL"
          grep -q '"ultra".equals(reasoning)' "$PROTOCOL"
          grep -q '작업 이력' "$HISTORY"
          grep -q '현재 실행 중인 작업과 과거 작업' "$LOGMENU"
          grep -q 'ACTION_CREATE_DOCUMENT' "$LOGS"
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build unsigned release APK
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Align and verify unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          APK=app/build/outputs/apk/release/chatgpt-selfrun-android-v0.2.3-dev6-aligned-unsigned.apk
          test -s "$SRC"
          "$BT/zipalign" -p -f 4 "$SRC" "$APK"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/aapt" dump badging "$APK" | tee app/build/outputs/apk/release/BADGING.txt
          grep -q "package: name='com.shaterguy.chatgptselfrun'" app/build/outputs/apk/release/BADGING.txt
          grep -q "versionCode='18'" app/build/outputs/apk/release/BADGING.txt
          grep -q "versionName='0.2.3-dev6'" app/build/outputs/apk/release/BADGING.txt
          unzip -t "$APK" >/dev/null
          cp "$BT/lib/apksigner.jar" app/build/outputs/apk/release/apksigner-36.0.0.jar
          test -s app/build/outputs/apk/release/apksigner-36.0.0.jar
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Upload unsigned release APK and signing tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-android-v0.2.3-dev6-unsigned
          path: |
            app/build/outputs/apk/release/chatgpt-selfrun-android-v0.2.3-dev6-aligned-unsigned.apk
            app/build/outputs/apk/release/apksigner-36.0.0.jar
            app/build/outputs/apk/release/BADGING.txt
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
