name: Build SelfRun APK

on:
  push:
    branches:
      - main
      - agent/selfrun-v0.1.0
      - work/updateable-apk
      - v0.2.1-dev1
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Static SelfRun policy checks
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=app/src/main/AndroidManifest.xml
          HOST=app/src/main/java/com/shaterguy/chatgptselfrun/HeadlessWebViewHost.java
          WEB=app/src/main/java/com/shaterguy/chatgptselfrun/WebViewConfig.java
          LOGIN=app/src/main/java/com/shaterguy/chatgptselfrun/LoginActivity.java
          MAIN=app/src/main/java/com/shaterguy/chatgptselfrun/MainActivity.java
          NEW=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java
          SERVICE=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          DOM=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java
          RUNLOG=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunRunLog.java
          PROTOCOL=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java
          HISTORY=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunHistoryActivity.java
          LOGMENU=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunLogMenuActivity.java
          LOGS=app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunLogsActivity.java
          SIGNING_SCRIPT=tools/sign_release.sh
          ICON_FOREGROUND=app/src/main/res/drawable/ic_launcher_foreground.xml
          ICON_MONOCHROME=app/src/main/res/drawable/ic_launcher_monochrome.xml
          ICON_V26=app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          ICON_ROUND_V26=app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          ICON_V33=app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          ICON_ROUND_V33=app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml
          test "$(grep -c 'android:screenOrientation=' "$MANIFEST" || true)" -eq 0
          grep -q 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"
          test -s "$ICON_FOREGROUND"
          test -s "$ICON_MONOCHROME"
          test -s "$ICON_V26"
          test -s "$ICON_ROUND_V26"
          test -s "$ICON_V33"
          test -s "$ICON_ROUND_V33"
          grep -q '<adaptive-icon' "$ICON_V26"
          grep -q '<adaptive-icon' "$ICON_ROUND_V26"
          grep -q '<monochrome android:drawable="@drawable/ic_launcher_monochrome"' "$ICON_V33"
          grep -q '<monochrome android:drawable="@drawable/ic_launcher_monochrome"' "$ICON_ROUND_V33"
          test -s "$SIGNING_SCRIPT"
          ! grep -q 'jarsigner' "$SIGNING_SCRIPT"
          grep -q 'APKSIGNER' "$SIGNING_SCRIPT"
          grep -q -- '--ks-type PKCS12' "$SIGNING_SCRIPT"
          grep -q -- '--ks-key-alias selfrun' "$SIGNING_SCRIPT"
          grep -q -- '--v2-signing-enabled true' "$SIGNING_SCRIPT"
          grep -q -- '--v3-signing-enabled true' "$SIGNING_SCRIPT"
          grep -q 'verify --verbose --print-certs' "$SIGNING_SCRIPT"
          grep -q 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' "$SIGNING_SCRIPT"
          grep -q 'SelfRunNewActivity' "$MANIFEST"
          grep -q 'SelfRunLogMenuActivity' "$MANIFEST"
          ! grep -q 'SCHEDULE_EXACT_ALARM' "$MANIFEST"
          grep -q 'WIDTH = 1440' "$HOST"
          grep -q 'HEIGHT = 900' "$HOST"
          grep -q 'DENSITY_DPI = 160' "$HOST"
          grep -q 'applyLogin(webView)' "$LOGIN"
          grep -q 'applyAutomation(webView)' "$SERVICE"
          grep -q 'setUseWideViewPort(true)' "$WEB"
          grep -q 'setUseWideViewPort(false)' "$WEB"
          grep -q 'getUserAgentString' "$WEB"
          ! grep -q 'Windows NT 10.0' "$WEB"
          grep -q 'v0.2.1-dev1' "$MAIN"
          grep -q 'ChatGPTSelfRun/0.2.1-dev1' "$WEB"
          grep -q '새 작업' "$MAIN"
          ! grep -q 'new EditText' "$MAIN"
          grep -q 'SOFT_INPUT_STATE_ALWAYS_HIDDEN' "$NEW"
          grep -q 'prepareInitialContext' "$DOM"
          grep -q 'EXISTING_CONVERSATION' "$DOM"
          grep -q 'currentMode' "$DOM"
          grep -q 'modeReadback' "$DOM"
          grep -q "if(action)return result('UI_WAIT','모드 전환 반영 대기'" "$DOM"
          ! grep -q '실행 모드 실제 상태 대기' "$DOM"
          ! grep -q "if(!modeReadback)return result('UI_WAIT'" "$DOM"
          grep -q 'sessionStorage.removeItem(modeKey)' "$DOM"
          grep -q 'const matching=' "$DOM"
          grep -q 'durableMarkerWriteWithBaseline(marker, "matching")' "$DOM"
          grep -q 'matching>baseline' "$DOM"
          grep -q 'userIndex=-1' "$DOM"
          grep -q 'for(let i=userIndex+1' "$DOM"
          ! grep -q 'assistantDigest' "$DOM"
          grep -q 'DOM_EVALUATE' "$SERVICE"
          grep -q 'DOM_RESULT' "$SERVICE"
          grep -q 'NOISY_HEARTBEAT_MS' "$RUNLOG"
          grep -q '"luna".equals(model)' "$PROTOCOL"
          grep -q '"max".equals(reasoning)' "$PROTOCOL"
          grep -q '"ultra".equals(reasoning)' "$PROTOCOL"
          grep -q '작업 이력' "$HISTORY"
          grep -q '현재 실행 중인 작업과 과거 작업' "$LOGMENU"
          grep -q 'ACTION_CREATE_DOCUMENT' "$LOGS"
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build unsigned release APK
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Align and verify unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          APK=app/build/outputs/apk/release/chatgpt-selfrun-android-v0.2.1-dev1-aligned-unsigned.apk
          test -s "$SRC"
          "$BT/zipalign" -p -f 4 "$SRC" "$APK"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/aapt" dump badging "$APK" | tee app/build/outputs/apk/release/BADGING.txt
          grep -q "package: name='com.shaterguy.chatgptselfrun'" app/build/outputs/apk/release/BADGING.txt
          grep -q "versionCode='10'" app/build/outputs/apk/release/BADGING.txt
          grep -q "versionName='0.2.1-dev1'" app/build/outputs/apk/release/BADGING.txt
          unzip -t "$APK" >/dev/null
          cp "$BT/lib/apksigner.jar" app/build/outputs/apk/release/apksigner-36.0.0.jar
          test -s app/build/outputs/apk/release/apksigner-36.0.0.jar
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Upload unsigned release APK and signing tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-selfrun-android-v0.2.1-dev1-unsigned
          path: |
            app/build/outputs/apk/release/chatgpt-selfrun-android-v0.2.1-dev1-aligned-unsigned.apk
            app/build/outputs/apk/release/apksigner-36.0.0.jar
            app/build/outputs/apk/release/BADGING.txt
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release-v020:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-v0.2.0]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install APK verification tools
        run: |
          sdkmanager 'platform-tools' 'build-tools;36.0.0'
      - name: Recover and verify the exact signed v0.2.0 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=chatgpt-selfrun-android-v0.2.0.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/1b532d443b38528f9cd13531a9f4c08ed7bf57f9" --jq .content \
            | tr -d '\n' | base64 --decode > "$APK"
          test "$(stat -c %s "$APK")" -eq 697939
          echo '2ebe9bf383a4a86268c89c3f3ce96fdba1c30be89c4b4942172058fa288ff727  chatgpt-selfrun-android-v0.2.0.apk' \
            | sha256sum --check --strict
          "$BT/aapt" dump badging "$APK" | tee BADGING.txt
          grep -q "package: name='com.shaterguy.chatgptselfrun'" BADGING.txt
          grep -q "versionCode='9'" BADGING.txt
          grep -q "versionName='0.2.0'" BADGING.txt
          java -jar "$BT/lib/apksigner.jar" verify --verbose --print-certs "$APK" | tee APKSIGNER.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' APKSIGNER.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' APKSIGNER.txt
          grep -q 'Signer #1 certificate SHA-256 digest: b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' APKSIGNER.txt
          "$BT/zipalign" -c -v 4 "$APK"
          unzip -t "$APK" >/dev/null
          echo '2ebe9bf383a4a86268c89c3f3ce96fdba1c30be89c4b4942172058fa288ff727  chatgpt-selfrun-android-v0.2.0.apk' > SHA256SUMS.txt
      - name: Publish v0.2.0 as the latest GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.2.0
          APK=chatgpt-selfrun-android-v0.2.0.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$TAG" --pattern "$APK" --dir existing-release
            echo '2ebe9bf383a4a86268c89c3f3ce96fdba1c30be89c4b4942172058fa288ff727  existing-release/chatgpt-selfrun-android-v0.2.0.apk' \
              | sha256sum --check --strict
            exit 0
          fi
          printf '%s\n' \
            'dev6 기능을 그대로 유지하고 앱 버전을 0.2.0으로 올린 정식 릴리스입니다.' \
            '' \
            '- USER_ACTION_REQUIRED에서 현재 WebView와 conversation을 유지합니다.' \
            '- 재개 시 동일 WebView에서 SELF_RUN_CONTINUE를 전송합니다.' \
            '- 중단된 Auth0/command-bridge 작업은 포함하지 않습니다.' \
            '- versionName: 0.2.0 / versionCode: 9' \
            '- SelfRun bootstrap protocol: 0.1.0 (호환성 유지)' \
            '- APK SHA-256: 2ebe9bf383a4a86268c89c3f3ce96fdba1c30be89c4b4942172058fa288ff727' \
            '- 인증서 SHA-256: b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' \
            > RELEASE_NOTES.md
          gh release create "$TAG" "$APK" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'v0.2.0' \
            --notes-file RELEASE_NOTES.md \
            --latest
