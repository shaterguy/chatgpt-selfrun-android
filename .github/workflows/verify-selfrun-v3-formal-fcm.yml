name: Verify SelfRun 3 Formal FCM
run-name: SelfRun 3 Formal FCM (${{ github.ref_name }}) #${{ github.run_number }} attempt-${{ github.run_attempt }}

on:
  push:
    branches:
      - 'validation/formal-fcm-v*'
      - 'selfrun-v3/v3.2.6-dev2*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: selfrun-v3-formal-fcm-${{ github.ref }}
  cancel-in-progress: true

env:
  FORMAL_FCM_ARTIFACT: selfrun-v3-formal-fcm-${{ github.run_attempt }}

jobs:
  build-formal-smoke-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SELFRUN_FIREBASE_API_KEY: ${{ secrets.SELFRUN_FIREBASE_API_KEY }}
      SELFRUN_FIREBASE_APPLICATION_ID: ${{ secrets.SELFRUN_FIREBASE_APPLICATION_ID }}
      SELFRUN_FIREBASE_PROJECT_ID: ${{ secrets.SELFRUN_FIREBASE_PROJECT_ID }}
      SELFRUN_FIREBASE_SENDER_ID: ${{ secrets.SELFRUN_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Resolve exact source and Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/.*selfRunDriveVersionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/.*selfRunDriveVersionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          [[ "$VERSION_NAME" == '3.2.6-dev2' ]]
          [[ "$VERSION_CODE" == '3026002' ]]
          missing=0
          for key in SELFRUN_FIREBASE_API_KEY SELFRUN_FIREBASE_PROJECT_ID SELFRUN_FIREBASE_SENDER_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::${key} is not configured for formal FCM smoke"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]
          grep -Fq '1:859485943787:android:feab87243808eb6ca30bae' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunFirebase.java
          grep -Fq 'com.shaterguy.chatgptselfrun.drive' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunFirebase.java
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Build formal target and release-target instrumentation
        shell: bash
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain --stacktrace :app:assembleRelease
          sed -i "s/testBuildType 'qaApp'/testBuildType 'release'/" app/build.gradle
          grep -Fq "testBuildType 'release'" app/build.gradle
          gradle --build-cache --no-daemon --console=plain --stacktrace \
            :app:compileReleaseAndroidTestJavaWithJavac :app:assembleReleaseAndroidTest
          FORMAL_RAW=app/build/outputs/apk/release/app-release-unsigned.apk
          ANDROID_TEST_RAW="$(find app/build/outputs/apk/androidTest -type f -name '*.apk' -print -quit)"
          test -s "$FORMAL_RAW"; test -s "$ANDROID_TEST_RAW"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p formal-fcm-output
          "$BT/zipalign" -p -f 4 "$FORMAL_RAW" formal-fcm-output/formal-aligned.apk
          "$BT/zipalign" -p -f 4 "$ANDROID_TEST_RAW" formal-fcm-output/androidTest-aligned.apk
      - name: Install hash-locked signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
      - name: Sign exact formal smoke pair
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/selfrun-v3-formal-fcm-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          FORMAL=formal-fcm-output/chatgpt-selfrun-drive-formal-fcm-v${VERSION_NAME}.apk
          ANDROID_TEST=formal-fcm-output/chatgpt-selfrun-drive-formal-fcm-v${VERSION_NAME}-androidTest.apk
          APKSIGNER="$BT/apksigner" bash tools/sign_release.sh formal-fcm-output/formal-aligned.apk "$PASS_FILE" "$FORMAL" > formal-fcm-output/FORMAL_APKSIGNER_VERIFY.txt
          APKSIGNER="$BT/apksigner" bash tools/sign_release.sh formal-fcm-output/androidTest-aligned.apk "$PASS_FILE" "$ANDROID_TEST" > formal-fcm-output/ANDROIDTEST_APKSIGNER_VERIFY.txt
          "$BT/apksigner" verify --verbose --print-certs "$FORMAL" > formal-fcm-output/FORMAL_CERT.txt
          "$BT/apksigner" verify --verbose --print-certs "$ANDROID_TEST" > formal-fcm-output/ANDROIDTEST_CERT.txt
          grep -Fqi 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' formal-fcm-output/FORMAL_CERT.txt
          grep -Fqi 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' formal-fcm-output/ANDROIDTEST_CERT.txt
          FORMAL_BADGING="$($BT/aapt dump badging "$FORMAL")"
          TEST_BADGING="$($BT/aapt dump badging "$ANDROID_TEST")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$FORMAL_BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$FORMAL_BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$FORMAL_BADGING"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" <<<"$TEST_BADGING"
          sha256sum "$FORMAL" "$ANDROID_TEST" > formal-fcm-output/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > formal-fcm-output/SOURCE_COMMIT.txt
      - name: Upload signed formal smoke pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.FORMAL_FCM_ARTIFACT }}
          path: |
            formal-fcm-output/chatgpt-selfrun-drive-formal-fcm-v*.apk
            formal-fcm-output/SHA256SUMS.txt
            formal-fcm-output/*CERT.txt
            formal-fcm-output/*APKSIGNER_VERIFY.txt
            formal-fcm-output/SOURCE_COMMIT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  formal-fcm-smoke:
    needs: build-formal-smoke-pair
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ env.FORMAL_FCM_ARTIFACT }}
          path: current
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'
      - name: Resolve exact formal smoke pair
        shell: bash
        run: |
          set -euo pipefail
          FORMAL="$(find current -type f -name 'chatgpt-selfrun-drive-formal-fcm-v*.apk' ! -name '*androidTest*' -print -quit)"
          ANDROID_TEST="$(find current -type f -name '*androidTest.apk' -print -quit)"
          test -s "$FORMAL"; test -s "$ANDROID_TEST"
          cp "$FORMAL" current/formal.apk
          cp "$ANDROID_TEST" current/androidTest.apk
          [[ "$(tr -d '[:space:]' < current/SOURCE_COMMIT.txt)" == "$GITHUB_SHA" ]]
          grep -F "$(sha256sum current/formal.apk | awk '{print $1}')" current/SHA256SUMS.txt >/dev/null
          grep -F "$(sha256sum current/androidTest.apk | awk '{print $1}')" current/SHA256SUMS.txt >/dev/null
      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Production FCM round-trip from signed formal package
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -accel on -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none -memory 2048
          disable-animations: true
          script: >-
            bash -o pipefail -c
            'set -euo pipefail;
            adb install --no-incremental current/formal.apk >/dev/null;
            adb install --no-incremental current/androidTest.apk >/dev/null;
            FORMAL=com.shaterguy.chatgptselfrun.drive;
            INSTRUMENTATION="$(adb shell pm list instrumentation | tr -d "\r" | sed -n "s#^instrumentation:\([^ ]*\) (target=$FORMAL)#\1#p" | head -1)";
            test -n "$INSTRUMENTATION";
            adb shell am instrument -w -r -e smokeId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -e class com.shaterguy.chatgptselfrun.SelfRunFormalFcmSmokeAndroidTest "$INSTRUMENTATION" 2>&1 | tee selfrun-v3-formal-fcm-evidence.txt;
            grep -Fq "OK (" selfrun-v3-formal-fcm-evidence.txt;
            grep -Fq "selfrunFormalFcmEvent=" selfrun-v3-formal-fcm-evidence.txt;
            grep -Fq "selfrunFormalFirebaseApp=formal" selfrun-v3-formal-fcm-evidence.txt'
      - name: Upload formal FCM runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-v3-formal-fcm-runtime-${{ github.run_attempt }}
          path: selfrun-v3-formal-fcm-evidence.txt
          if-no-files-found: warn
          retention-days: 14
