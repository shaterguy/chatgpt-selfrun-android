name: SelfRun Drive dev4 recovery cancellation guard

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev4'

permissions:
  contents: write

jobs:
  apply-recovery-ticket:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-ticket-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.3.0-dev4
      - name: Apply stale-recovery cancellation guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          service=Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          tests=Path('app/src/test/java/com/shaterguy/chatgptselfrun/ConversationFreshnessBarrierTest.java')
          s=service.read_text(encoding='utf-8')
          t=tests.read_text(encoding='utf-8')
          if 'private int mainFrameRecoveryTicket;' not in s:
              s=s.replace('    private int mainFrameRecoveryAttempts;\n    private boolean mainFrameRecoveryPending;\n','    private int mainFrameRecoveryAttempts;\n    private boolean mainFrameRecoveryPending;\n    private int mainFrameRecoveryTicket;\n',1)
              old='''private void handleMainFrameLoadError(WebView view){if(view!=webView||!canRun()||!isWebAutomationPhase(store.phase()))return;if(mainFrameRecoveryPending)return;if(mainFrameRecoveryAttempts>=MAX_MAIN_FRAME_RECOVERY_ATTEMPTS){store.setLastError("WEBVIEW_LOAD_RETRY_LIMIT","ChatGPT main-frame 네트워크 복구 한도에 도달했습니다.");runLog.record(store,"WEBVIEW_LOAD_RECOVERY_LIMIT","attempts="+mainFrameRecoveryAttempts+";action=pause");enterPreservedPause("WEBVIEW_LOAD_RETRY_LIMIT","ChatGPT 네트워크 복구 한도 도달 · 사용자 조치 대기",false);NotificationHelper.notifyUser(this,"확인 필요",store.status());return;}int attempt=++mainFrameRecoveryAttempts;mainFrameRecoveryPending=true;runLog.record(store,"WEBVIEW_LOAD_RECOVERY_SCHEDULED","attempt="+attempt+";delayMs="+MAIN_FRAME_RECOVERY_DELAY_MS);postWebCallback(()->{mainFrameRecoveryPending=false;if(view!=webView)return;String target=canonicalUrl();if(!validAutomationTarget(target)){store.setLastError("WEBVIEW_LOAD_RECOVERY_TARGET_MISSING","ChatGPT 복구 대상 URL을 확인할 수 없습니다.");enterPreservedPause("WEBVIEW_LOAD_RECOVERY_TARGET_MISSING","ChatGPT 복구 대상 확인 필요 · 사용자 조치 대기",false);NotificationHelper.notifyUser(this,"확인 필요",store.status());return;}runLog.record(store,"WEBVIEW_LOAD_RECOVERY_NAVIGATION","attempt="+attempt+";bounded=1");view.loadUrl(target);},MAIN_FRAME_RECOVERY_DELAY_MS);}\nprivate void resetMainFrameRecovery(){mainFrameRecoveryAttempts=0;mainFrameRecoveryPending=false;}'''
              new='''private void handleMainFrameLoadError(WebView view){if(view!=webView||!canRun()||!isWebAutomationPhase(store.phase()))return;if(mainFrameRecoveryPending)return;if(mainFrameRecoveryAttempts>=MAX_MAIN_FRAME_RECOVERY_ATTEMPTS){store.setLastError("WEBVIEW_LOAD_RETRY_LIMIT","ChatGPT main-frame 네트워크 복구 한도에 도달했습니다.");runLog.record(store,"WEBVIEW_LOAD_RECOVERY_LIMIT","attempts="+mainFrameRecoveryAttempts+";action=pause");enterPreservedPause("WEBVIEW_LOAD_RETRY_LIMIT","ChatGPT 네트워크 복구 한도 도달 · 사용자 조치 대기",false);NotificationHelper.notifyUser(this,"확인 필요",store.status());return;}int attempt=++mainFrameRecoveryAttempts,ticket=++mainFrameRecoveryTicket;mainFrameRecoveryPending=true;runLog.record(store,"WEBVIEW_LOAD_RECOVERY_SCHEDULED","attempt="+attempt+";delayMs="+MAIN_FRAME_RECOVERY_DELAY_MS);postWebCallback(()->{if(ticket!=mainFrameRecoveryTicket||!mainFrameRecoveryPending||view!=webView)return;mainFrameRecoveryPending=false;String target=canonicalUrl();if(!validAutomationTarget(target)){store.setLastError("WEBVIEW_LOAD_RECOVERY_TARGET_MISSING","ChatGPT 복구 대상 URL을 확인할 수 없습니다.");enterPreservedPause("WEBVIEW_LOAD_RECOVERY_TARGET_MISSING","ChatGPT 복구 대상 확인 필요 · 사용자 조치 대기",false);NotificationHelper.notifyUser(this,"확인 필요",store.status());return;}runLog.record(store,"WEBVIEW_LOAD_RECOVERY_NAVIGATION","attempt="+attempt+";bounded=1");view.loadUrl(target);},MAIN_FRAME_RECOVERY_DELAY_MS);}\nprivate void resetMainFrameRecovery(){mainFrameRecoveryTicket++;mainFrameRecoveryAttempts=0;mainFrameRecoveryPending=false;}'''
              if old not in s: raise SystemExit('expected bounded recovery helper not found')
              s=s.replace(old,new,1)
          if 'readinessCancelsPreviouslyScheduledRecoveryNavigation' not in t:
              anchor='''    @Test public void canonicalRestoreIsNoOpWhenRouteAlreadyMatches() throws Exception {\n'''
              add='''    @Test public void readinessCancelsPreviouslyScheduledRecoveryNavigation() throws Exception {\n        String s=src("SelfRunService.java"),recovery=between(s,"private void handleMainFrameLoadError","private void postWebCallback");\n        assertTrue(recovery.contains("ticket=++mainFrameRecoveryTicket"));\n        assertTrue(recovery.contains("ticket!=mainFrameRecoveryTicket||!mainFrameRecoveryPending||view!=webView"));\n        assertTrue(recovery.indexOf("ticket!=mainFrameRecoveryTicket")<recovery.indexOf("view.loadUrl(target)"));\n        assertTrue(recovery.contains("mainFrameRecoveryTicket++"));\n    }\n''' + anchor
              if anchor not in t: raise SystemExit('test insertion anchor not found')
              t=t.replace(anchor,add,1)
          service.write_text(s,encoding='utf-8')
          tests.write_text(t,encoding='utf-8')
          PY
          git diff --check
      - name: Commit cancellation guard if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'SHatergUY'
          git config user.email '108107617+shaterguy@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java app/src/test/java/com/shaterguy/chatgptselfrun/ConversationFreshnessBarrierTest.java
          git commit -m 'fix(drive): cancel stale delayed recovery [recovery-ticket-applied]'
          git push origin HEAD:selfrun-drive/v1.3.0-dev4
