name: Apply SelfRun Drive dev4 observability

on:
  push:
    branches:
      - selfrun-drive/v2.2.1-dev4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Patch, verify diff, and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('app/build.gradle')
          text = p.read_text(encoding='utf-8')
          pairs = [
              ('def selfRunDriveVersionCode = 2020005', 'def selfRunDriveVersionCode = 2020006'),
              ("def selfRunDriveVersionName = '2.2.1-dev3'", "def selfRunDriveVersionName = '2.2.1-dev4'"),
              ("selfRunDriveVersionName != '2.2.1-dev3'", "selfRunDriveVersionName != '2.2.1-dev4'"),
              ('SelfRun Drive development version must be 2.2.1-dev3', 'SelfRun Drive development version must be 2.2.1-dev4'),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'app/build.gradle: expected one {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          once(
              'app/src/main/java/com/shaterguy/chatgptselfrun/ChatGptTurnProtocolScript.java',
              "                      +'?run='+encodeURIComponent(run)+'&token='+encodeURIComponent(token)\n                      +'&source='+encodeURIComponent(safe(source));",
              "                      +'?run='+encodeURIComponent(run)+'&token='+encodeURIComponent(token)\n                      +'&path=protocol&source='+encodeURIComponent(safe(source))\n                      +'&turnSequence='+encodeURIComponent(String(state.turnSequence))\n                      +'&turnKind='+encodeURIComponent(safe(state.turnKind));"
          )

          once(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunContinuationDom.java',
              "                + \"const observerCallback='\" + TURN_COMPLETION_SCHEME + \"://\" + TURN_COMPLETION_HOST\n                + \"?run='+encodeURIComponent(observerRun)+'&token='+encodeURIComponent(observerToken);\"",
              "                + \"const observerCallback='\" + TURN_COMPLETION_SCHEME + \"://\" + TURN_COMPLETION_HOST\n                + \"?run='+encodeURIComponent(observerRun)+'&token='+encodeURIComponent(observerToken)+'&path=dom_fallback&source=stable_idle';\""
          )

          p = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          text = p.read_text(encoding='utf-8')
          old = '    String host=uri.getHost(),run=uri.getQueryParameter("run"),token=uri.getQueryParameter("token");'
          new = '    String host=uri.getHost(),run=uri.getQueryParameter("run"),token=uri.getQueryParameter("token"),completionPath=uri.getQueryParameter("path"),completionSource=uri.getQueryParameter("source"),turnSequence=uri.getQueryParameter("turnSequence"),turnKind=uri.getQueryParameter("turnKind");'
          if text.count(old) != 1:
              raise SystemExit(f'SelfRunService callback vars: expected one, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '    runLog.record(store,"TURN_COMPLETION_OBSERVER","result=stable_idle;stabilityMs="+TURN_COMPLETION_STABILITY_MS+";action=drive_immediate");'
          new = '''    String path="protocol".equals(completionPath)?"protocol":"dom_fallback";
    String semantic;
    if("protocol".equals(path)){
        semantic=switch(completionSource==null?"":completionSource){
            case "message_stream_complete","finished_successfully_end_turn","work_done","restored_complete"->completionSource;
            default->"protocol_unknown";
        };
    }else semantic="stable_idle";
    String detail="result=completed;path="+path+";semantic="+semantic;
    if("protocol".equals(path)){
        String seq=turnSequence!=null&&turnSequence.matches("[0-9]{1,6}")?turnSequence:"unknown";
        String kind="FIRST_TURN".equals(turnKind)||"FOLLOWUP_TURN".equals(turnKind)?turnKind:"unknown";
        detail+=";turnSequence="+seq+";turnKind="+kind;
    }else detail+=";stabilityMs="+TURN_COMPLETION_STABILITY_MS;
    runLog.record(store,"TURN_COMPLETION_OBSERVER",detail+";action=drive_immediate");'''
          if text.count(old) != 1:
              raise SystemExit(f'SelfRunService stable log: expected one, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('app/src/test/java/com/shaterguy/chatgptselfrun/TurnCompletionObservabilityContractTest.java')
          test.write_text('''package com.shaterguy.chatgptselfrun;\n\nimport org.junit.Test;\n\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\nimport static org.junit.Assert.assertTrue;\n\npublic final class TurnCompletionObservabilityContractTest {\n    @Test public void completionPathAndSemanticAreExplicitlyLogged() throws Exception {\n        String protocol = source("ChatGptTurnProtocolScript.java");\n        String dom = source("SelfRunContinuationDom.java");\n        String service = source("SelfRunService.java");\n        assertTrue(protocol.contains("&path=protocol&source="));\n        assertTrue(protocol.contains("&turnSequence="));\n        assertTrue(protocol.contains("&turnKind="));\n        assertTrue(dom.contains("&path=dom_fallback&source=stable_idle"));\n        assertTrue(service.contains("result=completed;path="));\n        assertTrue(service.contains("semantic="));\n        assertTrue(service.contains("message_stream_complete"));\n        assertTrue(service.contains("work_done"));\n        assertTrue(service.contains("stabilityMs="));\n    }\n\n    private static String source(String file) throws Exception {\n        Path path = Paths.get("app/src/main/java/com/shaterguy/chatgptselfrun/" + file);\n        if (!Files.exists(path)) path = Paths.get("src/main/java/com/shaterguy/chatgptselfrun/" + file);\n        return new String(Files.readAllBytes(path), StandardCharsets.UTF_8);\n    }\n}\n''', encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/apply-dev4-observability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(drive): log protocol versus DOM completion source'
          git push origin HEAD:${GITHUB_REF_NAME}
