name: Verify v0.2.2 rc2 cleanup

on:
  push:
    branches:
      - v0.2.2-rc2

permissions:
  contents: write

jobs:
  verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Verify retired workflow and release metadata
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/release-v0.2.1.yml
          grep -q "versionCode 12" app/build.gradle
          grep -q "versionName '0.2.2'" app/build.gradle
          grep -q 'v0.2.2' app/src/main/java/com/shaterguy/chatgptselfrun/MainActivity.java
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build and verify release package metadata
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$BT/aapt" dump badging "$APK" | tee BADGING.txt
          grep -q "package: name='com.shaterguy.chatgptselfrun'" BADGING.txt
          grep -q "versionCode='12'" BADGING.txt
          grep -q "versionName='0.2.2'" BADGING.txt
          unzip -t "$APK" >/dev/null
      - name: Remove transient v0.2.2 publication before final main promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.2 >/dev/null 2>&1; then
            gh release delete v0.2.2 --cleanup-tag -y
          fi
          if gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.2.2 >/dev/null 2>&1; then
            echo 'v0.2.2 tag still exists after cleanup' >&2
            exit 1
          fi
