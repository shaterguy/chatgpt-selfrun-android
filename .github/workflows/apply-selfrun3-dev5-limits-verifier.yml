name: Apply SelfRun 3 dev5 limits verifier identity

on:
  push:
    branches:
      - 'selfrun-v3/v3.2.5-dev5-result-auth-recovery'

permissions:
  contents: write

jobs:
  apply-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Update limits verifier identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_selfrun3_dev5_limits_verifier_patch.py
          bash -n tools/verify_selfrun3_dev4_limits_settings.sh
          git diff --check
      - name: Commit verifier and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_selfrun3_dev5_limits_verifier_patch.py
          rm tools/.selfrun3-dev5-limits-verifier-trigger
          rm .github/workflows/apply-selfrun3-dev5-limits-verifier.yml
          git config user.name 'SHatergUY'
          git config user.email '108107617+shaterguy@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: align limits verifier with dev5 identity'
          git push origin HEAD:selfrun-v3/v3.2.5-dev5-result-auth-recovery
