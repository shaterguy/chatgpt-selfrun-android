name: Reconstruct SelfRun Drive v1.3.0-dev1
on:
  push:
    branches:
      - 'ops/selfrun-drive-v1.3.0-dev1-reconstruct'
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact candidate
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          BASE='640b872b2896df9c60f62cbed493fa375aec0fba'
          TARGET='selfrun-drive/v1.3.0-dev1'
          test "$(git rev-parse HEAD^)" = "$BASE"

          materialize_blob() {
            local sha="$1" path="$2"
            mkdir -p "$(dirname "$path")"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' | base64 -d > "$path"
          }

          materialize_blob '632fc2af491527f7c92a9662fb88f182dfa671c7' 'app/build.gradle'
          materialize_blob 'eeaefc4980882b5c358859a3ea717554749c2744' 'app/src/main/java/com/shaterguy/chatgptselfrun/DriveApiClient.java'
          materialize_blob 'd12b1a248397075d05afdc86f26c22508db39db1' 'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java'
          materialize_blob 'aaa357cb5ae8ebf60e3c658f903bb83e43616b8d' 'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java'
          materialize_blob '70ebabbc1844da3d09ae3887554573bbc6c24ef3' 'app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java'
          materialize_blob 'd1688115f703d31924b37e9b71c141ce696b99d8' 'app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunProtocolAttachmentTest.java'

          mkdir -p app/src/main/java/com/shaterguy/chatgptselfrun
          cat .selfrun-reconstruct/service.* | base64 -d | gzip -d > app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          cat .selfrun-reconstruct/store.* | base64 -d | gzip -d > app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java

          cat > /tmp/expected.sha256 <<'EOF'
          3c9c379d3d0f003ed13b21e3faee9df4ab08a704024bca7b9100e22e43db9703  app/build.gradle
          5e9b9473f2bb4b3c5defe9e4249ce6d6bf547745a76693c52d1d6668fa331982  app/src/main/java/com/shaterguy/chatgptselfrun/DriveApiClient.java
          c2c45575480c5fc886d3f9b577ee83778a2dc117c0621490d31141b5144baef4  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java
          8fba604652c5212fa4287c09ad7c4221762278ca1cc58742d8aea55761a87970  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java
          3a04e9f215eb221fa08240530044ee0b01a39e8204c2f0d44ffaa433975e9811  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          a012e2f74253dc56f613c7aae7291ff857ccfaa03c7d7e82b9b62240ca5565b2  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          9f83ce8afe7fa191affdfafdee37bb5001b68b8a4d638ac853d08d3275b68ef7  app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java
          99b628c9c9b5c6f3195af491909d8c45927d80901653b6c7f9597d49447cde5c  app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunProtocolAttachmentTest.java
          EOF
          sed -i 's/^          //' /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256

          rm -rf .selfrun-reconstruct .github/workflows/reconstruct-selfrun-drive-v130-dev1.yml
          git add -A

          mapfile -t changed < <(git diff --cached --name-only "$BASE" | sort)
          mapfile -t expected < <(printf '%s\n' \
            'app/build.gradle' \
            'app/src/main/java/com/shaterguy/chatgptselfrun/DriveApiClient.java' \
            'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java' \
            'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java' \
            'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java' \
            'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java' \
            'app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java' \
            'app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunProtocolAttachmentTest.java' | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          TREE=$(git write-tree)
          export GIT_AUTHOR_NAME='ChatGPT Vibe Coding'
          export GIT_AUTHOR_EMAIL='noreply@openai.com'
          export GIT_COMMITTER_NAME='ChatGPT Vibe Coding'
          export GIT_COMMITTER_EMAIL='noreply@openai.com'
          CANDIDATE=$(printf '%s\n' 'feat(drive): add run reference attachments' | git commit-tree "$TREE" -p "$BASE")
          test "$(git rev-parse "$CANDIDATE^")" = "$BASE"
          test "$(git diff --name-only "$BASE" "$CANDIDATE" | sort | sha256sum | awk '{print $1}')" = "$(printf '%s\n' "${expected[@]}" | sort | sha256sum | awk '{print $1}')"

          git fetch origin "$TARGET"
          CURRENT=$(git rev-parse "origin/$TARGET")
          test "$CURRENT" = "$BASE"
          git push origin "$CANDIDATE:refs/heads/$TARGET"
          echo "candidate_sha=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Verify remote target
        shell: bash
        run: |
          set -euo pipefail
          BASE='640b872b2896df9c60f62cbed493fa375aec0fba'
          TARGET='selfrun-drive/v1.3.0-dev1'
          git fetch origin "$TARGET"
          TARGET_SHA=$(git rev-parse "origin/$TARGET")
          test "$(git rev-parse "$TARGET_SHA^")" = "$BASE"
          test "$(git diff --name-only "$BASE" "$TARGET_SHA" | wc -l)" -eq 8
          echo "TARGET_SHA=$TARGET_SHA"
