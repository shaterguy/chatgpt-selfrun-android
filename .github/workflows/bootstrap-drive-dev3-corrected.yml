name: Bootstrap SelfRun Drive dev3 corrected

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev3'

permissions:
  contents: write

jobs:
  apply-dev3-source:
    if: github.event.head_commit.message == 'bootstrap-dev3-corrected'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'

      - name: Apply verified dev3 patch in Git worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/bootstrap_drive_dev3_corrected.py
          python3 .github/scripts/bootstrap_drive_dev3_test_expectations.py
          git diff --check
          git status --short

      - name: Policy and unit tests
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Commit verified dev3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-drive-dev3.yml .github/workflows/bootstrap-drive-dev3-corrected.yml .github/scripts/bootstrap_drive_dev3_corrected.py .github/scripts/bootstrap_drive_dev3_test_expectations.py
          git add -A
          git diff --cached --check
          git commit -m 'fix(drive): add conversation freshness barrier'
          git push origin HEAD:selfrun-drive/v1.3.0-dev3
