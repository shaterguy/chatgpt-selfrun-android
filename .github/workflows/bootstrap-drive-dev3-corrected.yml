name: Bootstrap SelfRun Drive dev3 corrected

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev3'

permissions:
  contents: write

jobs:
  apply-dev3-source:
    if: github.event.head_commit.message == 'bootstrap-dev3-corrected'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Apply verified dev3 patch in Git worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/bootstrap_drive_dev3_corrected.py
          git diff --check
          git status --short

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Commit verified dev3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-drive-dev3.yml .github/workflows/bootstrap-drive-dev3-corrected.yml .github/scripts/bootstrap_drive_dev3_corrected.py
          git add -A
          git diff --cached --check
          git commit -m 'fix(drive): add conversation freshness barrier'
          git push origin HEAD:selfrun-drive/v1.3.0-dev3
