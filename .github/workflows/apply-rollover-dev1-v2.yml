name: Apply SelfRun Drive rollover dev1 v2

on:
  push:
    branches:
      - 'selfrun-drive/v1.7.0-dev1'
    paths:
      - '.github/workflows/apply-rollover-dev1-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.7.0-dev1
          fetch-depth: 0
      - name: Repair strict timeout matcher for this application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_rollover_dev1.py')
          s = p.read_text(encoding='utf-8')
          start = s.index("s = s.replace(\n'''            runLog.record(store,\"POST_DOM_DRIVE_SYNC\"")
          end = s.index("insert_marker = '\\nprivate void replayTerminalSideEffect()'", start)
          replacement = '''timeout_pattern = r''' + '"""' + r'''(?m)^[ \t]*runLog\.record\(store,"POST_DOM_DRIVE_SYNC","result=timeout;maxWaitMs="\+POST_DOM_DRIVE_MAX_WAIT_MS\+";action=pause_fail_closed"\);\n[ \t]*pauseError\("POST_DOM_DRIVE_SYNC_TIMEOUT","Drive 완료 신호를 제한시간 내 확정하지 못해 자동 CONTINUE를 차단했습니다\.",epoch,snapshot\.runId,snapshot\.phase\);return;''' + '"""' + '''
          s, timeout_count = re.subn(timeout_pattern, '        handlePostDomDriveTimeout(epoch,snapshot);return;', s)
          if timeout_count != 2:
              raise SystemExit(f'post-dom timeout replacement expected 2, got {timeout_count}')
          '''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY
      - name: Apply deterministic source transformation
        run: python3 tools/apply_rollover_dev1.py
      - name: Verify transformer output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain app/build.gradle app/src/main/java app/src/test/java)"
          git status --short
      - name: Commit transformed sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java app/src/test/java
          git commit -m 'feat(drive): implement conversation rollover dev1'
          git push origin HEAD:selfrun-drive/v1.7.0-dev1
