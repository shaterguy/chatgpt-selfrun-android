name: SelfRun Drive v1.2.3 Release Readback

on:
  push:
    branches:
      - ops/selfrun-drive-v1.2.3-readback
    paths:
      - .github/workflows/release-readback-v1.2.3.yml

permissions:
  contents: write
  statuses: write

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 640b872b2896df9c60f62cbed493fa375aec0fba
      DRIVE_TAG: drive-v1.2.3
      APK_NAME: chatgpt-selfrun-drive-v1.2.3.apk
      SUMS_NAME: SHA256SUMS.txt
      EVIDENCE_PATH: release-readback-v1.2.3.txt
    steps:
      - name: Verify release and publish readback evidence
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${DRIVE_TAG}"
          CURRENT_STAGE=init
          post_status() {
            local state="$1" context="$2" description="$3"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description" \
              -f target_url="$RELEASE_URL" >/dev/null
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then set +e; post_status failure "release-readback/core" "failed stage=${CURRENT_STAGE} rc=${rc}"; fi' EXIT

          CURRENT_STAGE=tag
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${DRIVE_TAG}" --jq .object.sha)"
          test "$MAIN_SHA" = "$EXPECTED_SHA"
          test "$TAG_SHA" = "$EXPECTED_SHA"
          post_status success "release-readback/tag" "$EXPECTED_SHA"

          CURRENT_STAGE=release
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${DRIVE_TAG}" > release.json
          test "$(jq -r .tag_name release.json)" = "$DRIVE_TAG"
          test "$(jq -r .draft release.json)" = "false"
          test "$(jq -r .prerelease release.json)" = "false"
          post_status success "release-readback/release" "published GitHub Release exists"

          CURRENT_STAGE=assets
          jq -e --arg n "$APK_NAME" '.assets[] | select(.name == $n and .state == "uploaded")' release.json >/dev/null
          jq -e --arg n "$SUMS_NAME" '.assets[] | select(.name == $n and .state == "uploaded")' release.json >/dev/null
          post_status success "release-readback/assets" "APK and SHA256SUMS.txt uploaded"

          CURRENT_STAGE=download
          mkdir -p probe
          gh release download "$DRIVE_TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$APK_NAME" -p "$SUMS_NAME" -D probe
          post_status success "release-readback/download" "release assets downloaded"

          CURRENT_STAGE=checksum
          grep -Fq "$APK_NAME" "probe/$SUMS_NAME"
          EXPECTED_APK_SHA="$(head -n 1 "probe/$SUMS_NAME" | awk '{print $1}')"
          ACTUAL_APK_SHA="$(sha256sum "probe/$APK_NAME" | awk '{print $1}')"
          test -n "$EXPECTED_APK_SHA"
          test "$EXPECTED_APK_SHA" = "$ACTUAL_APK_SHA"
          APK_SIZE="$(stat -c %s "probe/$APK_NAME")"
          PUBLISHED_AT="$(jq -r .published_at release.json)"
          printf '%s\n' \
            "repository=$GITHUB_REPOSITORY" \
            "default_branch=main" \
            "main_sha=$MAIN_SHA" \
            "release_tag=$DRIVE_TAG" \
            "release_url=$RELEASE_URL" \
            "apk_name=$APK_NAME" \
            "apk_size_bytes=$APK_SIZE" \
            "apk_sha256=$ACTUAL_APK_SHA" \
            "checksum_asset=$SUMS_NAME" \
            "published_at=$PUBLISHED_AT" \
            "status=RELEASED_AND_VERIFIED" > evidence.txt

          CURRENT_STAGE=evidence
          CONTENT_B64="$(base64 -w0 evidence.txt)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${EVIDENCE_PATH}" \
            -f message='chore(release): record v1.2.3 readback evidence' \
            -f content="$CONTENT_B64" \
            -f branch="$GITHUB_REF_NAME" >/dev/null

          post_status success "release-readback/checksum" "SHA256SUMS digest matches APK"
          post_status success "release-readback/apk-sha256" "$ACTUAL_APK_SHA"
          post_status success "release-readback/apk-size" "${APK_SIZE} bytes"
          post_status success "release-readback/published" "$PUBLISHED_AT"
          post_status success "release-readback/core" "main/tag/release/assets verified"
