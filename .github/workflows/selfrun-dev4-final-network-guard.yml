name: SelfRun Drive dev4 final network guard

on:
  push:
    branches:
      - 'selfrun-drive/v1.3.0-dev4'

permissions:
  contents: write

jobs:
  apply-final-network-guard:
    if: ${{ !contains(github.event.head_commit.message, '[network-guard-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.3.0-dev4
      - name: Apply stale recovery callback guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          service=Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          tests=Path('app/src/test/java/com/shaterguy/chatgptselfrun/ConversationFreshnessBarrierTest.java')
          s=service.read_text(encoding='utf-8')
          t=tests.read_text(encoding='utf-8')
          old='postWebCallback(()->{mainFrameRecoveryPending=false;if(view!=webView)return;String target=canonicalUrl();'
          new='postWebCallback(()->{if(view!=webView||!mainFrameRecoveryPending||mainFrameRecoveryAttempts!=attempt)return;mainFrameRecoveryPending=false;String target=canonicalUrl();'
          if s.count(old)!=1:
              raise SystemExit(f'stale recovery callback: expected 1 match, got {s.count(old)}')
          s=s.replace(old,new,1)
          old_test='        assertTrue(recovery.contains("enterPreservedPause"));\n        assertEquals(1,count(recovery,"view.loadUrl(target)"));'
          new_test='        assertTrue(recovery.contains("enterPreservedPause"));\n        assertTrue(recovery.contains("!mainFrameRecoveryPending"));\n        assertTrue(recovery.contains("mainFrameRecoveryAttempts!=attempt"));\n        assertTrue(recovery.indexOf("!mainFrameRecoveryPending")<recovery.indexOf("view.loadUrl(target)"));\n        assertEquals(1,count(recovery,"view.loadUrl(target)"));'
          if t.count(old_test)!=1:
              raise SystemExit(f'network recovery regression test: expected 1 match, got {t.count(old_test)}')
          t=t.replace(old_test,new_test,1)
          service.write_text(s,encoding='utf-8')
          tests.write_text(t,encoding='utf-8')
          PY
          git diff --check
          grep -F '!mainFrameRecoveryPending||mainFrameRecoveryAttempts!=attempt' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          grep -F 'mainFrameRecoveryAttempts!=attempt' app/src/test/java/com/shaterguy/chatgptselfrun/ConversationFreshnessBarrierTest.java
      - name: Commit final guard and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SHatergUY'
          git config user.email '108107617+shaterguy@users.noreply.github.com'
          git rm .github/workflows/selfrun-dev4-final-network-guard.yml
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java app/src/test/java/com/shaterguy/chatgptselfrun/ConversationFreshnessBarrierTest.java
          git commit -m 'fix(drive): cancel stale main-frame recovery callback [network-guard-applied]'
          git push origin HEAD:selfrun-drive/v1.3.0-dev4
