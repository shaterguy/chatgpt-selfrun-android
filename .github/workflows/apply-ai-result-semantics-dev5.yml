name: Apply AI Result Semantics Dev5

on:
  push:
    branches:
      - automation/rebase-ai-result-semantics-3.1.1-dev4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create exact dev5 from 3.1.1-dev4
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/apply_dev5_ai_result_patch.py /tmp/apply_dev5_ai_result_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 5c446ba8c8d4ff0a33df67508041e87a467201af
          git checkout -B v3.1.1-dev5 fad3d246372db7ff341646e68141a58f26957ffd
          git checkout 5c446ba8c8d4ff0a33df67508041e87a467201af -- \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3EngineTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3DisposableExecutionTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3ArchitectureTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3TrailingBraceRecoveryTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/TurnDocumentRetryWiringTest.java
          python3 /tmp/apply_dev5_ai_result_patch.py
          grep -Fq "def selfRunDriveVersionCode = 3011005" app/build.gradle
          grep -Fq "def selfRunDriveVersionName = '3.1.1-dev5'" app/build.gradle
          grep -Fq 'case RESULT_BASELINE' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java
          grep -Fq 'case RESULT_MUTATED' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java
          grep -Fq 'routingPhase' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java
          grep -Fq 'usableParallelPlan' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java
          ! grep -Fq 'full handoff missing' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java
          ! grep -Fq 'verification required for DONE' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java
          grep -Fq 'PREVIOUS_TEST=previous/chatgpt-selfrun-drive-test-v3.1.1-dev4.apk' tools/verify_selfrun3_candidate_emulator.sh
          tools/verify_drive_variant.sh
          git add app/build.gradle \
            app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3EngineTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3DisposableExecutionTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3ArchitectureTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3TrailingBraceRecoveryTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/TurnDocumentRetryWiringTest.java \
            tools/verify_drive_variant.sh tools/verify_selfrun3_candidate_emulator.sh
          git commit -m "fix(selfrun3): delegate result semantics to AI on 3.1.1-dev4"
          git push origin HEAD:refs/heads/v3.1.1-dev5
