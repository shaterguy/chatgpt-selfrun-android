name: Verify and release SelfRun v0.2.2

on:
  push:
    branches:
      - main
      - v0.2.2-rc1

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK and zstd
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          sudo apt-get update
          sudo apt-get install -y zstd
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Reconstruct and verify exact signed v0.2.2 APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          SRC=app/build/outputs/apk/release/app-release-unsigned.apk
          CANONICAL=chatgpt-selfrun-android-v0.2.2-canonical-unsigned.apk
          APK=chatgpt-selfrun-android-v0.2.2.apk
          gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
          test -s "$SRC"
          python3 tools/canonicalize_apk.py "$SRC" "$CANONICAL"
          echo '5f0f5b41bd1580f4f8b335d75ef96e3b1c8365ebbf3cc9976f8196f86117ec7b  chatgpt-selfrun-android-v0.2.2-canonical-unsigned.apk' | sha256sum --check --strict
          printf '%s' '' | base64 --decode > signed.patch.zst
          echo 'a83dfe3d78393543db7b90d8dbf74b7f6aed48bafa775cd4be8e7627cf277dfa  signed.patch.zst' | sha256sum --check --strict
          zstd -d --patch-from="$CANONICAL" signed.patch.zst -o "$APK"
          test "$(stat -c %s "$APK")" -eq 697859
          echo '9273548aed901884f270888614690b7a81e043ec56084d36e06a790f57e045a9  chatgpt-selfrun-android-v0.2.2.apk' | sha256sum --check --strict
          "$BT/aapt" dump badging "$APK" | tee BADGING.txt
          grep -q "package: name='com.shaterguy.chatgptselfrun'" BADGING.txt
          grep -q "versionCode='12'" BADGING.txt
          grep -q "versionName='0.2.2'" BADGING.txt
          java -jar "$BT/lib/apksigner.jar" verify --verbose --print-certs "$APK" | tee APKSIGNER.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' APKSIGNER.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' APKSIGNER.txt
          grep -q 'Number of signers: 1' APKSIGNER.txt
          grep -q 'Signer #1 certificate SHA-256 digest: b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' APKSIGNER.txt
          "$BT/zipalign" -c -v 4 "$APK"
          unzip -t "$APK" >/dev/null
          echo '9273548aed901884f270888614690b7a81e043ec56084d36e06a790f57e045a9  chatgpt-selfrun-android-v0.2.2.apk' > SHA256SUMS.txt
      - name: Publish v0.2.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.2.2
          APK=chatgpt-selfrun-android-v0.2.2.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release download "$TAG" --pattern "$APK" --dir existing-release
            echo '9273548aed901884f270888614690b7a81e043ec56084d36e06a790f57e045a9  existing-release/chatgpt-selfrun-android-v0.2.2.apk' | sha256sum --check --strict
            exit 0
          fi
          cat > RELEASE_NOTES.md <<'EOF'
          v0.2.1-dev2의 검증된 변경사항을 정식 버전으로 승격한 릴리스입니다.

          - SELF_RUN_USER_ACTION_REQUIRED, SELF_RUN_PAUSE, 사용자 수동 일시정지를 WebView 보존형 일시정지로 통일했습니다.
          - 재개 시 동일 WebView·동일 conversation에서 기존 SELF_RUN_CONTINUE 흐름을 유지합니다.
          - 긴 명령어 입력창의 터치 스크롤과 편집 사용성을 개선했습니다.
          - stale DOM callback이 공유 상태를 오염시키는 경합을 방지하는 보호 로직과 회귀 테스트를 보강했습니다.
          - 기존 Work/Chat 모델·추론 전환 및 continuation 흐름은 유지합니다.
          - versionName: 0.2.2 / versionCode: 12
          - SelfRun bootstrap protocol: 0.1.0
          - APK SHA-256: 9273548aed901884f270888614690b7a81e043ec56084d36e06a790f57e045a9
          - 인증서 SHA-256: b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe
          EOF
          gh release create "$TAG" "$APK" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'v0.2.2' \
            --notes-file RELEASE_NOTES.md \
            --latest
