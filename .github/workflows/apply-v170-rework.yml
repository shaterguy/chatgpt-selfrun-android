name: Apply v1.7.0 targeted rework

on:
  push:
    branches:
      - 'selfrun-drive/v1.7.0-dev1'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.7.0-dev1
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply exact source patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/apply_v170_rework.py')
          t=p.read_text()
          old="    if 'ChatReasoningPreferenceStore.PRO' in p.read_text():"
          new="    if re.search(r'ChatReasoningPreferenceStore\\.PRO(?!_)', p.read_text()):"
          assert t.count(old)==1
          p.write_text(t.replace(old,new))
          PY
          python3 .github/apply_v170_rework.py
          git diff --check
          git status --short
      - name: Compile and test patched source
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name 'SelfRun Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app
          test -n "$(git diff --cached --name-only)"
          git commit -m '[v170-rework-applied] fix(drive): exact chat state and bounded no-start'
          git push origin HEAD:selfrun-drive/v1.7.0-dev1
