name: SelfRun Drive v1.2.2-dev5 Builder

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.2-dev5'
    paths:
      - '.github/workflows/v122-dev5-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.2.2-dev5
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply, test, build, and commit
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          LOG=/tmp/v122-dev5-builder.log
          run_all() {
            set -euo pipefail
            cat tools/.v122_dev5_patch_1.part \
                tools/.v122_dev5_patch_2.part \
                tools/.v122_dev5_patch_3.part \
                tools/.v122_dev5_patch_4.part \
                tools/.v122_dev5_patch_5.part \
                tools/.v122_dev5_patch_6.part > tools/apply_v122_dev5_patch.py
            python3 -m py_compile tools/apply_v122_dev5_patch.py
            python3 tools/apply_v122_dev5_patch.py
            rm -f tools/.v122_dev5_patch_*.part
            rm -f tools/.v122_dev5_patch_b64_*.part
            rm -rf tools/__pycache__
            test ! -e tools/apply_v122_dev5_patch.py
            test ! -e .github/workflows/v122-dev5-builder.yml
            git diff --check
            chmod +x tools/verify_drive_variant.sh
            tools/verify_drive_variant.sh
            gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
            gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
            test -s "$APK"
            BT="$ANDROID_HOME/build-tools/36.0.0"
            BADGING="$($BT/aapt dump badging "$APK")"
            grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
            grep -Fq "versionCode='1000025'" <<<"$BADGING"
            grep -Fq "versionName='1.2.2-dev5'" <<<"$BADGING"
            grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          }
          set +e
          run_all >"$LOG" 2>&1
          rc=$?
          set -e
          cat "$LOG"
          if [ "$rc" -ne 0 ]; then
            git reset --hard HEAD
            cp "$LOG" tools/.v122_dev5_builder_error.txt
            git add tools/.v122_dev5_builder_error.txt
            git commit -m 'ci(dev5): capture builder failure evidence'
            git push origin HEAD:selfrun-drive/v1.2.2-dev5
            exit "$rc"
          fi
          rm -f tools/.v122_dev5_builder_error.txt
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'feat(drive): add next-input resume reconciliation'
          git push origin HEAD:selfrun-drive/v1.2.2-dev5
