name: Apply SelfRun Drive rollover dev1

on:
  push:
    branches:
      - 'selfrun-drive/v1.7.0-dev1'
    paths:
      - 'tools/apply_rollover_dev1.py'
      - '.github/workflows/apply-rollover-dev1.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.7.0-dev1
          fetch-depth: 0
      - name: Apply deterministic source transformation
        run: python3 tools/apply_rollover_dev1.py
      - name: Verify transformer changed only tracked implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
      - name: Commit transformed sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java app/src/test/java
          git commit -m 'feat(drive): implement conversation rollover dev1'
          git push origin HEAD:selfrun-drive/v1.7.0-dev1
