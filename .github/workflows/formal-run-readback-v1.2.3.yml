name: SelfRun Drive v1.2.3 Formal Run Readback

on:
  push:
    branches:
      - ops/selfrun-drive-v1.2.3-release-recovery
    paths:
      - .github/workflows/formal-run-readback-v1.2.3.yml

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 640b872b2896df9c60f62cbed493fa375aec0fba
      EXPECTED_WORKFLOW_NAME: Release SelfRun Drive
      EXPECTED_ARTIFACT_NAME: selfrun-drive-release-evidence
    steps:
      - name: Read exact formal workflow run and evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&per_page=100" > runs.json
          ROW="$(jq -r --arg n "$EXPECTED_WORKFLOW_NAME" --arg s "$EXPECTED_SHA" '.workflow_runs[] | select(.name==$n and .head_sha==$s) | [.id,.status,.conclusion,.html_url] | @tsv' runs.json | head -1)"
          test -n "$ROW"
          IFS=$'\t' read -r RUN_ID RUN_STATUS RUN_CONCLUSION RUN_URL <<<"$ROW"
          test "$RUN_STATUS" = "completed"
          test "$RUN_CONCLUSION" = "success"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > artifacts.json
          ART_ID="$(jq -r --arg n "$EXPECTED_ARTIFACT_NAME" '.artifacts[] | select(.name==$n and .expired==false) | .id' artifacts.json | head -1)"
          test -n "$ART_ID"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="formal-release-run/${RUN_ID}" \
            -f description="completed success for exact main SHA" \
            -f target_url="$RUN_URL" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="formal-release-evidence/${ART_ID}" \
            -f description="selfrun-drive-release-evidence present" \
            -f target_url="$RUN_URL" >/dev/null
