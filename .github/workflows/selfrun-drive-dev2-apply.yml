name: Apply SelfRun Drive v1.6.1-dev2

on:
  push:
    branches:
      - 'selfrun-drive/v1.6.1-dev2'

permissions:
  contents: write

concurrency:
  group: selfrun-drive-v1.6.1-dev2-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.6.1-dev2
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Apply patch and contract updates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_selfrun_drive_v161_dev2.py
          python3 tools/apply_selfrun_drive_v161_dev2_test_contracts.py
      - name: Verify source and tests
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_drive_variant.sh
          gradle --build-cache --no-daemon --console=plain --stacktrace \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestJavaWithJavac \
            :app:assembleQaApp
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/selfrun-drive-dev2-apply.yml \
                 tools/apply_selfrun_drive_v161_dev2.py \
                 tools/apply_selfrun_drive_v161_dev2_test_contracts.py
          git add app/build.gradle \
                  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunContinuationDom.java \
                  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java \
                  app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java \
                  app/src/main/java/com/shaterguy/chatgptselfrun/MainActivity.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/ChatWorkContinuationContractTest.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/AttachmentUploadPolicyTest.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/BootstrapStageAndDirectPickerPolicyTest.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/BootstrapFiniteStateWiringTest.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/TestAppVariantPolicyTest.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/WebUiCalibrationBackupPolicyTest.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/BootstrapSendFallbackPolicyTest.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/BootstrapSendLivenessPolicyTest.java \
                  app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunContinuationSubmissionVerificationTest.java \
                  app/src/androidTest/java/com/shaterguy/chatgptselfrun/WorkPreferenceDomWebViewTest.java
          git diff --cached --check
          git commit -m 'fix(drive): align Work with common completion observer'
          git push origin HEAD:selfrun-drive/v1.6.1-dev2
