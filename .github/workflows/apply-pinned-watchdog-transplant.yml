name: Apply pinned watchdog transplant

on:
  push:
    branches:
      - 'selfrun-v3/v3.1.1-dev2'

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-v3/v3.1.1-dev2
          fetch-depth: 0
      - name: Apply watchdog delta on user-pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_MAIN=0c3aae3240102b2410bbddc78e039c4820b783c3
          PINNED_BASE=1ff5be180f3329a722783afc0e5cb05ebfdb3eed
          SOURCE=ae3eed80b04b048a45f011d9739cb88c6bf07819
          git merge-base --is-ancestor "$PINNED_BASE" HEAD
          git diff --binary "$BASE_MAIN" "$SOURCE" -- app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java > "$RUNNER_TEMP/engine.patch"
          git apply --3way "$RUNNER_TEMP/engine.patch"
          git checkout "$SOURCE" -- \
            .github/workflows/build-selfrun-v3-candidate.yml \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3ResultWatchdogTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3EarlyObservationTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3ResultReadPowerPolicyTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/TestAppVariantPolicyTest.java \
            app/src/test/java/com/shaterguy/chatgptselfrun/TurnDocumentRetryWiringTest.java \
            tools/verify_drive_variant.sh \
            tools/verify_selfrun3_candidate_emulator.sh
          sed -i \
            -e 's/chatgpt-selfrun-drive-test-v3.1.0-rc2.apk/chatgpt-selfrun-drive-test-v3.1.1-dev1.apk/' \
            -e 's/5c4b6e0d5d815dd74282949b8a87a902362181c4f5ab71260655fa0444837dfc/82857f61844ddbf250d63831dae5718a840f0eafa614c6b35aa53f0038ea2694/' \
            -e 's#https://raw.githubusercontent.com/shaterguy/chatgpt-selfrun-android/5195d95e30bd702fe757a82bfcf1693eff85d774/deliverables/current-test.apk#https://raw.githubusercontent.com/shaterguy/chatgpt-selfrun-android/439965c11f89def7824243f7f0483bdf7b251edc/deliverables/current-test.apk#' \
            -e "s/versionName='3.1.0-rc2'/versionName='3.1.1-dev1'/" \
            tools/verify_selfrun3_candidate_emulator.sh
          grep -Fq "selfRunDriveVersionName = '3.1.1-dev2'" app/build.gradle
          grep -Fq 'selfRunDriveVersionCode = 3011002' app/build.gradle
          grep -Fq 'canonicalContinueNextPhaseCanBypassLegacyTransitionTable' app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3EngineTest.java
          grep -Fq 'unknownNextPhaseIsStillRejected' app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3EngineTest.java
          grep -Fq 'nonterminalResultCannotAdvanceDone' app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3EngineTest.java
          grep -Fq 'doneResultStillRequiresVerifyPhase' app/src/test/java/com/shaterguy/chatgptselfrun/SelfRun3EngineTest.java
          ! grep -Fq 'invalid phase transition' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java
          git rm .github/workflows/apply-pinned-watchdog-transplant.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(selfrun3): transplant watchdog onto pinned baseline'
          git push origin HEAD:selfrun-v3/v3.1.1-dev2
