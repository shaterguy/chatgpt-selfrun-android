name: Apply SelfRun Drive dev4 continuation patch

on:
  push:
    branches:
      - selfrun-drive/v1.4.1-dev4
    paths:
      - .github/workflows/apply-dev4-continuation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: selfrun-drive/v1.4.1-dev4
          fetch-depth: 0
      - name: Apply bounded Service transform
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, got {n}')
              s = s.replace(old, new, 1)

          once('    static final long CONTINUATION_GUARD_MS = 60_000L;\n    static final long SUBMISSION_RETRY_MS = 5 * 60_000L;',
               '    static final long CONTINUATION_GUARD_MS = 0L;\n    static final long SUBMISSION_RETRY_MS = 5 * 60_000L;\n    static final long CONTINUATION_VERIFY_INTERVAL_MS = 250L;\n    static final long CONTINUATION_FAILURE_MS = 2_500L;', 'timing constants')
          once('    private final Runnable webRunnable = this::runWebStep;\n    private final Runnable guardRunnable = this::guardElapsed;',
               '    private final Runnable webRunnable = this::runWebStep;', 'guard runnable')
          once('    private volatile String runtimeRunId = "";\n    private volatile boolean destroyed;',
               '    private volatile String runtimeRunId = "";\n    private String continuationAttemptPrompt = "";\n    private String continuationAttemptMarkerId = "";\n    private volatile boolean destroyed;', 'continuation fields')
          once('private void resumeStateMachine(){if(!canRun())return;String phase=store.phase();if(drivePhase(phase))authorizeAndRunDrive();else if(SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(phase))scheduleGuard();else ensureWebView();}',
               'private void resumeStateMachine(){if(!canRun())return;String phase=store.phase();if(drivePhase(phase))authorizeAndRunDrive();else ensureWebView();}', 'resume guard')
          once('if(SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(store.phase()))scheduleGuard();',
               'if(SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(store.phase()))ensureWebView();', 'poll guard dispatch')

          s, n = re.subn(r'\nprivate void scheduleGuard\(\)\{.*?\}\n\nprivate void guardElapsed\(\)\{.*?\}\n', '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'guard methods: expected one match, got {n}')

          new_run_web = '''private void runWebStep(){if(!canRun()||!isWebAutomationPhase(store.phase())||webView==null||domInFlight)return;maybeCaptureConversationUrl(webView.getUrl());String phase=store.phase();if((SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(phase)||SelfRunStore.PHASE_APPLY_PREFS.equals(phase)||SelfRunStore.PHASE_APPLY_REASONING.equals(phase)||SelfRunStore.PHASE_SEND_CONTINUE.equals(phase))&&store.conversationUrl().isEmpty()){scheduleWeb(2000L);return;}if(!routeAcceptable(webView.getUrl())){recordContinuationRouteMismatch(webView.getUrl());return;}String script;switch(phase){case SelfRunStore.PHASE_BOOTSTRAP->script=SelfRunDom.prepareInitialContext(store.projectUrl(),store.mode(),store.runId());case SelfRunStore.PHASE_BOOTSTRAP_MODEL->script=WorkPreferenceDom.modelForProject(store.projectUrl(),"sol");case SelfRunStore.PHASE_BOOTSTRAP_REASONING->script=WorkPreferenceDom.reasoningForProject(store.projectUrl(),"xhigh");case SelfRunStore.PHASE_BOOTSTRAP_SEND->{String prompt=commandPrompt(SelfRunStore.RETRY_BOOTSTRAP);script=SelfRunDom.sendDriveInitial(store.projectUrl(),prompt,store.commandMarkerId());}case SelfRunStore.PHASE_DRIVE_COMMIT_GUARD->script=SelfRunContinuationDom.buttonState(store.conversationUrl());case SelfRunStore.PHASE_APPLY_PREFS->script=WorkPreferenceDom.modelForConversation(store.conversationUrl(),store.pendingModel());case SelfRunStore.PHASE_APPLY_REASONING->script=WorkPreferenceDom.reasoningForConversation(store.conversationUrl(),store.pendingReasoning());case SelfRunStore.PHASE_SEND_CONTINUE->{String prompt=continuationPrompt();script=SelfRunContinuationDom.prepareDriveTurn(store.conversationUrl(),prompt,continuationMarkerId());}default->{store.setLastError("WEB_STATE_RETRY","Drive V1 WebView 단계를 자동 재확인합니다: "+phase);scheduleWeb(2000L);return;}}evaluate(phase,script);}'''
          s, n = re.subn(r'private void runWebStep\(\)\{.*?\}\n\nprivate void evaluate', new_run_web + '\n\nprivate void evaluate', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'runWebStep: expected one match, got {n}')

          new_evaluate = '''private void evaluate(String phase,String script){WebView active=webView;int epoch=generation;String runId=store.runId();domInFlight=true;active.evaluateJavascript(script,raw->{if(active!=webView||epoch!=generation||!runId.equals(store.runId()))return;domInFlight=false;if(!canRun())return;JSONObject result=parse(raw);String status=result.optString("status","SCRIPT_ERROR"),detail=result.optString("detail","");if("TARGET_ERROR".equals(status)){recordContinuationTargetError(phase);if(!isContinuationDiagnosticPhase(phase))restoreCanonical();else scheduleWeb(CONTINUATION_VERIFY_INTERVAL_MS);return;}if("AUTH_REQUIRED".equals(status)){enterPreservedPause("CHATGPT_AUTH_REQUIRED","ChatGPT 로그인 필요 · 사용자 조치 대기",false);NotificationHelper.notifyUser(this,"확인 필요",store.status());return;}if(SelfRunStore.PHASE_SEND_CONTINUE.equals(phase)){if("SUBMISSION_CONFIRMED".equals(status)){continuationSubmitted(detail);return;}if("VERIFY_REQUIRED".equals(status)){String prompt=continuationPrompt();evaluate(phase,SelfRunContinuationDom.verifyDriveTurnSubmission(store.conversationUrl(),prompt,continuationMarkerId(),CONTINUATION_FAILURE_MS));return;}if("CONTINUE_CLICKED".equals(status)||"SUBMISSION_PENDING".equals(status)||"SUBMISSION_FAILED".equals(status)||"COMPOSER_CLEARING".equals(status)||"COMPOSER_INPUTTING".equals(status)||SelfRunContinuationDom.STOP.equals(status)||SelfRunContinuationDom.SEND_DISABLED.equals(status)||SelfRunContinuationDom.UNKNOWN.equals(status)||"SCRIPT_ERROR".equals(status)){recordContinuationWait(phase,status,detail);scheduleWeb(CONTINUATION_VERIFY_INTERVAL_MS);return;}}if(SelfRunStore.PHASE_BOOTSTRAP_SEND.equals(phase)&&("MARKER_FAILED".equals(status)||"SCRIPT_ERROR".equals(status)||"BOOTSTRAP_SUBMISSION_AMBIGUOUS".equals(status)||"BOOTSTRAP_SUBMISSION_PENDING".equals(status))){commandSubmitted(SelfRunStore.RETRY_BOOTSTRAP,status);return;}if("BOOTSTRAP_SUBMITTED".equals(status)){commandSubmitted(SelfRunStore.RETRY_BOOTSTRAP,status);return;}if("UI_WAIT".equals(status)||"WAIT".equals(status)){recordContinuationWait(phase,status,detail);scheduleWeb("WAIT".equals(status)?2000L:1200L);return;}handleWebResult(phase,status,result);});}'''
          s, n = re.subn(r'private void evaluate\(String phase,String script\)\{.*?\}\n\nprivate void recordContinuationWait', new_evaluate + '\n\nprivate void recordContinuationWait', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'evaluate: expected one match, got {n}')

          once('private static boolean isContinuationDiagnosticPhase(String phase){return SelfRunStore.PHASE_APPLY_PREFS.equals(phase)||SelfRunStore.PHASE_APPLY_REASONING.equals(phase)||SelfRunStore.PHASE_SEND_CONTINUE.equals(phase);}',
               'private static boolean isContinuationDiagnosticPhase(String phase){return SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(phase)||SelfRunStore.PHASE_APPLY_PREFS.equals(phase)||SelfRunStore.PHASE_APPLY_REASONING.equals(phase)||SelfRunStore.PHASE_SEND_CONTINUE.equals(phase);}', 'diagnostic phases')

          new_handle = '''private void handleWebResult(String phase,String status,JSONObject result){if(SelfRunStore.PHASE_BOOTSTRAP.equals(phase)&&"READY".equals(status)){transition(SelfRunStore.MODE_WORK.equals(store.mode())?SelfRunStore.PHASE_BOOTSTRAP_MODEL:SelfRunStore.PHASE_BOOTSTRAP_SEND,"ChatGPT bootstrap 설정 준비","context_ready");scheduleWeb(250L);return;}if(SelfRunStore.PHASE_BOOTSTRAP_MODEL.equals(phase)&&"READY".equals(status)){transition(SelfRunStore.PHASE_BOOTSTRAP_REASONING,"첫 턴 Work 추론 적용","model_ready");scheduleWeb(250L);return;}if(SelfRunStore.PHASE_BOOTSTRAP_REASONING.equals(phase)&&"READY".equals(status)){transition(SelfRunStore.PHASE_BOOTSTRAP_SEND,"첫 프롬프트 전송 준비","reasoning_ready");scheduleWeb(250L);return;}if(SelfRunStore.PHASE_BOOTSTRAP_SEND.equals(phase)&&"READY_TO_SUBMIT".equals(status)){String prompt=commandPrompt(SelfRunStore.RETRY_BOOTSTRAP);evaluate(phase,SelfRunDom.clickPreparedDriveInitial(store.projectUrl(),prompt,store.commandMarkerId()));return;}if(SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(phase)){if(SelfRunContinuationDom.SEND_ENABLED.equals(status)){String next=SelfRunStore.MODE_WORK.equals(store.mode())?SelfRunStore.PHASE_APPLY_PREFS:SelfRunStore.PHASE_SEND_CONTINUE;transition(next,"Drive TURN_COMPLETED 확인 · internal WebView SEND 준비","send_ready");scheduleWeb(CONTINUATION_VERIFY_INTERVAL_MS);return;}scheduleWeb(CONTINUATION_VERIFY_INTERVAL_MS);return;}if(SelfRunStore.PHASE_APPLY_PREFS.equals(phase)&&"READY".equals(status)){transition(SelfRunStore.PHASE_APPLY_REASONING,"다음 턴 추론 적용","model_ready");scheduleWeb(250L);return;}if(SelfRunStore.PHASE_APPLY_REASONING.equals(phase)&&"READY".equals(status)){evaluate(phase,SelfRunContinuationDom.buttonState(store.conversationUrl()));return;}if(SelfRunStore.PHASE_APPLY_REASONING.equals(phase)&&SelfRunContinuationDom.SEND_ENABLED.equals(status)){transition(SelfRunStore.PHASE_SEND_CONTINUE,"Work MODEL/REASONING 적용 후 SEND 재확인 완료","reasoning_send_ready");scheduleWeb(CONTINUATION_VERIFY_INTERVAL_MS);return;}if(SelfRunStore.PHASE_APPLY_REASONING.equals(phase)){scheduleWeb(CONTINUATION_VERIFY_INTERVAL_MS);return;}if(SelfRunStore.PHASE_SEND_CONTINUE.equals(phase)&&"READY_TO_SUBMIT".equals(status)){String prompt=continuationPrompt();evaluate(phase,SelfRunContinuationDom.clickPreparedDriveTurn(store.conversationUrl(),prompt,continuationMarkerId()));return;}scheduleWeb(750L);}'''
          s, n = re.subn(r'private void handleWebResult\(String phase,String status,JSONObject result\)\{.*?\}\n\nprivate String driveBootstrap', new_handle + '\n\nprivate String driveBootstrap', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'handleWebResult: expected one match, got {n}')

          once('private String continuationPrompt(){return commandPrompt(SelfRunStore.RETRY_CONTINUE);}',
               'private String continuationPrompt(){if(continuationAttemptPrompt.isEmpty())continuationAttemptPrompt=SelfRunProtocol.driveContinuation(store.runId(),store.pendingNextInput());return continuationAttemptPrompt;}\nprivate String continuationMarkerId(){if(continuationAttemptMarkerId.isEmpty())continuationAttemptMarkerId=store.runId()+":continue:"+store.driveSignalCursor();return continuationAttemptMarkerId;}\nprivate void clearContinuationAttempt(){continuationAttemptPrompt="";continuationAttemptMarkerId="";}\nprivate void continuationSubmitted(String detail){if(!canRun())return;runLog.record(store,"CONTINUATION_SUBMISSION_CONFIRMED","detail="+detail+";command_received_ack=unused");clearContinuationAttempt();transition(SelfRunStore.PHASE_WAIT_DRIVE_COMMIT,"Drive 턴 결과 신호 대기","continuation_submission_confirmed");releaseWakeLock();scheduleDrivePoll(0L);}', 'continuation attempt methods')

          once('private static boolean isWebAutomationPhase(String phase){return SelfRunStore.PHASE_BOOTSTRAP.equals(phase)||SelfRunStore.PHASE_BOOTSTRAP_MODEL.equals(phase)||SelfRunStore.PHASE_BOOTSTRAP_REASONING.equals(phase)||SelfRunStore.PHASE_BOOTSTRAP_SEND.equals(phase)||SelfRunStore.PHASE_APPLY_PREFS.equals(phase)||SelfRunStore.PHASE_APPLY_REASONING.equals(phase)||SelfRunStore.PHASE_SEND_CONTINUE.equals(phase);}',
               'private static boolean isWebAutomationPhase(String phase){return SelfRunStore.PHASE_BOOTSTRAP.equals(phase)||SelfRunStore.PHASE_BOOTSTRAP_MODEL.equals(phase)||SelfRunStore.PHASE_BOOTSTRAP_REASONING.equals(phase)||SelfRunStore.PHASE_BOOTSTRAP_SEND.equals(phase)||SelfRunStore.PHASE_DRIVE_COMMIT_GUARD.equals(phase)||SelfRunStore.PHASE_APPLY_PREFS.equals(phase)||SelfRunStore.PHASE_APPLY_REASONING.equals(phase)||SelfRunStore.PHASE_SEND_CONTINUE.equals(phase);}', 'web phases')

          once('    private void removeAutomationCallbacks() {handler.removeCallbacks(driveRunnable); handler.removeCallbacks(webRunnable);handler.removeCallbacks(guardRunnable); handler.removeCallbacks(driveRetryRunnable);}\n    private void stopAutomationCallbacks() {removeAutomationCallbacks();synchronized (automationStateLock) {automationEpoch++; generation++; authorizationInFlight = false; domInFlight = false;}}',
               '    private void removeAutomationCallbacks() {handler.removeCallbacks(driveRunnable); handler.removeCallbacks(webRunnable);handler.removeCallbacks(driveRetryRunnable);}\n    private void stopAutomationCallbacks() {removeAutomationCallbacks();clearContinuationAttempt();synchronized (automationStateLock) {automationEpoch++; generation++; authorizationInFlight = false; domInFlight = false;}}', 'callback cleanup')

          required = [
              'CONTINUATION_GUARD_MS = 0L',
              'CONTINUATION_VERIFY_INTERVAL_MS = 250L',
              'SelfRunContinuationDom.buttonState',
              'SelfRunContinuationDom.verifyDriveTurnSubmission',
              'command_received_ack=unused',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing transformed token: {token}')
          forbidden = ['guardRunnable', 'scheduleGuard()', 'guardElapsed()']
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'forbidden guard token remains: {token}')

          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          git rm tools/dev4-continuation.patch .github/workflows/apply-dev4-continuation.yml
      - name: Commit transformed source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          git commit -m 'fix(drive): verify continuation submission before retry'
          git push origin HEAD:selfrun-drive/v1.4.1-dev4
