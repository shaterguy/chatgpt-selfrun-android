name: Finalize SelfRun Drive dev4 source invariants

on:
  push:
    branches:
      - selfrun-drive/v1.4.1-dev4
    paths:
      - .github/workflows/dev4-finalize-source.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.4.1-dev4
          fetch-depth: 0
      - name: Apply bounded source corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java')
          s=p.read_text(encoding='utf-8')
          old='private String continuationMarkerId(){if(continuationAttemptMarkerId.isEmpty())continuationAttemptMarkerId=store.runId()+":continue:"+store.driveSignalCursor();return continuationAttemptMarkerId;}'
          new='private String continuationMarkerId(){if(continuationAttemptMarkerId.isEmpty())continuationAttemptMarkerId=store.runId()+":continue:"+store.driveSignalCursor()+":"+store.phaseStartedAt();return continuationAttemptMarkerId;}'
          if s.count(old)!=1: raise SystemExit(f'marker transform expected once, got {s.count(old)}')
          s=s.replace(old,new,1)
          old2='if(!routeAcceptable(webView.getUrl())){recordContinuationRouteMismatch(webView.getUrl());return;}'
          new2='if(!routeAcceptable(webView.getUrl())){recordContinuationRouteMismatch(webView.getUrl());scheduleWeb(CONTINUATION_VERIFY_INTERVAL_MS);return;}'
          if s.count(old2)!=1: raise SystemExit(f'route transform expected once, got {s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'store.phaseStartedAt()' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          grep -Fq 'recordContinuationRouteMismatch(webView.getUrl());scheduleWeb(CONTINUATION_VERIFY_INTERVAL_MS);return;' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          git rm .github/workflows/dev4-finalize-source.yml
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'selfrun-dev4-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunService.java
          git diff --cached --check
          git commit -m 'fix(drive): isolate resume continuation attempt state'
          git push origin HEAD:selfrun-drive/v1.4.1-dev4
