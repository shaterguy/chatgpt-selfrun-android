name: Sign SelfRun Drive 4.0.11-dev2 TEST only

on:
  push:
    branches:
      - fix/selfrun-411dev2-cancelled-no-post-retry
    paths:
      - .github/workflows/selfrun-411dev2-sign.yml

permissions:
  contents: read

jobs:
  sign-test-only:
    name: Build and sign TEST APK only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Verify TEST variant and exact DEV revision
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "def selfRunDriveVersionName = '4.0.11-dev2'" app/build.gradle
          grep -Fq 'def selfRunDriveVersionCode = 4002024' app/build.gradle
          grep -Fq "applicationId 'com.shaterguy.chatgptselfrun.drive'" app/build.gradle
          grep -Fq "applicationIdSuffix '.test'" app/build.gradle
          bash tools/verify_drive_variant.sh
      - name: Package TEST variant only
        shell: bash
        env:
          SELFRUN_FIREBASE_API_KEY: ${{ secrets.SELFRUN_FIREBASE_API_KEY }}
          SELFRUN_FIREBASE_APPLICATION_ID: ${{ secrets.SELFRUN_FIREBASE_APPLICATION_ID }}
          SELFRUN_FIREBASE_PROJECT_ID: ${{ secrets.SELFRUN_FIREBASE_PROJECT_ID }}
          SELFRUN_FIREBASE_SENDER_ID: ${{ secrets.SELFRUN_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain :app:assembleQaApp
          test -s app/build/outputs/apk/qaApp/app-qaApp-unsigned.apk
          mkdir -p signed-test
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/qaApp/app-qaApp-unsigned.apk signed-test/qa-aligned.apk
      - name: Install pinned signing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
      - name: Sign TEST lineage and verify package/certificate
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/qa-test-signing-pass"
          umask 077
          trap 'rm -f "$PASS_FILE"' EXIT
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="signed-test/SelfRun-Drive-TEST-v4.0.11-dev2.apk"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh \
            signed-test/qa-aligned.apk "$PASS_FILE" "$APK" \
            > signed-test/SIGNATURE_VERIFICATION.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" \
            > signed-test/CERTIFICATE.txt
          grep -Fqi '2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e' \
            signed-test/CERTIFICATE.txt
          "$BT/aapt" dump badging "$APK" > signed-test/PACKAGE.txt
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test'" signed-test/PACKAGE.txt
          grep -Fq "versionCode='4002024'" signed-test/PACKAGE.txt
          grep -Fq "versionName='4.0.11-dev2'" signed-test/PACKAGE.txt
          sha256sum "$APK" > signed-test/SHA256SUMS.txt
          git rev-parse HEAD > signed-test/SOURCE_SHA.txt
          rm -f signed-test/qa-aligned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-test-v4.0.11-dev2-qa
          path: |
            signed-test/SelfRun-Drive-TEST-v4.0.11-dev2.apk
            signed-test/SIGNATURE_VERIFICATION.txt
            signed-test/CERTIFICATE.txt
            signed-test/PACKAGE.txt
            signed-test/SHA256SUMS.txt
            signed-test/SOURCE_SHA.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
