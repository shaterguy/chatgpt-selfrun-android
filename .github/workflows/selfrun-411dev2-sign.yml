name: Sign SelfRun Drive 4.0.11-dev2
on:
  push:
    branches:
      - fix/selfrun-411dev2-cancelled-no-post-retry
    paths:
      - .github/workflows/selfrun-411dev2-sign.yml
permissions:
  contents: read
jobs:
  sign-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Check exact source and formal APK identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "def selfRunDriveVersionName = '4.0.11-dev2'" app/build.gradle
          grep -Fq 'def selfRunDriveVersionCode = 4002024' app/build.gradle
          grep -Fq "applicationId 'com.shaterguy.chatgptselfrun.drive'" app/build.gradle
          bash tools/verify_drive_variant.sh
      - name: Build formal unsigned APK for trusted remote signing
        shell: bash
        env:
          SELFRUN_FIREBASE_API_KEY: ${{ secrets.SELFRUN_FIREBASE_API_KEY }}
          SELFRUN_FIREBASE_APPLICATION_ID: ${{ secrets.SELFRUN_FIREBASE_APPLICATION_ID }}
          SELFRUN_FIREBASE_PROJECT_ID: ${{ secrets.SELFRUN_FIREBASE_PROJECT_ID }}
          SELFRUN_FIREBASE_SENDER_ID: ${{ secrets.SELFRUN_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          gradle --build-cache --no-daemon --console=plain :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p signed-output
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk signed-output/unsigned-aligned.apk
      - name: Install pinned signing libraries
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/signing-requirements-linux-x86_64-py312.txt
      - name: Sign verified formal update
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          PASS_FILE="$RUNNER_TEMP/selfrun-signing-pass"
          umask 077
          trap 'rm -f "$PASS_FILE"' EXIT
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=signed-output/SelfRun-Drive-v4.0.11-dev2.apk
          APKSIGNER="$BT/apksigner" bash tools/sign_release.sh signed-output/unsigned-aligned.apk "$PASS_FILE" "$APK" > signed-output/SIGNATURE_VERIFICATION.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > signed-output/CERTIFICATE.txt
          grep -Fqi 'b3ea944ac1e31438ad697482af6d289c5ffeb0119e89c2e54a755c49c48644fe' signed-output/CERTIFICATE.txt
          "$BT/aapt" dump badging "$APK" > signed-output/PACKAGE.txt
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" signed-output/PACKAGE.txt
          grep -Fq "versionCode='4002024'" signed-output/PACKAGE.txt
          grep -Fq "versionName='4.0.11-dev2'" signed-output/PACKAGE.txt
          sha256sum "$APK" > signed-output/SHA256SUMS.txt
          git rev-parse HEAD > signed-output/SOURCE_SHA.txt
          rm signed-output/unsigned-aligned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-v4.0.11-dev2-formal
          path: |
            signed-output/SelfRun-Drive-v4.0.11-dev2.apk
            signed-output/SIGNATURE_VERIFICATION.txt
            signed-output/CERTIFICATE.txt
            signed-output/PACKAGE.txt
            signed-output/SHA256SUMS.txt
            signed-output/SOURCE_SHA.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
