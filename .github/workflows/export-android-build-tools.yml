name: Export Android Build Tools 36

on:
  push:
    branches:
      - ops/selfrun-drive-v1.0.0-signing-tools

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install exact Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$BT/apksigner"
          test -s "$BT/lib/apksigner.jar"
          test -x "$BT/zipalign"
          test -x "$BT/aapt"
          mkdir -p exported-build-tools/lib
          cp "$BT/apksigner" exported-build-tools/apksigner
          cp "$BT/lib/apksigner.jar" exported-build-tools/lib/apksigner.jar
          cp "$BT/zipalign" exported-build-tools/zipalign
          cp "$BT/aapt" exported-build-tools/aapt
          sha256sum exported-build-tools/apksigner exported-build-tools/lib/apksigner.jar exported-build-tools/zipalign exported-build-tools/aapt > exported-build-tools/SHA256SUMS.txt
      - name: Upload exact build tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build-tools-36-signing
          path: exported-build-tools/
          if-no-files-found: error
          retention-days: 1
