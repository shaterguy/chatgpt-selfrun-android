import org.json.JSONObject;
import org.junit.Test;

import static org.junit.Assert.assertEquals;

public final class BootstrapRunStateSummaryTest {
    @Test public void historySummaryUsesPerRunEvidenceInsteadOfPhaseGuessing() throws Exception {
        JSONObject applied = new JSONObject()
                .put("chatReasoningRequested", "instant")
                .put("chatReasoningStatus", BootstrapRunStateStore.REASONING_APPLIED)
                .put("chatReasoningVerified", "instant");
        assertEquals("요청: Instant / 적용: 확인 완료 / 확인: Instant",
                BootstrapRunStateStore.summary(applied));

        JSONObject pending = new JSONObject()
                .put("chatReasoningRequested", "high")
                .put("chatReasoningStatus", BootstrapRunStateStore.REASONING_PENDING);
        assertEquals("요청: High / 적용: 진행 중 / 확인: -",
                BootstrapRunStateStore.summary(pending));

        JSONObject failed = new JSONObject()
                .put("chatReasoningRequested", "pro")
                .put("chatReasoningStatus", BootstrapRunStateStore.REASONING_FAILED)
                .put("chatReasoningFailureCode", BootstrapResultPolicy.TIMEOUT);
        assertEquals("요청: Pro / 적용: 실패 / 확인: - / 오류: " + BootstrapResultPolicy.TIMEOUT,
                BootstrapRunStateStore.summary(failed));
    }

    @Test public void keepAndMissingRecordsStayDistinct() throws Exception {
        JSONObject keep = new JSONObject()
                .put("chatReasoningRequested", "keep")
                .put("chatReasoningStatus", BootstrapRunStateStore.REASONING_KEEP);
        assertEquals("현재 Chat 설정 유지", BootstrapRunStateStore.summary(keep));
        assertEquals("요청값 기록 없음", BootstrapRunStateStore.summary(new JSONObject()));
    }
}
