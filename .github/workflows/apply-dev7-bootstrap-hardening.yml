                BootstrapResultPolicy.fatalStatus(BootstrapResultPolicy.parse(null), 20_000L, 10_000L));
        assertEquals(BootstrapResultPolicy.CALLBACK_INVALID,
                BootstrapResultPolicy.fatalStatus(BootstrapResultPolicy.parse("not-json"), 20_000L, 10_000L));
        assertEquals(BootstrapResultPolicy.CALLBACK_INVALID,
                BootstrapResultPolicy.fatalStatus(BootstrapResultPolicy.parse("{}"), 20_000L, 10_000L));
    }

    @Test public void scriptUnknownAndDeadlineStatusesAreFinite() {
        assertEquals(BootstrapResultPolicy.SCRIPT_ERROR,
                BootstrapResultPolicy.fatalStatus(BootstrapResultPolicy.parse(
                        "{\"status\":\"SCRIPT_ERROR\"}"), 20_000L, 10_000L));
        assertEquals(BootstrapResultPolicy.UNKNOWN_STATUS,
                BootstrapResultPolicy.fatalStatus(BootstrapResultPolicy.parse(
                        "{\"status\":\"SURPRISE\"}"), 20_000L, 10_000L));
        assertEquals(BootstrapResultPolicy.TIMEOUT,
                BootstrapResultPolicy.fatalStatus(BootstrapResultPolicy.parse(
                        "{\"status\":\"UI_WAIT\"}"), 20_000L, 20_000L));
    }

    @Test public void explicitModeAndReasoningFailuresRemainSpecific() {
        String mode = "CHAT_BOOTSTRAP_MODE_READBACK_FAILED";
        String reasoning = "CHAT_REASONING_READBACK_MISMATCH";
        assertEquals(mode, BootstrapResultPolicy.fatalStatus(
                BootstrapResultPolicy.parse("{\"status\":\"" + mode + "\"}"), 20_000L, 10_000L));
        assertEquals(reasoning, BootstrapResultPolicy.fatalStatus(
                BootstrapResultPolicy.parse("{\"status\":\"" + reasoning + "\"}"), 20_000L, 10_000L));
    }
}
