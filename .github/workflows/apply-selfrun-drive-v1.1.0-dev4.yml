name: Apply SelfRun Drive v1.1.0-dev4

on:
  push:
    branches:
      - 'selfrun-drive/v1.1.0-dev4'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.1.0-dev4
          fetch-depth: 0
      - name: Apply scoped source and test changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java',
              'if(SelfRunScript.projectId(project).isEmpty()){Toast.makeText(this,"ChatGPT 프로젝트 주소를 확인하세요.",Toast.LENGTH_LONG).show();return;}',
              'if(!project.isEmpty()&&SelfRunScript.projectId(project).isEmpty()){Toast.makeText(this,"ChatGPT 프로젝트 주소를 확인하세요.",Toast.LENGTH_LONG).show();return;}'
          )
          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java',
              'store.start(runId,selectedMode,project,request);',
              'store.start(runId,selectedMode,project.isEmpty()?SelfRunScript.GENERAL_CHAT_URL:project,request);'
          )

          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunScript.java',
              '''final class SelfRunScript {\n    private SelfRunScript() {}\n\n    static String projectId(String url) {\n        if (url == null) return "";\n        String[] parts = url.split("/");\n        for (int i = 0; i + 1 < parts.length; i++) {\n            if ("g".equals(parts[i])) return parts[i + 1];\n        }\n        return "";\n    }\n''',
              '''final class SelfRunScript {\n    static final String GENERAL_CHAT_URL = "https://chatgpt.com/";\n    static final String GENERAL_CHAT_SCOPE = "__GENERAL_CHAT__";\n\n    private SelfRunScript() {}\n\n    static String projectId(String url) {\n        if (url == null) return "";\n        String normalized = url.trim();\n        if (normalized.isEmpty()) return "";\n        String[] parts = normalized.split("/");\n        for (int i = 0; i + 1 < parts.length; i++) {\n            if ("g".equals(parts[i])) return parts[i + 1];\n        }\n        return isGeneralChatUrl(normalized) ? GENERAL_CHAT_SCOPE : "";\n    }\n\n    static boolean isGeneralChatUrl(String url) {\n        if (url == null) return false;\n        try {\n            java.net.URI uri = java.net.URI.create(url.trim());\n            String host = uri.getHost();\n            if (!("chatgpt.com".equalsIgnoreCase(host) || "www.chatgpt.com".equalsIgnoreCase(host))) return false;\n            String path = uri.getPath();\n            if (path == null || path.isEmpty() || "/".equals(path)) return true;\n            String[] segments = path.split("/");\n            return segments.length == 3 && "c".equals(segments[1]) && !segments[2].isEmpty();\n        } catch (IllegalArgumentException ignored) {\n            return false;\n        }\n    }\n'''
          )

          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunDom.java',
              '''    private static String projectGuard(String project) {\n        return "if(location.hostname!==\'chatgpt.com\'&&location.hostname!==\'www.chatgpt.com\')return result(\'TARGET_ERROR\',\'호스트 불일치\');const p=location.pathname.split(\'/\').filter(Boolean);const afterProject=k=>{const i=p.indexOf(k);return i>=0&&i+1<p.length?p[i+1]:\'\'};if(afterProject(\'g\')!==" + project + ")return result(\'TARGET_ERROR\',\'프로젝트 불일치\');";\n    }\n''',
              '''    private static String projectGuard(String project) {\n        String general = q(SelfRunScript.GENERAL_CHAT_SCOPE);\n        return "if(location.hostname!==\'chatgpt.com\'&&location.hostname!==\'www.chatgpt.com\')return result(\'TARGET_ERROR\',\'호스트 불일치\');const p=location.pathname.split(\'/\').filter(Boolean);const afterProject=k=>{const i=p.indexOf(k);return i>=0&&i+1<p.length?p[i+1]:\'\'};const expectedProject=" + project + ";const actualProject=afterProject(\'g\');"\n                + "if(expectedProject===" + general + "){const generalNew=p.length===0;const generalConversation=p.length===2&&p[0]===\'c\'&&!!p[1];if(!generalNew&&!generalConversation)return result(\'TARGET_ERROR\',\'일반 Chat 범위 이탈\');}else if(actualProject!==expectedProject)return result(\'TARGET_ERROR\',\'프로젝트 불일치\');";\n    }\n'''
          )

          patch(
              'app/src/main/java/com/shaterguy/chatgptselfrun/WorkPreferenceDom.java',
              '''    private static String projectGuard(String projectId) {\n        return "if(location.hostname!==\'chatgpt.com\'&&location.hostname!==\'www.chatgpt.com\')return result(\'TARGET_ERROR\',\'호스트 불일치\');const p=location.pathname.split(\'/\').filter(Boolean);const after=k=>{const i=p.indexOf(k);return i>=0&&i+1<p.length?p[i+1]:\'\'};if(after(\'g\')!==" + q(projectId) + ")return result(\'TARGET_ERROR\',\'프로젝트 불일치\');";\n    }\n''',
              '''    private static String projectGuard(String projectId) {\n        String expected = q(projectId), general = q(SelfRunScript.GENERAL_CHAT_SCOPE);\n        return "if(location.hostname!==\'chatgpt.com\'&&location.hostname!==\'www.chatgpt.com\')return result(\'TARGET_ERROR\',\'호스트 불일치\');const p=location.pathname.split(\'/\').filter(Boolean);const after=k=>{const i=p.indexOf(k);return i>=0&&i+1<p.length?p[i+1]:\'\'};const expectedProject=" + expected + ";const actualProject=after(\'g\');"\n                + "if(expectedProject===" + general + "){const generalNew=p.length===0;const generalConversation=p.length===2&&p[0]===\'c\'&&!!p[1];if(!generalNew&&!generalConversation)return result(\'TARGET_ERROR\',\'일반 Chat 범위 이탈\');}else if(actualProject!==expectedProject)return result(\'TARGET_ERROR\',\'프로젝트 불일치\');";\n    }\n'''
          )

          protocol = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java')
          text = protocol.read_text(encoding='utf-8')
          for line in [
              '                +"앱은 현재 대화가 Project인지 직접 판정하지 않는다.\\n\\n"\n',
              '                +"위 메타데이터 및 설명 뒤에 사용자가 앱에 입력한 원본 요구사항을 내용 손실이나 요약 없이 그대로 붙인다.\\n\\n"\n',
          ]:
              if line not in text:
                  raise SystemExit(f'bootstrap explanation line missing: {line!r}')
              text = text.replace(line, '', 1)
          protocol.write_text(text, encoding='utf-8')

          patch('app/build.gradle', 'def selfRunDriveVersionCode = 1000007', 'def selfRunDriveVersionCode = 1000008')
          patch("app/build.gradle", "def selfRunDriveVersionName = '1.1.0-dev3'", "def selfRunDriveVersionName = '1.1.0-dev4'")
          patch('tools/verify_drive_variant.sh', "grep -Fq 'selfRunDriveVersionCode = 1000007' \"$BUILD\"", "grep -Fq 'selfRunDriveVersionCode = 1000008' \"$BUILD\"")
          patch('tools/verify_drive_variant.sh', "grep -Fq \"selfRunDriveVersionName = '1.1.0-dev3'\" \"$BUILD\"", "grep -Fq \"selfRunDriveVersionName = '1.1.0-dev4'\" \"$BUILD\"")
          patch('tools/verify_drive_variant.sh', "echo 'SelfRun Drive v1.1.0-dev3 policy checks passed.'", "echo 'SelfRun Drive v1.1.0-dev4 policy checks passed.'")
          patch('app/src/test/java/com/shaterguy/chatgptselfrun/DriveVariantPolicyTest.java', 'selfRunDriveVersionCode = 1000007', 'selfRunDriveVersionCode = 1000008')
          patch('app/src/test/java/com/shaterguy/chatgptselfrun/DriveVariantPolicyTest.java', "selfRunDriveVersionName = '1.1.0-dev3'", "selfRunDriveVersionName = '1.1.0-dev4'")

          patch(
              'app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunProtocolTest.java',
              '        assertTrue(bootstrap.contains("DRIVE_TURN_DOCUMENT_ID=" + DOC));\n',
              '        assertTrue(bootstrap.contains("DRIVE_TURN_DOCUMENT_ID=" + DOC));\n        assertFalse(bootstrap.contains("앱은 현재 대화가 Project인지 직접 판정하지 않는다."));\n        assertFalse(bootstrap.contains("위 메타데이터 및 설명 뒤에 사용자가 앱에 입력한 원본 요구사항을 내용 손실이나 요약 없이 그대로 붙인다."));\n'
          )

          dom_test = Path('app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunDomTest.java')
          text = dom_test.read_text(encoding='utf-8')
          marker = '\n}\n'
          extra = '''\n    @Test public void generalChatScopeSupportsBootstrapAndWorkPreferences() {\n        String initial = SelfRunDom.prepareInitialContext(SelfRunScript.GENERAL_CHAT_URL, SelfRunStore.MODE_CHAT, "SR-20260814-TEST00");\n        String model = WorkPreferenceDom.modelForProject(SelfRunScript.GENERAL_CHAT_URL, "sol");\n        assertTrue(initial.contains("__GENERAL_CHAT__"));\n        assertTrue(initial.contains("일반 Chat 범위 이탈"));\n        assertTrue(model.contains("__GENERAL_CHAT__"));\n        assertTrue(model.contains("일반 Chat 범위 이탈"));\n    }\n'''
          if extra.strip() in text:
              raise SystemExit('general chat DOM test already present')
          if marker not in text:
              raise SystemExit('SelfRunDomTest class terminator missing')
          dom_test.write_text(text.rsplit(marker, 1)[0] + extra + marker, encoding='utf-8')

          Path('app/src/test/java/com/shaterguy/chatgptselfrun/SelfRunGeneralChatPolicyTest.java').write_text('''package com.shaterguy.chatgptselfrun;\n\nimport org.junit.Test;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\nimport static org.junit.Assert.*;\n\npublic class SelfRunGeneralChatPolicyTest {\n    @Test public void rootAndConversationShareGeneralChatScope() {\n        assertEquals(SelfRunScript.GENERAL_CHAT_SCOPE, SelfRunScript.projectId("https://chatgpt.com/"));\n        assertEquals(SelfRunScript.GENERAL_CHAT_SCOPE, SelfRunScript.projectId("https://chatgpt.com/c/conversation123"));\n        assertTrue(SelfRunScript.isGeneralChatUrl("https://chatgpt.com/"));\n        assertTrue(SelfRunScript.isGeneralChatUrl("https://www.chatgpt.com/c/conversation123"));\n        assertFalse(SelfRunScript.isGeneralChatUrl("https://chatgpt.com/g/g-p-test"));\n        assertFalse(SelfRunScript.isGeneralChatUrl("https://chatgpt.com/settings"));\n        assertFalse(SelfRunScript.isGeneralChatUrl("https://example.com/c/conversation123"));\n    }\n\n    @Test public void blankProjectIsAcceptedAndMappedInternallyToGeneralChatRoot() throws Exception {\n        String activity = src("SelfRunNewActivity.java");\n        assertTrue(activity.contains("if(!project.isEmpty()&&SelfRunScript.projectId(project).isEmpty())"));\n        assertTrue(activity.contains("project.isEmpty()?SelfRunScript.GENERAL_CHAT_URL:project"));\n        assertTrue(activity.contains("store.setDefaultProjectUrl(project)"));\n    }\n\n    private static String src(String file) throws Exception {\n        Path path = Paths.get("app/src/main/java/com/shaterguy/chatgptselfrun/" + file);\n        if (!Files.exists(path)) path = Paths.get("src/main/java/com/shaterguy/chatgptselfrun/" + file);\n        return new String(Files.readAllBytes(path), StandardCharsets.UTF_8);\n    }\n}\n''', encoding='utf-8')

          for path in [
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunProtocol.java',
              'app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunNewActivity.java',
          ]:
              t = Path(path).read_text(encoding='utf-8')
              if '앱은 현재 대화가 Project인지 직접 판정하지 않는다.' in t or '위 메타데이터 및 설명 뒤에 사용자가 앱에 입력한 원본 요구사항을 내용 손실이나 요약 없이 그대로 붙인다.' in t:
                  raise SystemExit(f'obsolete bootstrap explanation remains in {path}')
          PY
      - name: Remove one-shot workflow and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-selfrun-drive-v1.1.0-dev4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: support general Chat SelfRun Drive bootstrap'
          git push origin HEAD:selfrun-drive/v1.1.0-dev4
