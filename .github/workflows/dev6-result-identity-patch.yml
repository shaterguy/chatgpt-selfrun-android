name: Apply dev6 Result identity repair

on:
  push:
    branches:
      - selfrun-v3/v3.2.5-dev6-result-identity-repair
    paths:
      - .github/workflows/dev6-result-identity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Apply exact minimal repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java')
          text = engine.read_text()
          old_return = '        return Boolean.TRUE.equals(r.opt("committed")) ? r : null;'
          marker = '    }\n    private static String routingPhase(JSONObject r,State s) {'
          helper = '''    }
          static boolean exactResultIdentity(JSONObject r,State s) {
              if(r==null || s==null) return false;
              Object turn=r.opt("turn");
              boolean exactTurn=(turn instanceof Integer || turn instanceof Long)
                      && ((Number)turn).longValue()==s.turn();
              return RESULT_SCHEMA.equals(r.optString("schema"))
                      && s.taskId().equals(r.optString("task_id"))
                      && s.turnId().equals(r.optString("turn_id"))
                      && exactTurn
                      && s.resource("resultDocumentId").equals(r.optString("document_id"))
                      && (s.turnId()+":result").equals(r.optString("event_id"));
          }
          private static String routingPhase(JSONObject r,State s) {'''
          if text.count(old_return) != 1 or text.count(marker) != 1:
              raise SystemExit('parseResult anchors mismatch')
          text = text.replace(old_return, '        return Boolean.TRUE.equals(r.opt("committed")) && exactResultIdentity(r,s) ? r : null;', 1)
          text = text.replace(marker, helper, 1)
          engine.write_text(text)

          policy = Path('app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3ResultDocumentPolicy.java')
          text = policy.read_text()
          parent_gate = '                && expectedParentId != null && expectedParentId.equals(metadata.parentId)\n'
          if text.count(parent_gate) != 1:
              raise SystemExit('readable-result parent gate mismatch')
          policy.write_text(text.replace(parent_gate, '', 1))

          gradle = Path('app/build.gradle')
          text = gradle.read_text()
          old_code = 'def selfRunDriveVersionCode = 3025005'
          old_name = "def selfRunDriveVersionName = '3.2.5-dev5'"
          if text.count(old_code) != 1 or text.count(old_name) != 1:
              raise SystemExit('version baseline mismatch')
          text = text.replace(old_code, 'def selfRunDriveVersionCode = 3025006', 1)
          text = text.replace(old_name, "def selfRunDriveVersionName = '3.2.5-dev6'", 1)
          gradle.write_text(text)
          PY
          git diff --check
          git diff -- app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3ResultDocumentPolicy.java app/build.gradle
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/dev6-result-identity-patch.yml
          git add app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3Engine.java app/src/main/java/com/shaterguy/chatgptselfrun/SelfRun3ResultDocumentPolicy.java app/build.gradle
          git commit -m 'fix: enforce Result identity and exact-file authority'
          git push origin HEAD:selfrun-v3/v3.2.5-dev6-result-identity-repair
