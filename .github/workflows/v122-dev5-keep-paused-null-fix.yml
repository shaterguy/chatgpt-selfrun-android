name: SelfRun Drive dev5 null-safe pause latch fix

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.2-dev5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.2.2-dev5
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: true
      - name: Apply null-safe latch fix and verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'selfrun-drive/v1.2.2-dev5'
          test "$(git merge-base HEAD d4ee904ac99747beaa49421e901a92e4f4f49a05)" = 'd4ee904ac99747beaa49421e901a92e4f4f49a05'
          python3 tools/tmp_v122_dev5_keep_paused_null_fix.py
          git diff --check
          grep -Fq 'if(blocking==null){e.putString("status","재개 보류 · 기존 pause latch 유지");}else{' app/src/main/java/com/shaterguy/chatgptselfrun/SelfRunStore.java
          grep -Fq 'assertNull(userAction.event)' app/src/test/java/com/shaterguy/chatgptselfrun/DriveResumePolicyTest.java
          grep -Fq 'assertNull(aiPause.event)' app/src/test/java/com/shaterguy/chatgptselfrun/DriveResumePolicyTest.java
          chmod +x tools/verify_drive_variant.sh
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain :app:testDebugUnitTest --tests com.shaterguy.chatgptselfrun.DriveResumePolicyTest --tests com.shaterguy.chatgptselfrun.SelfRunPauseResumeTest
          gradle --no-daemon --console=plain :app:testDebugUnitTest
          gradle --no-daemon --console=plain :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
          grep -Fq "versionCode='1000025'" <<<"$BADGING"
          grep -Fq "versionName='1.2.2-dev5'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
          test -z "$(git diff d4ee904ac99747beaa49421e901a92e4f4f49a05 -- app/src/main/AndroidManifest.xml)"
      - name: Commit verified product tree and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v122-dev5-keep-paused-null-fix.yml tools/tmp_v122_dev5_keep_paused_null_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(drive): keep no-material AI pause latched'
          git push origin HEAD:selfrun-drive/v1.2.2-dev5
