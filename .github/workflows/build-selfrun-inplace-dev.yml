name: Build SelfRun in-place DEV update

on:
  push:
    branches:
      - 'selfrun-v4/v4.0.11-dev4'

permissions:
  contents: write

jobs:
  sign-existing-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Validate historical in-place DEV lineage
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "selfRunDriveVersionCode = 4002026" app/build.gradle
          grep -Fq "selfRunDriveVersionName = '4.0.11-dev4'" app/build.gradle
          grep -Fq "applicationId 'com.shaterguy.chatgptselfrun.drive'" app/build.gradle
          grep -Fq "applicationIdSuffix '.test'" app/build.gradle
          ! grep -Fq "applicationIdSuffix '.dev'" app/build.gradle

      - name: Verify prepared APK without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-input release-output
          gh release download selfrun-v4.0.11-dev4-build-input --repo "$GITHUB_REPOSITORY" --dir build-input
          python3 - <<'CHECK'
          import hashlib,json,os,pathlib
          root=pathlib.Path('build-input'); proof=json.loads((root/'BUILD_INPUT.json').read_text())
          assert proof['source_sha']==os.environ['GITHUB_SHA']
          assert proof['version_name']=='4.0.11-dev4' and proof['version_code']==4002026
          assert proof['package']=='com.shaterguy.chatgptselfrun.drive.test'
          assert hashlib.sha256((root/'app-qaApp-unsigned.apk').read_bytes()).hexdigest()==proof['unsigned_sha256']
          assert proof['validation_passed'] is True
          CHECK
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging build-input/app-qaApp-unsigned.apk > build-input/BADGING.txt
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test' versionCode='4002026' versionName='4.0.11-dev4'" build-input/BADGING.txt
          "$BT/zipalign" -p -f 4 build-input/app-qaApp-unsigned.apk release-output/legacy-dev-aligned.apk

      - name: Prepare existing development signer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all:             -r tools/signing-requirements-linux-x86_64-py312.txt

      - name: Sign one DEV APK with existing update certificate
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SELFRUN_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          umask 077
          PASS_FILE="$RUNNER_TEMP/selfrun-inplace-dev-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="release-output/SelfRun-Drive-v4.0.11-dev4.apk"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh             release-output/legacy-dev-aligned.apk "$PASS_FILE" "$APK"             > release-output/SIGN_REPORT.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > release-output/DEV_CERT.txt
          CERT='2c95a5644a0ef2959eaecf10460e300fe2ee7a4ebcede685a82a52634c22e86e'
          grep -Fqi "$CERT" release-output/DEV_CERT.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' release-output/DEV_CERT.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' release-output/DEV_CERT.txt
          BADGING="$("$BT/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive.test' versionCode='4002026' versionName='4.0.11-dev4'" <<< "$BADGING"
          grep -Fq "application-label:'SelfRun Drive DEV'" <<< "$BADGING"
          sha256sum "$APK" > release-output/SHA256SUMS.txt
          printf '%s' "$GITHUB_SHA" > release-output/SOURCE_COMMIT.txt

      - name: Publish single updatable DEV APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-dev4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-output/SelfRun-Drive-v4.0.11-dev4.apk
            release-output/SHA256SUMS.txt
            release-output/SOURCE_COMMIT.txt
            release-output/DEV_CERT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish in-place DEV prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.0.11-dev4 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'SelfRun Drive 4.0.11-dev4' --notes 'Input helper recovery, current parent synchronization on input, and durable completion/stop delivery. Existing DEV package and certificate are preserved.'
          gh release upload v4.0.11-dev4 --repo "$GITHUB_REPOSITORY" release-output/SelfRun-Drive-v4.0.11-dev4.apk release-output/SHA256SUMS.txt release-output/SOURCE_COMMIT.txt release-output/DEV_CERT.txt build-input/BUILD_INPUT.json
