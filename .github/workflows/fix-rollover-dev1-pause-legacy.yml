name: Fix SelfRun Drive rollover dev1 pause legacy

on:
  push:
    branches:
      - 'selfrun-drive/v1.7.0-dev1'
    paths:
      - '.github/workflows/fix-rollover-dev1-pause-legacy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.7.0-dev1
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply pause and legacy corrections
        run: python3 tools/fix_rollover_dev1_pause_legacy.py
      - name: Verify complete JVM suite and QA compile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleQaApp
      - name: Commit verified permanent changes only
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix_rollover_dev1_pause_legacy.py .github/workflows/fix-rollover-dev1-pause-legacy.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(drive): preserve pause and legacy rollover semantics'
          git push origin HEAD:selfrun-drive/v1.7.0-dev1
