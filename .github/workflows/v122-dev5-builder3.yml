name: SelfRun Drive v1.2.2-dev5 Builder 3

on:
  push:
    branches:
      - 'selfrun-drive/v1.2.2-dev5'
    paths:
      - '.github/workflows/v122-dev5-builder3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: selfrun-drive/v1.2.2-dev5
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.v122_dev5_patch_1.part \
              tools/.v122_dev5_patch_2.part \
              tools/.v122_dev5_patch_3.part \
              tools/.v122_dev5_patch_4.part > tools/apply_v122_dev5_patch.py
          tail -n +2 tools/.v122_dev5_patch_5.part >> tools/apply_v122_dev5_patch.py
          cat tools/.v122_dev5_patch_6.part >> tools/apply_v122_dev5_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v122_dev5_patch.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    if count != 1:\n        raise RuntimeError(f'{label}: expected one exact match, got {count}')\n    return text.replace(old, new, 1)", "    if count != 1 and not (count == 0 and label == 'command payload selection'):\n        raise RuntimeError(f'{label}: expected one exact match, got {count}')\n    if count == 0 and label == 'command payload selection':\n        out,n = re.subn(r'^\\s*String activeCommandKind\\(\\)\\s*\\{[^\\n]*\\}\\s*$', new.rstrip('\\n'), text, count=1, flags=re.M)\n        if n != 1: raise RuntimeError(f'{label}: compact source fallback failed')\n        return out\n    return text.replace(old, new, 1)")
          s=s.replace("    if count != 1:\n        raise RuntimeError(f'{label}: expected one regex match, got {count}')\n    return out", "    if count != 1:\n        if count == 0 and label == 'resume methods':\n            out,fallback_count = re.subn(r'void beginManualResumeOverride\\(\\)\\{.*?void captureConversationUrl', lambda _: replacement, text, count=1, flags=re.S)\n            if fallback_count == 1: return out\n        raise RuntimeError(f'{label}: expected one regex match, got {count}')\n    return out")
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile tools/apply_v122_dev5_patch.py
          python3 tools/apply_v122_dev5_patch.py
          git diff --check
      - name: Test Drive policy and unit suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/verify_drive_variant.sh
          tools/verify_drive_variant.sh
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build and verify dev APK identity
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          BADGING="$($BT/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptselfrun.drive'" <<<"$BADGING"
          grep -Fq "versionCode='1000025'" <<<"$BADGING"
          grep -Fq "versionName='1.2.2-dev5'" <<<"$BADGING"
          grep -Fq "application-label:'SelfRun Drive'" <<<"$BADGING"
      - name: Remove builder-only files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v122-dev5-builder.yml \
                .github/workflows/v122-dev5-builder2.yml \
                .github/workflows/v122-dev5-builder3.yml \
                tools/.v122_dev5_patch_*.part \
                tools/.v122_dev5_patch_b64_*.part \
                tools/.v122-safe-*.part \
                tools/.v122_dev5_builder_error.txt \
                tools/apply_v122_dev5_patch.py
          rm -rf tools/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'feat(drive): add next-input resume reconciliation'
          git push origin HEAD:selfrun-drive/v1.2.2-dev5
      - name: Upload failure diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selfrun-drive-v122-dev5-builder3-failure
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 1
